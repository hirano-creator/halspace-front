# partsgate-api（PARTS GATE の業務 API）。秘密情報はここに書かない（wrangler secret put / .dev.vars）。
# Cloudflare アカウントは Space.app・TENQ と同じ h.hirano@hirano50.com（docs/architecture.md §6-1）。操作の前に必ず `npx wrangler whoami` で確かめる。
# 遠隔の開発用環境は作らない（D1 の読み取り上限がアカウント共有のため）。env.dev はローカル（--local）専用。
# ローカルは database_id に関係なく .wrangler/ 内の SQLite を使う。遠隔の D1 を作ったら ID を書き換える。
name = "partsgate-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# ===== 開発（ローカル） =====
[env.dev]
name = "partsgate-api-dev"

# 毎日のバックアップ（日本時間 3 時 = UTC 18 時）。ローカルでは `wrangler dev --test-scheduled` で試せる
[env.dev.triggers]
crons = ["0 18 * * *"]

[env.dev.vars]
APP_ENV = "dev"
HALSPACE_API = "http://127.0.0.1:8000/api"
ALLOWED_ORIGINS = "http://localhost:5174,http://127.0.0.1:5174"
# 開発用の簡易ログイン（"dev-<hs_user_id>"）。本番の設定には絶対に書かない
DEV_AUTH_STUB = "1"
# 簡易ログインで運営者（企業管理ができる人）として扱う hs_user_id
DEV_OPERATOR_IDS = "900001"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "partsgate-db-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "FILES"
bucket_name = "partsgate-files-dev"

# ===== 本番（オーナーの承認なしにデプロイしない。2026-11-07 作成） =====
# DEV_AUTH_STUB・DEV_OPERATOR_IDS は書かない（開発用の簡易ログインを本番で受け付けない）
[env.production]
name = "partsgate-api"

# 毎日のバックアップ（日本時間 3 時 = UTC 18 時。api/src/lib/backup.ts）
[env.production.triggers]
crons = ["0 18 * * *"]

[env.production.vars]
APP_ENV = "production"
HALSPACE_API = "https://halspace-api-production.up.railway.app/api"
ALLOWED_ORIGINS = "https://space-apps.pages.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "partsgate-db"
database_id = "c87fa796-c7b8-4960-aa04-369212479cfc"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "FILES"
bucket_name = "partsgate-files"
