<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A5F">
  <title>マニュアル — What'sNo</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/wn-app.css?v=20260725a">
  <style>
    .v-wrap { max-width: 680px; margin: 0 auto; padding: 0 0 calc(40px + env(safe-area-inset-bottom)); }
    .v-top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; position: sticky; top: 0;
      background: var(--bg); z-index: 20; }
    .v-back { width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; color: var(--primary); text-decoration: none; font-size: 16px; }
    .v-back:hover { background: var(--bg-card); }
    .v-edit { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card); color: var(--primary);
      text-decoration: none; font-size: 13px; font-weight: 700; }
    .v-edit:hover { border-color: var(--accent); color: var(--accent); }

    .v-hero { background: linear-gradient(135deg, #1a3a5c, #0a2540); color: #fff; padding: 24px 22px; margin: 0 16px;
      border-radius: var(--radius-lg); }
    .v-tag { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
    .v-h1 { margin: 8px 0 6px; font-size: 22px; font-weight: 800; line-height: 1.3; }
    .v-desc { font-size: 13.5px; opacity: .92; }
    .v-meta { display: flex; gap: 16px; margin-top: 16px; font-size: 12px; opacity: .85; flex-wrap: wrap; }
    /* ヒーロー内のタグ（濃紺背景なので配色を上書きする） */
    .v-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .v-tags .tag { background: rgba(255,255,255,.16); color: #fff; text-decoration: none; }
    .v-tags .tag:hover { background: rgba(255,255,255,.3); color: #fff; }
    .v-draft-pill { display: inline-block; margin-left: 8px; font-size: 10.5px; font-weight: 700; padding: 2px 9px;
      border-radius: 100px; background: rgba(255,255,255,.2); vertical-align: middle; }

    .v-steps { padding: 8px 16px 0; }
    .v-step { display: flex; gap: 15px; padding: 18px 0; border-bottom: 1px solid var(--border); }
    .v-step:last-child { border-bottom: none; }
    .v-num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff;
      font-weight: 700; display: grid; place-items: center; font-size: 14px; }
    .v-sbody { flex: 1; min-width: 0; }
    .v-shot { width: 100%; max-width: 320px; border-radius: var(--radius); background: var(--bg-card);
      border: 1px solid var(--border); cursor: zoom-in; display: block; }
    /* サムネイル待ちの受け皿。読み込めたら display:contents にして中の <img class="v-shot"> だけを
       残し、PCの「写真＋右にコメント」の並びを従来どおりにする */
    .v-shotwrap { width: 100%; max-width: 320px; aspect-ratio: 4 / 3; border-radius: var(--radius);
      background: var(--bg-card); border: 1px solid var(--border); display: grid; place-items: center;
      color: var(--muted); font-size: 26px; text-decoration: none; }
    .v-shotwrap.wn-has-thumb { display: contents; }
    /* ファイル（PDF等）はサムネイルを出せたときだけ見せる。
       出せなければ下のファイル行だけになり、空のアイコン枠を残さない。 */
    .v-fileshot { display: none; }
    .v-fileshot.wn-has-thumb { display: contents; }
    /* ファイルの手順は「サムネイル → ファイル行」を縦に積む1列にする
       （PCでは説明文がその右に並ぶ） */
    .v-filecol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .v-cap { font-size: 15px; font-weight: 600; color: var(--primary); margin-top: 8px; white-space: pre-wrap; }
    .v-filerow { display: flex; align-items: center; gap: 14px; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px; text-decoration: none; }
    .v-filerow:hover { border-color: var(--accent); }
    .v-fic { width: 42px; height: 42px; flex: none; border-radius: var(--radius); background: #fff; border: 1px solid var(--border);
      display: grid; place-items: center; font-size: 18px; overflow: hidden; }
    .v-fic img { width: 100%; height: 100%; object-fit: cover; }
    .v-fn { font-weight: 700; font-size: 13.5px; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .v-fmeta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

    .v-head-step { padding: 20px 0 8px; }
    .v-head-txt { font-size: 17px; font-weight: 800; color: var(--primary); border-left: 3px solid var(--accent); padding-left: 12px; }
    .v-text-step { padding: 4px 0 18px; border-bottom: 1px solid var(--border); }
    .v-text-body { font-size: 14px; color: var(--primary); white-space: pre-wrap; line-height: 1.7; }

    .v-empty { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 14px; }

    .v-lightbox { position: fixed; inset: 0; background: rgba(10,20,36,.92); display: none; align-items: center;
      justify-content: center; z-index: 200; padding: 20px; cursor: zoom-out; }
    .v-lightbox.show { display: flex; }
    .v-lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
    .v-lightbox .lb-close { position: absolute; top: 16px; right: 20px; color: #fff; font-size: 26px; background: none; border: none; cursor: pointer; }
    .v-lightbox .lb-spin { color: #fff; font-size: 28px; }

    /* PC: 画像の右側にコメントを並べる */
    @media (min-width: 768px) {
      .v-wrap { max-width: 900px; }
      .v-sbody { display: flex; align-items: flex-start; gap: 20px; }
      .v-shot { flex: none; width: 380px; max-width: 50%; }
      .v-shotwrap { flex: none; width: 380px; max-width: 50%; }
      .v-filecol { flex: 1; }
      .v-filecol .v-shot { width: 100%; max-width: 380px; }
      .v-cap { flex: 1; min-width: 0; margin-top: 2px; font-size: 15.5px; line-height: 1.7; }
    }
  </style>
</head>
<body>
<div class="v-wrap">
  <div class="v-top">
    <a href="manuals.html" class="v-back" aria-label="戻る"><i class="fa-solid fa-arrow-left"></i></a>
    <a class="v-edit" id="editLink" href="#"><i class="fa-solid fa-pen"></i> 編集</a>
  </div>
  <div id="content"><div class="v-empty">読み込み中…</div></div>
</div>

<div class="v-lightbox" id="lightbox">
  <button class="lb-close" aria-label="閉じる">&times;</button>
  <div id="lbInner"><i class="fa-solid fa-spinner fa-spin lb-spin"></i></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="../../solid/assets/js/auth.js?v=7"></script>
<script src="../assets/js/wn-api.js?v=27"></script>
<script src="../assets/js/wn-thumb.js?v=20260824a"></script>
<script>
'use strict';
/* マニュアル閲覧画面（社内） */
const user = requireSpaceAuth();
if (!user) throw new Error('未認証');
if (!wnRequireExtendedOptions()) throw new Error('拡張オプション未契約');

const manualId = new URLSearchParams(location.search).get('id');
if (!manualId) { location.href = 'manuals.html'; }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

let stepNo = 0;
function stepHtml(s) {
  if (s.type === 'heading') {
    return `<div class="v-head-step"><div class="v-head-txt">${escapeHtml(s.body)}</div></div>`;
  }
  if (s.type === 'text') {
    return `<div class="v-text-step"><div class="v-text-body">${escapeHtml(s.body)}</div></div>`;
  }
  stepNo++;
  let media = '';
  if (s.file) {
    const isImg = (s.file.mime_type || '').startsWith('image/') || s.type === 'photo';
    if (isImg) {
      media = `<div class="v-shotwrap" onclick="openLightbox(${s.file.id})">${
        wnThumbSlotHtml(s.file, { imgClass: 'v-shot', icon: 'fa-image' })}</div>`;
    } else {
      const ic = wnFileIcon(s.file.file_name, s.file.mime_type);
      /* 図面PDFなどサムネイルを出せるものは写真と同じ大きさで見せる。
         中身が分かった上で「タップして開く」行に進めるようにファイル行は残す。 */
      const shot = wnThumbSupported(s.file)
        ? `<a class="v-fileshot" href="file-detail.html?id=${s.file.id}">${
            wnThumbSlotHtml(s.file, { imgClass: 'v-shot', icon: ic.icon })}</a>`
        : '';
      media = `<div class="v-filecol">${shot}
        <a class="v-filerow" href="file-detail.html?id=${s.file.id}">
          <div class="v-fic">${wnThumbSlotHtml(s.file, { icon: ic.icon })}</div>
          <div style="min-width:0;">
            <div class="v-fn">${escapeHtml(s.file.file_name)}</div>
            <div class="v-fmeta">タップして開く</div>
          </div>
        </a>
      </div>`;
    }
  }
  const cap = s.caption ? `<div class="v-cap">${escapeHtml(s.caption)}</div>` : '';
  return `<div class="v-step">
    <div class="v-num">${stepNo}</div>
    <div class="v-sbody">${media}${cap}</div>
  </div>`;
}

function render(m) {
  document.title = `${m.title} — What'sNo`;
  document.getElementById('editLink').href = `manual-edit.html?id=${m.id}`;
  stepNo = 0;
  const draftPill = m.status === 'draft' ? '<span class="v-draft-pill">下書き</span>' : '';
  const descHtml = m.description ? `<div class="v-desc">${escapeHtml(m.description)}</div>` : '';
  // タグは一覧の絞り込みへの導線（同じタグのマニュアルをまとめて見られる）
  const tagsHtml = (m.tags || []).length
    ? `<div class="v-tags">${m.tags.map(t =>
        `<a class="tag" href="manuals.html?tag=${t.id}">${escapeHtml(t.name)}</a>`).join('')}</div>`
    : '';
  const stepCount = m.steps.filter(s => s.type === 'photo' || s.type === 'file').length;
  const stepsHtml = m.steps.length
    ? m.steps.map(stepHtml).join('')
    : '<div class="v-empty">まだステップがありません</div>';

  document.getElementById('content').innerHTML = `
    <div class="v-hero">
      <div class="v-tag">作業手順書${draftPill}</div>
      <div class="v-h1">${escapeHtml(m.title)}</div>
      ${descHtml}
      ${tagsHtml}
      <div class="v-meta">
        <span>📖 <b>${stepCount}</b> ステップ</span>
        <span>🕓 ${wnFormatDate(m.updated_at)}</span>
      </div>
    </div>
    <div class="v-steps">${stepsHtml}</div>`;
  wnThumbHydrate(document.getElementById('content'));   /* 描画後にサムネイルを解決する */
}

/* ライトボックス（原寸画像） */
async function openLightbox(fileId) {
  const lb = document.getElementById('lightbox');
  const inner = document.getElementById('lbInner');
  inner.innerHTML = '<i class="fa-solid fa-spinner fa-spin lb-spin"></i>';
  lb.classList.add('show');
  const url = await wnGetViewUrl(fileId);
  if (url) inner.innerHTML = `<img src="${url}" alt="">`;
  else inner.innerHTML = '<div class="lb-spin">画像を読み込めませんでした</div>';
}
window.openLightbox = openLightbox;

async function load() {
  const m = await wnGetManual(manualId);
  if (!m) { document.getElementById('content').innerHTML = '<div class="v-empty">マニュアルが見つかりません</div>'; return; }
  render(m);
  wnTrackManualView(m.id);   /* 一覧の「最近見た / よく見る」順に反映（失敗しても表示は継続） */
}

document.addEventListener('DOMContentLoaded', () => {
  const lb = document.getElementById('lightbox');
  lb.addEventListener('click', () => lb.classList.remove('show'));
  load();
});
</script>
</body>
</html>
