<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A5F">
  <title>マニュアル編集 — What'sNo</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/wn-app.css?v=20260827a">
  <style>
    /* PCの左縦帯（追加メニュー）の幅。本文の左余白と揃えるので変数で1か所にまとめる */
    :root { --e-side: 278px; }
    .e-wrap { max-width: 640px; margin: 0 auto; padding: 8px 14px calc(28px + env(safe-area-inset-bottom)); }
    .e-head { display: flex; align-items: center; gap: 10px; padding: 8px 0 12px; position: sticky; top: 0;
      background: var(--bg); z-index: 20; }
    .e-back { width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; color: var(--primary); text-decoration: none; font-size: 16px; transition: background .15s; }
    .e-back:hover { background: var(--bg-card); }
    .e-htitle { font-weight: 800; font-size: 16px; color: var(--primary); flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .e-status { display: flex; gap: 4px; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 100px; padding: 3px; }
    .e-status button { border: none; background: none; padding: 5px 12px; border-radius: 100px; font-size: 12px;
      font-weight: 700; color: var(--muted); cursor: pointer; font-family: inherit; }
    .e-status button.active { background: var(--accent); color: #fff; }

    .e-field { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 11px 13px; margin-bottom: 14px; }
    .e-field-label { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .06em;
      text-transform: uppercase; margin-bottom: 4px; }
    .e-field input, .e-field textarea { width: 100%; border: none; background: none; font-family: inherit;
      font-size: 15px; font-weight: 700; color: var(--primary); padding: 0; box-sizing: border-box; }
    .e-field input:focus, .e-field textarea:focus { outline: none; }
    .e-field.desc input { font-weight: 400; font-size: 13.5px; }

    .e-steps { display: flex; flex-direction: column; gap: 10px; }
    .e-step { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 10px; display: flex; gap: 11px; box-shadow: var(--shadow-sm); align-items: flex-start; }
    .e-num { flex: none; width: 25px; height: 25px; border-radius: 50%; background: var(--primary); color: #fff;
      font-weight: 700; font-size: 12px; display: grid; place-items: center; margin-top: 2px; }
    /* 中央寄せは grid ではなく flex を使う。grid のトラック内では画像の max-height:100% が
       解決されず、実寸まで伸びて枠に切られてしまうため（縦長写真で顕著） */
    /* 縦横比が枠と違う写真は余白ができるので、地の色は明るい面に合わせる */
    .e-thumb { flex: none; width: 200px; height: 200px; border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 34px;
      background: var(--bg); border: 1px solid var(--border); overflow: hidden; }
    /* 枠に合わせて拡大・縮小する（縦横比は保つ）。max-width だけだと小さい画像が
       原寸のまま点のように表示されてしまう */
    .e-thumb img { width: 100%; height: 100%; object-fit: contain; }
    /* スマホでは説明欄が潰れるのでサムネイルを控えめにする */
    @media (max-width: 480px) {
      .e-thumb { width: 130px; height: 130px; font-size: 24px; }
      .e-thumb.annotatable::after { font-size: 20px; }
    }
    .e-thumb.file { background: #eef0ff; color: var(--accent-dk); border: 1px solid #dfe1fb; }
    /* サムネイルが出た枠は写真と同じ地色に戻す（アイコン用の青地を残さない） */
    .e-thumb.file.wn-has-thumb { background: var(--bg); border-color: var(--border); }
    /* 注釈編集へ飛べるサムネイル（ホバーでペンアイコンを重ねる） */
    .e-thumb.annotatable { cursor: pointer; position: relative; }
    .e-thumb.annotatable::after { content: '\f304'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
      position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; color: #fff;
      background: rgba(10,37,64,.55); opacity: 0; transition: opacity .15s; }
    .e-thumb.annotatable:hover::after, .e-thumb.annotatable:focus-visible::after { opacity: 1; }
    .e-scap { flex: 1; min-width: 0; }
    .e-kind { font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 3px; }
    .e-scap input, .e-scap textarea { width: 100%; border: 1px solid var(--border); border-radius: 6px;
      padding: 7px 9px; font-family: inherit; font-size: 13.5px; color: var(--primary); box-sizing: border-box; resize: vertical; }
    .e-scap input:focus, .e-scap textarea:focus { outline: none; border-color: var(--accent); }
    /* 一言説明はある程度の分量を書けるように縦を確保する */
    .e-scap textarea.cap { min-height: 130px; line-height: 1.6; }
    .e-step.heading { background: #f0f4f9; }
    .e-step.heading .e-scap input { font-weight: 800; font-size: 14px; background: transparent; border-color: transparent; }
    .e-step.heading .e-scap input:focus { border-color: var(--accent); background: #fff; }
    .e-sctrl { flex: none; display: flex; flex-direction: column; gap: 3px; }
    .e-sctrl button { width: 28px; height: 24px; border: 1px solid var(--border); background: var(--bg-card);
      border-radius: 5px; color: var(--muted); cursor: pointer; font-size: 11px; }
    .e-sctrl button:hover { color: var(--accent); border-color: var(--accent); }
    .e-sctrl button.del:hover { color: var(--red); border-color: var(--red); }
    .e-sctrl button.cover.active { color: var(--orange); border-color: var(--orange); }
    .e-num { cursor: grab; }
    .e-num:active { cursor: grabbing; }
    .e-step.drag-over { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(99,91,255,.25); }
    .e-step.dragging { opacity: .5; }
    .e-sctrl button:disabled { opacity: .3; cursor: not-allowed; }

    .e-addbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .e-addbtn { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px 8px; text-align: center; font-size: 12px; font-weight: 700; color: var(--primary);
      display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; font-family: inherit;
      transition: border-color .15s; }
    .e-addbtn:hover { border-color: var(--accent); }
    .e-addbtn .bic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; }
    .e-addbtn.cam  .bic { background: #eef0ff; color: var(--accent-dk); }
    .e-addbtn.pick .bic { background: #e7f6ef; color: var(--green); }
    .e-addbtn.file .bic { background: #fff3e5; color: var(--orange); }
    .e-addbtn.text .bic { background: #eef2f7; color: var(--primary); }

    .e-empty { text-align: center; padding: 30px 16px; color: var(--muted); font-size: 13px; }
    /* 手順ゼロのとき中央ペインが真っ白にならないよう、次にやることを置く */
    .e-blank { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; text-align: center; color: var(--muted); padding: 24px; }
    .e-blank i { font-size: 40px; color: var(--border); }
    .e-blank .ttl { font-size: 15px; font-weight: 700; color: var(--primary); }
    .e-blank .sub { font-size: 12.5px; line-height: 1.7; }

    .e-danger { margin-top: 26px; text-align: center; }
    .e-danger button { background: none; border: none; color: var(--red); font-size: 12.5px; font-weight: 700;
      cursor: pointer; font-family: inherit; padding: 8px; }
    .e-danger button:hover { text-decoration: underline; }

    .e-view-link { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; font-size: 12px;
      color: var(--accent); text-decoration: none; font-weight: 700; }

    /* オーバーレイ（既存ファイル選択 / テキスト追加） */
    .e-overlay { position: fixed; inset: 0; background: rgba(10,37,64,.5); display: none; align-items: center;
      justify-content: center; z-index: 100; padding: 16px; }
    .e-overlay.show { display: flex; }
    .e-modal { background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 560px; max-height: 84vh;
      display: flex; flex-direction: column; box-shadow: var(--shadow-md); overflow: hidden; }
    .e-modal-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
    .e-modal-head h3 { margin: 0; font-size: 16px; font-weight: 800; color: var(--primary); }
    .e-modal-head .close { margin-left: auto; background: none; border: none; font-size: 18px; color: var(--muted); cursor: pointer; }
    .e-modal-body { padding: 16px 18px; overflow-y: auto; }
    .e-pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
    .e-pick-item { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer;
      display: flex; flex-direction: column; transition: border-color .15s; background: #fff; }
    .e-pick-item:hover { border-color: var(--accent); }
    .e-pick-thumb { height: 70px; display: grid; place-items: center; background: var(--bg); color: var(--muted); font-size: 20px; overflow: hidden; }
    .e-pick-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .e-pick-name { font-size: 10.5px; padding: 5px 6px; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .e-type-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .e-type-row button { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius);
      background: #fff; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
    .e-type-row button.active { border-color: var(--accent); background: #eef0ff; color: var(--accent-dk); }
    .e-ta { width: 100%; min-height: 90px; padding: 11px; border: 1px solid var(--border); border-radius: var(--radius);
      font-family: inherit; font-size: 14px; box-sizing: border-box; resize: vertical; }
    .e-ta:focus { outline: none; border-color: var(--accent); }
    .e-modal-foot { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
    .e-modal-foot button { flex: 1; padding: 12px; border-radius: var(--radius); font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit; border: 1px solid var(--border); }
    .e-mf-cancel { background: #fff; color: var(--primary); }
    .e-mf-add { background: var(--accent); color: #fff; border-color: var(--accent) !important; }
    .e-mf-add:disabled { opacity: .5; cursor: not-allowed; }

    /* タグ行 */
    .e-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 0 2px 14px; }
    .e-tags-label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; flex: none; }
    .e-tag-add { background: none; border: 1px dashed var(--border); border-radius: 20px; padding: 3px 11px;
      font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; font-family: inherit; white-space: nowrap; }
    .e-tag-add:hover { border-color: var(--accent); color: var(--accent); }
    .e-tagpick { position: relative; flex: none; }
    .e-tagpick-panel { display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 200;
      background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px; min-width: 240px;
      box-shadow: var(--shadow-md); }
    .e-tagpick-panel.show { display: block; }
    .e-tagpick-panel input { width: 100%; padding: 7px 10px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 13px; font-family: inherit; box-sizing: border-box; }
    .e-tagpick-panel input:focus { outline: none; border-color: var(--accent); }
    .e-tagpick-list { max-height: 200px; overflow-y: auto; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .e-tagpick-hint { font-size: 11.5px; color: var(--muted); padding: 6px 2px; }

    /* ファイルピッカーのスコープ切替 */
    .e-pick-scope { display: flex; gap: 4px; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 100px; padding: 3px; margin-bottom: 12px; width: fit-content; }
    .e-pick-scope button { border: none; background: none; padding: 6px 14px; border-radius: 100px; font-size: 12px;
      font-weight: 700; color: var(--muted); cursor: pointer; font-family: inherit; }
    .e-pick-scope button.active { background: var(--accent); color: #fff; }

    /* ファイルピッカーの検索 */
    .e-pick-search { position: relative; margin-bottom: 12px; }
    .e-pick-search > i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 13px; pointer-events: none; }
    .e-pick-search input { width: 100%; padding: 9px 12px 9px 32px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 13px; font-family: inherit; box-sizing: border-box; }
    .e-pick-search input:focus { outline: none; border-color: var(--accent); }

    /* ── C案「親指ファースト」──────────────────────────────
       ・追加操作は画面幅にかかわらず常に画面下端の固定帯に置く
       ・PC（>=1000px）は左に手順リスト・右に選択中の手順の二面
       ・説明はキーボードでも声でも書ける（プッシュトゥトーク）
       ────────────────────────────────────────────── */
    .e-wrap { padding-bottom: calc(162px + env(safe-area-inset-bottom)); }

    /* タイトルはヘッダーで直接編集する（モック同様、上の入力欄で場所を取らない） */
    .e-htitle { flex: 1; min-width: 0; border: 1px solid transparent; border-radius: var(--radius);
      background: none; font-family: inherit; font-weight: 800; font-size: 16px; color: var(--primary);
      padding: 6px 8px; }
    .e-htitle:hover { border-color: var(--border); }
    .e-htitle:focus { outline: none; border-color: var(--accent); background: var(--bg-card); }
    .e-saved { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); }
    .e-saved i { color: var(--green); }
    .e-saved.saving i { color: var(--muted); }
    .e-headbtn { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card);
      color: var(--primary); font-size: 12.5px; font-weight: 700; text-decoration: none; }
    .e-headbtn:hover { border-color: var(--accent); color: var(--accent); }

    .e-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 0 0 12px; }
    .e-metafield { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 8px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0 11px; height: 38px; }
    .e-metafield > i { flex: none; color: var(--muted); font-size: 12px; }
    .e-metafield input { flex: 1; min-width: 0; border: none; background: none; font-family: inherit;
      font-size: 13px; color: var(--primary); }
    .e-metafield input:focus { outline: none; }

    .e-listhead { display: none; align-items: baseline; gap: 8px; padding: 0 4px 8px;
      font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
    .e-listhead .hint { margin-left: auto; font-weight: 500; }

    .e-addbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; margin-top: 0; display: block;
      background: var(--bg-card); border-top: 1px solid var(--border);
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -2px 12px rgba(10,37,64,.06); }
    .e-addbar.dragover { background: #eef0ff; box-shadow: inset 0 0 0 2px var(--accent); }
    .e-addbar-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .e-drophint { display: none; }
    .e-side-title { display: none; }
    .lbl-pc { display: none; }
    .e-addprim { width: 100%; height: 62px; border: none; border-radius: 10px; background: var(--accent);
      color: #fff; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px; }
    .e-addprim:hover { background: var(--accent-dk); }
    .e-addsub { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .e-addsub .e-addbtn { padding: 9px 6px; font-size: 11.5px; }
    .e-addsub .e-addbtn .bic { width: 28px; height: 28px; font-size: 13px; }

    /* 音声入力（押している間だけ聞く） */
    .e-voice { margin-top: 6px; width: 100%; height: 44px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--accent-dk); font-family: inherit; font-size: 13px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      touch-action: none; -webkit-user-select: none; user-select: none; }
    .e-voice:hover { border-color: var(--accent); }
    .e-voice.listening { background: var(--accent); border-color: var(--accent); color: #fff; }
    .e-voice-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
    /* 説明欄の枠内に入れるときは幅を詰めて右端に置く */
    .e-caphints .e-voice { margin-top: 0; width: auto; height: 34px; padding: 0 14px; border-radius: 100px;
      border-color: var(--accent); background: #eef0ff; font-size: 12.5px; }

    /* 手順リスト（PC二面のときの左カラム） */
    .e-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
      cursor: pointer; border: 1px solid transparent; }
    .e-row:hover { background: var(--bg); }
    .e-row.active { background: #eef0ff; box-shadow: inset 3px 0 0 var(--accent); }
    .e-row.active .e-rowtx { color: var(--accent-dk); }
    .e-row.drag-over { border-color: var(--accent); }
    .e-row.dragging { opacity: .5; }
    .e-rownum { flex: none; width: 22px; text-align: center; font-size: 12px; font-weight: 800;
      color: var(--muted); cursor: grab; }
    .e-rownum:active { cursor: grabbing; }
    .e-rowth { flex: none; width: 46px; height: 46px; border-radius: 6px; background: var(--bg);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      color: var(--muted); overflow: hidden; font-size: 15px; }
    /* 一覧の小さな枠は、余白を作らず正方形いっぱいに埋めたいので cover */
    .e-rowth img { width: 100%; height: 100%; object-fit: cover; flex: none; }
    .e-rowtx { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .e-rowtx.empty { color: var(--muted); font-weight: 400; }

    /* 選択中の手順（PC二面のときの右カラム） */
    .e-detail { display: none; }
    .e-detail-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 16px; box-shadow: var(--shadow-sm); }
    .e-detail-head { display: flex; align-items: center; gap: 10px; }
    .e-detail-kind { font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: .06em; }
    .e-detail-sub { font-size: 12px; color: var(--muted); }
    .e-detail-hint { margin-left: auto; font-size: 11.5px; color: var(--muted); }

    /* 写真の操作は写真の上に置く（モック同様、視線を写真から外さない） */
    .e-detail-shot { margin-top: 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border);
      height: 360px; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 34px; overflow: hidden; position: relative; }
    /* 右ペインは枠が大きいので、サムネの原寸ではなく枠いっぱいに合わせて表示する
       （引き伸ばしでぼやけないよう、中身は wn-thumb.js が拡大表示用の大きい版を作る） */
    .e-detail-shot img { width: 100%; height: 100%; object-fit: contain; }
    .e-shot-acts { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .e-shot-acts.right { left: auto; right: 12px; }
    .e-dbtn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px;
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card);
      color: var(--primary); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
      box-shadow: var(--shadow-sm); }
    .e-dbtn:hover { border-color: var(--accent); color: var(--accent); }
    .e-dbtn.del:hover { border-color: var(--red); color: var(--red); }
    .e-dbtn.on { border-color: var(--orange); color: var(--orange); }

    /* 説明欄はキー操作と音声を1つの枠にまとめる */
    .e-capbox { margin-top: 12px; border: 1.5px solid var(--accent); border-radius: 8px;
      background: var(--bg-card); overflow: hidden; }
    .e-detail-cap { width: 100%; min-height: 74px; border: none; background: none; padding: 12px 13px 8px;
      font-family: inherit; font-size: 15px; line-height: 1.7; color: var(--primary);
      box-sizing: border-box; resize: none; display: block; }
    .e-detail-cap:focus { outline: none; }
    .e-caphints { display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
      border-top: 1px solid var(--border); padding: 8px 11px; }
    .e-key { font-size: 11px; font-weight: 700; padding: 2px 7px; border: 1px solid var(--border);
      border-bottom-width: 2px; border-radius: var(--radius); background: var(--bg-card); color: var(--muted); }
    .e-caphints .lbl { font-size: 11.5px; color: var(--muted); }
    .e-caphints .sp { margin-left: auto; }

    /* スマホは横に並べると説明欄が潰れるので縦に積む。
       写真を全幅にして、操作ボタンは指で押せる大きさで下にまとめる。 */
    @media (max-width: 620px) {
      /* ヘッダーは幅が足りないので、タイトルに場所を譲って補助表示を畳む */
      .e-saved { display: none; }
      .e-headbtn .lbl { display: none; }
      .e-headbtn { width: 34px; padding: 0; justify-content: center; }
      .e-htitle { font-size: 15px; padding: 5px 6px; }
      .e-status button { padding: 5px 10px; font-size: 11.5px; white-space: nowrap; }
      .e-head { gap: 7px; }

      .e-step { flex-direction: column; align-items: stretch; gap: 9px; }
      .e-num { align-self: flex-start; }
      .e-thumb, .e-thumb.file { width: 100%; height: 190px; font-size: 30px; }
      .e-scap textarea.cap { min-height: 84px; }
      .e-sctrl { flex-direction: row; justify-content: flex-end; gap: 6px; }
      .e-sctrl button { width: 44px; height: 40px; font-size: 13px; }
    }

    /* ── PC: 3面ワークスペース ──
       画面を1枚のアプリとして固定し、左＝追加メニューの縦帯／中央＝編集中の手順／右＝手順リスト。
       ページ全体は伸びず、それぞれのペインが内側でスクロールする。
       追加メニューを左端の縦帯に出すことで、下端の帯に取られていた高さを写真に回せる。 */
    @media (min-width: 1000px) {
      .e-wrap { max-width: none; height: 100dvh; display: flex; flex-direction: column;
        padding: 8px 18px 0 calc(var(--e-side) + 18px); overflow: hidden; }
      .e-head { padding: 6px 0 10px; }

      .e-main.two { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px;
        gap: 16px; padding-bottom: 14px; }
      /* 手順リストは右、編集中の手順は中央。DOM順（スマホの並び）は変えずに order だけ入れ替える */
      .e-main.two .e-detail { order: 1; display: flex; min-height: 0; }
      .e-main.two .e-left { order: 2; min-height: 0; display: flex; flex-direction: column;
        background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
        padding: 12px 10px 6px; box-shadow: var(--shadow-sm); }
      .e-main.two .e-listhead { display: flex; }
      .e-main.two .e-steps { flex: 1; min-height: 0; overflow-y: auto; gap: 2px; }
      .e-main.two .e-danger { flex: none; margin-top: 6px; border-top: 1px solid var(--border); padding-top: 4px; }
      .e-main.two .e-danger button { font-size: 11.5px; }

      .e-main.two .e-detail-card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .e-main.two .e-detail-shot { flex: 1; min-height: 120px; height: auto; margin-top: 12px; }

      /* 追加メニュー＝画面左端の縦帯。PCで一番よく使うのは撮影ではなく「画像を選ぶ」なので
         主役をそちらに移し、カメラは並の操作に落とす（スマホは下端の帯のまま、主役はカメラ） */
      .e-addbar { top: 0; bottom: 0; right: auto; width: var(--e-side);
        border-top: none; border-right: 1px solid var(--border);
        box-shadow: 2px 0 12px rgba(10,37,64,.05);
        padding: 20px 12px calc(14px + env(safe-area-inset-bottom));
        display: flex; flex-direction: column; gap: 12px; }
      /* display:contents で副ボタン3つを縦帯の直接の子にし、主役だけ順番を上げる */
      .e-addbar-inner { flex: none; max-width: none; margin: 0; display: flex; flex-direction: column; gap: 8px; }
      .e-addsub { display: contents; }
      .e-side-title { display: block; order: 0; font-size: 11px; font-weight: 700; color: var(--muted);
        letter-spacing: .06em; padding: 2px 4px; }
      .e-addbar-inner #addImg    { order: 1; }
      .e-addbar-inner .e-addprim { order: 2; }
      .e-addbar-inner #addFile   { order: 3; }
      .e-addbar-inner #addText   { order: 4; }

      /* 縦帯ではアイコンを左・文字を右に並べたほうが読み取りが速く、高さも節約できる */
      .e-addprim, .e-addbar .e-addbtn { width: 100%; height: 52px; flex-direction: row;
        justify-content: flex-start; align-items: center; gap: 11px; padding: 0 12px;
        font-size: 13px; text-align: left; border-radius: 10px; }
      .e-addprim { background: var(--bg-card); color: var(--primary); border: 1px solid var(--border); }
      .e-addbar .lbl-sp { display: none; }
      .e-addbar .lbl-pc { display: inline; }
      .e-addprim:hover { background: var(--bg); border-color: var(--accent); color: var(--accent); }
      .e-addbar .e-addbtn .bic { flex: none; width: 30px; height: 30px; font-size: 13px; }
      .e-addbar .e-addbtn.pick { height: 56px; font-size: 13.5px;
        background: var(--accent); border-color: var(--accent); color: #fff; }
      .e-addbar .e-addbtn.pick:hover { background: var(--accent-dk); }
      .e-addbar .e-addbtn.pick .bic { background: rgba(255,255,255,.2); color: #fff; }

      /* 余った縦を大きなドロップ先にする（PCでは写真をまとめて放り込むのが一番速い） */
      .e-drophint { flex: 0 1 auto; min-height: 96px; max-height: 220px; max-width: none; margin: 0; padding: 12px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
        border: 1.5px dashed var(--border); border-radius: 10px;
        color: var(--muted); font-size: 11.5px; line-height: 1.6; text-align: center; }
      .e-drophint i { font-size: 17px; }
      .e-addbar.dragover .e-drophint { border-color: var(--accent); color: var(--accent-dk); }
    }

    /* 幅の狭いノートPCでは両脇を詰めて、主役の写真と説明欄に幅を回す */
    @media (min-width: 1000px) and (max-width: 1279px) {
      :root { --e-side: 238px; }
      .e-main.two { grid-template-columns: minmax(0, 1fr) 322px; gap: 12px; }
      .e-wrap { padding-right: 12px; padding-left: calc(var(--e-side) + 12px); }
      .e-addbar { padding-left: 10px; padding-right: 10px; }
      .e-addprim, .e-addbar .e-addbtn { height: 46px; font-size: 12px; gap: 8px; padding: 0 9px; }
      .e-addbar .e-addbtn .bic { width: 26px; height: 26px; font-size: 12px; }
      .e-addbar .e-addbtn.pick { height: 50px; font-size: 12.5px; }
    }

    .hidden { display: none !important; }
  </style>
</head>

<script src="../assets/js/wn-thumb.js?v=20260824b"></script>
<script>
'use strict';
/* マニュアル編集画面 */
const user = requireSpaceAuth();
if (!user) throw new Error('未認証');
if (!wnRequireExtendedOptions()) throw new Error('拡張オプション未契約');

const manualId = new URLSearchParams(location.search).get('id');
if (!manualId) { location.href = 'manuals.html'; }

let manual = null;   /* {id, title, description, status, steps:[]} */

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

const KIND_LABEL = { photo: '📷 写真', file: '📎 ファイル', heading: '🔤 見出し', text: '📝 説明文' };

/* ---------- 描画 ---------- */
function renderStatus() {
  document.getElementById('stDraft').classList.toggle('active', manual.status === 'draft');
  document.getElementById('stPub').classList.toggle('active', manual.status === 'published');
}

function stepThumbHtml(s) {
  if (s.file && (s.type === 'photo' || s.type === 'file')) {
    /* 画像・PDFはクリックで注釈編集へ。非対応形式（Excel等）は従来どおり表示のみ */
    const canAnnotate = wnIsAnnotatable(s.file.file_name, s.file.mime_type);
    const mod   = canAnnotate ? ' annotatable' : '';
    const attrs = canAnnotate ? ` onclick="openAnnotate(${s.id})" title="クリックして注釈を編集"` : '';
    const isImg = (s.file.mime_type || '').startsWith('image/') || s.type === 'photo';
    /* PDF・DXF・動画もサムネイルにする（サーバーに無ければ wn-thumb.js が生成して保存する）。
       出せなかったときだけ従来どおりアイコンが残る。 */
    const slot = wnThumbSlotHtml(s.file, isImg ? { icon: 'fa-image' } : {});
    return `<div class="e-thumb${isImg ? '' : ' file'}${mod}"${attrs}>${slot}</div>`;
  }
  return '';
}

/* ── C案の表示モード ──
   スマホ（<1000px）は1列のカード、PCは左に手順リスト・右に選択中の手順の二面。
   どちらも同じ manual.steps を描くだけで、保存系のロジックは共通。 */
const wideMq = window.matchMedia('(min-width: 1000px)');
let isWide   = wideMq.matches;
let focusIdx = 0;              /* 二面のとき右に出している手順 */

function focusStep(i) {
  if (i === focusIdx) return;
  /* 入力中のキャプションを change で確定させてから切り替える */
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  focusIdx = i;
  renderSteps();
}
window.focusStep = focusStep;

/* 手順リストの1行（二面のときの左カラム） */
function rowHtml(s, i) {
  const isText = s.type === 'heading' || s.type === 'text';
  let th = '<i class="fa-solid fa-heading"></i>';
  if (!isText && s.file) {
    const isImg = (s.file.mime_type || '').startsWith('image/') || s.type === 'photo';
    th = wnThumbSlotHtml(s.file, isImg ? { icon: 'fa-image' } : {});
  }
  const raw = (isText ? s.body : s.caption) || '';
  const has = raw.trim() !== '';
  return `<div class="e-row${i === focusIdx ? ' active' : ''}" data-idx="${i}" onclick="focusStep(${i})"
      ondragover="onStepDragOver(event,${i})" ondragleave="onStepDragLeave(event)" ondrop="onStepDrop(event,${i})">
    <div class="e-rownum" draggable="true" ondragstart="onStepDragStart(event,${i})"
      ondragend="onStepDragEnd(event)" title="ドラッグで並べ替え">${i + 1}</div>
    <div class="e-rowth">${th}</div>
    <div class="e-rowtx${has ? '' : ' empty'}">${has ? escapeHtml(raw) : '（説明なし）'}</div>
  </div>`;
}

/* 選択中の手順（二面のときの右カラム） */
function detailHtml(s, i) {
  if (!s) return '';
  const isText = s.type === 'heading' || s.type === 'text';

  let shot = '';
  if (!isText) {
    let inner = '<i class="fa-solid fa-image"></i>';
    if (s.file) {
      const isImg = (s.file.mime_type || '').startsWith('image/') || s.type === 'photo';
      /* ここは写真を確認しながら説明を書く場所なので、360x480のサムネではなく原本を出す。
         読めなかったときだけサムネへ、それも駄目ならアイコンへ落とす。 */
      inner = isImg
        ? `<img src="${wnPublicViewUrl(s.file.id)}" alt=""
             data-thumb="${wnThumbUrl(s.file.id, s.file.updated_at)}"
             onerror="if(this.dataset.thumb){this.src=this.dataset.thumb;this.dataset.thumb='';}
                      else{this.parentElement.innerHTML='<i class=&quot;fa-solid fa-image&quot;></i>';}">`
        /* PDF等は原本を <img> で出せないので、拡大表示用の大きいサムネを生成して出す */
        : wnThumbSlotHtml(s.file, { preview: true });
    }
    /* 写真の操作は写真の上に重ねる（視線を写真から外さない） */
    const onShot = [];
    if (s.file && wnIsAnnotatable(s.file.file_name, s.file.mime_type)) {
      onShot.push(`<button class="e-dbtn" onclick="openAnnotate(${s.id})"><i class="fa-solid fa-pen"></i> 注釈を入れる</button>`);
    }
    onShot.push(`<button class="e-dbtn" onclick="swapStepFile(${s.id})"><i class="fa-solid fa-rotate"></i> 差し替え</button>`);
    shot = `<div class="e-detail-shot">${inner}
      <div class="e-shot-acts">${onShot.join('')}</div>
    </div>`;
  }

  const field = isText
    ? (s.type === 'heading'
        ? `<input class="e-detail-cap" style="min-height:0;font-weight:800;" value="${escapeHtml(s.body)}"
             placeholder="見出し" onchange="saveBody(${s.id}, this.value)">`
        : `<textarea class="e-detail-cap" placeholder="説明文"
             onchange="saveBody(${s.id}, this.value)">${escapeHtml(s.body)}</textarea>`)
    : `<textarea class="e-detail-cap" placeholder="一言説明（例: 電源をOFFにする）"
         onchange="saveCaption(${s.id}, this.value)">${escapeHtml(s.caption)}</textarea>`;

  /* 表紙・削除は写真の操作ではないのでヘッダー側に置く */
  const head = [];
  if (s.file) {
    head.push(`<button class="e-dbtn ${s.file.id === manual.cover_file_id ? 'on' : ''}" title="一覧の表紙にする"
      onclick="setCover(${s.file.id})"><i class="fa-solid fa-star"></i> 表紙</button>`);
  }
  head.push(`<button class="e-dbtn del" title="この手順を削除"
    onclick="removeStep(${s.id})"><i class="fa-solid fa-trash-can"></i></button>`);

  const voice = WnSR
    ? `<button type="button" class="e-voice"><i class="fa-solid fa-microphone"></i> 音声で入力</button>`
    : '';
  const voiceHint = WnSR
    ? `<span class="lbl${voice ? ' sp' : ''}">押している間だけ聞く</span><span class="e-key">F2</span>`
    : '';

  return `<div class="e-detail-card">
    <div class="e-detail-head">
      <span class="e-detail-kind">STEP ${i + 1}</span>
      <span class="e-detail-sub">${manual.steps.length}件中${i + 1}件目・${KIND_LABEL[s.type] || ''}</span>
      <span class="e-detail-hint">↑↓ で手順を選ぶ</span>
      ${head.join('')}
    </div>
    ${shot}
    <div class="e-capbox">
      ${field}
      <div class="e-caphints">
        <span class="e-key">Enter</span><span class="lbl">確定して次の手順へ</span>
        <span class="e-key">Shift</span><span class="e-key">Enter</span><span class="lbl">改行</span>
        ${voiceHint}${voice}
      </div>
    </div>
  </div>`;
}

/* 写真の差し替え（ステップはそのままにファイルだけ入れ替える） */
let swapTargetStepId = null;
function swapStepFile(stepId) {
  swapTargetStepId = stepId;
  document.getElementById('inSwap').click();
}
window.swapStepFile = swapStepFile;

async function doSwapFile(file) {
  const stepId = swapTargetStepId;
  swapTargetStepId = null;
  if (!stepId || !file || file.size === 0) return;
  const s = manual.steps.find(x => x.id === stepId);
  if (!s) return;
  const wasCover = s.file && s.file.id === manual.cover_file_id;
  try {
    wnShowToast(`${file.name} をアップロード中…`);
    const up = await wnUploadFile(file);
    const fileId = up?.data?.id;
    if (!fileId) throw new Error('アップロードに失敗しました');
    await wnUpdateManualStep(manual.id, stepId, { file_id: fileId });
    /* 差し替え前の写真が表紙だったら表紙も追従させる（注釈保存と同じ扱い） */
    if (wasCover) {
      manual.cover_file_id = fileId;
      await wnUpdateManual(manual.id, { cover_file_id: fileId });
    }
    await load();
    wnShowToast('写真を差し替えました', 'success');
  } catch (e) {
    wnShowToast(e.message || '差し替えに失敗しました', 'danger');
  }
}

function renderSteps() {
  const box    = document.getElementById('steps');
  const detail = document.getElementById('detail');
  document.getElementById('mainArea').classList.toggle('two', isWide);
  document.getElementById('stepCount').textContent = `${manual.steps.length}件`;
  /* 並べ替えの案内は2件以上のときだけ（見出しの幅は動かしたくないので visibility で消す） */
  const listHint = document.querySelector('.e-listhead .hint');
  if (listHint) listHint.style.visibility = manual.steps.length > 1 ? '' : 'hidden';

  if (!manual.steps.length) {
    /* 追加ボタンの置き場所が PC（左の縦帯）とスマホ（下端の帯）で違うので案内も出し分ける */
    box.innerHTML = `<div class="e-empty">${isWide
      ? '左のメニューから写真・ファイル・見出しを追加してください'
      : '下のボタンから写真・ファイル・見出しを追加してください'}</div>`;
    detail.innerHTML = isWide
      ? `<div class="e-detail-card"><div class="e-blank">
           <i class="fa-solid fa-images"></i>
           <div class="ttl">まだ手順がありません</div>
           <div class="sub">左の「画像を選ぶ」から写真を足すか、<br>写真を左の帯にドラッグしてください</div>
         </div></div>`
      : '';
    return;
  }
  focusIdx = Math.min(Math.max(focusIdx, 0), manual.steps.length - 1);

  if (isWide) {
    box.innerHTML    = manual.steps.map(rowHtml).join('');
    detail.innerHTML = detailHtml(manual.steps[focusIdx], focusIdx);
    /* ↑↓や追加で選択が動いてもリストの外に出さない（件数が多いと見失う） */
    const act = box.querySelector('.e-row.active');
    if (act) act.scrollIntoView({ block: 'nearest' });
  } else {
    box.innerHTML    = manual.steps.map(cardHtml).join('');
    detail.innerHTML = '';
  }
  wnThumbHydrate(box);      /* 描画後にサムネイルを解決してアイコンと差し替える */
  wnThumbHydrate(detail);
  bindVoiceButtons();
}

/* 1列のカード（スマホ） */
function cardHtml(s, i) {
    const first = i === 0, last = i === manual.steps.length - 1;
    const hasFile = (s.type === 'photo' || s.type === 'file') && s.file;
    const coverBtn = hasFile
      ? `<button class="cover ${s.file.id === manual.cover_file_id ? 'active' : ''}" onclick="setCover(${s.file.id})" title="表紙にする"><i class="fa-solid fa-star"></i></button>`
      : '';
    const ctrl = `
      <div class="e-sctrl">
        ${coverBtn}
        <button ${first ? 'disabled' : ''} onclick="moveStep(${i},-1)" title="上へ"><i class="fa-solid fa-chevron-up"></i></button>
        <button ${last ? 'disabled' : ''} onclick="moveStep(${i},1)" title="下へ"><i class="fa-solid fa-chevron-down"></i></button>
        <button class="del" onclick="removeStep(${s.id})" title="削除"><i class="fa-solid fa-xmark"></i></button>
      </div>`;
    const dragAttrs = `data-idx="${i}" ondragover="onStepDragOver(event,${i})" ondragleave="onStepDragLeave(event)" ondrop="onStepDrop(event,${i})"`;
    const numHandle = `<div class="e-num" draggable="true" ondragstart="onStepDragStart(event,${i})" ondragend="onStepDragEnd(event)" title="ドラッグで並べ替え">${i + 1}</div>`;

    if (s.type === 'heading' || s.type === 'text') {
      const cls = s.type === 'heading' ? 'e-step heading' : 'e-step';
      const field = s.type === 'heading'
        ? `<input value="${escapeHtml(s.body)}" placeholder="見出し" onchange="saveBody(${s.id}, this.value)">`
        : `<textarea rows="2" placeholder="説明文" onchange="saveBody(${s.id}, this.value)">${escapeHtml(s.body)}</textarea>`;
      /* 見出しは一言なので音声ボタンは説明文だけに出す */
      const voice = s.type === 'text' ? voiceBtnHtml() : '';
      return `<div class="${cls}" ${dragAttrs}>
        ${numHandle}
        <div class="e-scap"><div class="e-kind">${KIND_LABEL[s.type]}</div>${field}${voice}</div>
        ${ctrl}
      </div>`;
    }

    return `<div class="e-step" ${dragAttrs}>
      ${numHandle}
      ${stepThumbHtml(s)}
      <div class="e-scap">
        <div class="e-kind">${KIND_LABEL[s.type]}</div>
        <textarea class="cap" placeholder="一言説明（例: 電源をOFFにする）"
          onchange="saveCaption(${s.id}, this.value)">${escapeHtml(s.caption)}</textarea>
        ${voiceBtnHtml()}
      </div>
      ${ctrl}
    </div>`;
}

/* ── 音声入力（押している間だけ聞くプッシュトゥトーク）──
   ダッシュボードの音声検索と同じ Web Speech API。非対応ブラウザではボタンを出さない
   （その場合も OS のキーボードのマイクで入力できるので警告は出さない） */
const WnSR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, voiceTarget = null, voiceBase = '', voiceBtn = null;

function voiceBtnHtml() {
  if (!WnSR) return '';
  return `<button type="button" class="e-voice"><i class="fa-solid fa-microphone"></i> 押している間、話す</button>
    <div class="e-voice-hint">手袋のままでも押せます。あとから文字で直せます。</div>`;
}

/* 手順の説明は普通の文なので、記号の読み替え（「てん」→「.」など）はしない。
   全角英数字の半角化と空白の正規化だけに留める。 */
function normalizeVoiceText(s) {
  return String(s)
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/\s+/g, ' ')
    .trim();
}

function initRecog() {
  if (!WnSR || recog) return;
  recog = new WnSR();
  recog.lang            = 'ja-JP';
  recog.interimResults  = true;
  recog.continuous      = true;
  recog.maxAlternatives = 1;

  recog.onresult = e => {
    if (!voiceTarget) return;
    let txt = '';
    for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    txt = normalizeVoiceText(txt);
    voiceTarget.value = voiceBase ? `${voiceBase} ${txt}` : txt;
  };
  recog.onend = endVoice;
  recog.onerror = ev => {
    endVoice();
    if (ev.error === 'not-allowed') {
      wnShowToast('マイクの使用が許可されていません。ブラウザの設定を確認してください。', 'danger');
    } else if (ev.error !== 'no-speech' && ev.error !== 'aborted') {
      wnShowToast('音声認識に失敗しました。キーボードのマイクからも入力できます。', 'warning');
    }
  };
}

function startVoice(textarea, btn) {
  if (!WnSR || !textarea) return;
  initRecog();
  voiceTarget = textarea;
  voiceBase   = textarea.value.trim();
  voiceBtn    = btn;
  try { recog.start(); } catch (_) { return; }   /* 連打で InvalidStateError になるのは無視 */
  /* 文言は置き場所ごとに違う（スマホの大ボタン / PCの枠内ボタン）ので元に戻せるよう控える */
  if (!btn.dataset.label) btn.dataset.label = btn.innerHTML;
  btn.classList.add('listening');
  btn.innerHTML = '<i class="fa-solid fa-microphone-lines"></i> 話し終わったら離す';
}

function stopVoice() {
  if (recog) { try { recog.stop(); } catch (_) {} }
}

/* 認識終了。change を発火させて既存のオートセーブに乗せる */
function endVoice() {
  if (voiceBtn) {
    voiceBtn.classList.remove('listening');
    if (voiceBtn.dataset.label) voiceBtn.innerHTML = voiceBtn.dataset.label;
  }
  if (voiceTarget) voiceTarget.dispatchEvent(new Event('change'));
  voiceTarget = null; voiceBtn = null; voiceBase = '';
}

function bindVoiceButtons() {
  if (!WnSR) return;
  document.querySelectorAll('.e-voice').forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      const wrap = btn.closest('.e-scap') || btn.closest('.e-detail-card');
      const ta   = wrap && wrap.querySelector('textarea, input.e-detail-cap');
      startVoice(ta, btn);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, stopVoice));
  });
}

function renderAll() {
  document.getElementById('fTitle').value = manual.title || '';
  document.getElementById('fDesc').value = manual.description || '';
  document.getElementById('viewLink').href = `manual-view.html?id=${manual.id}`;
  renderStatus();
  renderTagChips();
  renderSteps();
}

/* ---------- 保存系（オートセーブ） ---------- */
/* 実行中の保存を保持する。注釈編集へ遷移する前に完走を待ち、
   入力直後のクリックでキャプションを取りこぼさないようにする */
const pendingSaves = new Set();
function trackSave(p) {
  pendingSaves.add(p);
  p.finally(() => pendingSaves.delete(p));
  return p;
}
async function saveCaption(stepId, value) {
  const s = manual.steps.find(x => x.id === stepId); if (s) s.caption = value;
  await trackSave(wnUpdateManualStep(manual.id, stepId, { caption: value }));
}
async function saveBody(stepId, value) {
  const s = manual.steps.find(x => x.id === stepId); if (s) s.body = value;
  await trackSave(wnUpdateManualStep(manual.id, stepId, { body: value }));
}
async function removeStep(stepId) {
  if (!confirm('このステップを削除しますか？')) return;
  const ok = await wnDeleteManualStep(manual.id, stepId);
  if (!ok) { wnShowToast('削除に失敗しました', 'danger'); return; }
  manual.steps = manual.steps.filter(s => s.id !== stepId);
  renderSteps();
}
async function moveStep(index, dir) {
  const j = index + dir;
  if (j < 0 || j >= manual.steps.length) return;
  const arr = manual.steps;
  [arr[index], arr[j]] = [arr[j], arr[index]];
  renderSteps();
  await wnReorderManualSteps(manual.id, arr.map(s => s.id));
}
/* ドラッグ並べ替え（番号バッジをハンドルに。スマホ用に上下ボタンも併設） */
let dragIdx = null;
function onStepDragStart(e, i) {
  dragIdx = i;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', String(i)); } catch (_) {}
  const step = e.target.closest('.e-step, .e-row'); if (step) step.classList.add('dragging');
}
function onStepDragEnd() {
  dragIdx = null;
  document.querySelectorAll('.e-step, .e-row').forEach(el => el.classList.remove('dragging', 'drag-over'));
}
function onStepDragOver(e) {
  if (dragIdx === null) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const el = e.currentTarget;
  document.querySelectorAll('.e-step.drag-over, .e-row.drag-over').forEach(x => { if (x !== el) x.classList.remove('drag-over'); });
  el.classList.add('drag-over');
}
function onStepDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
async function onStepDrop(e, i) {
  e.preventDefault();
  const from = dragIdx; dragIdx = null;
  document.querySelectorAll('.e-step, .e-row').forEach(el => el.classList.remove('drag-over', 'dragging'));
  if (from === null || from === i) return;
  const arr = manual.steps;
  const [moved] = arr.splice(from, 1);
  arr.splice(i, 0, moved);
  focusIdx = i;
  renderSteps();
  await wnReorderManualSteps(manual.id, arr.map(s => s.id));
}

/* 表紙（カバー）画像を設定 */
async function setCover(fileId) {
  manual.cover_file_id = fileId;
  renderSteps();
  await wnUpdateManual(manual.id, { cover_file_id: fileId });
  wnShowToast('表紙に設定しました', 'success');
}

/* サムネイルをクリック → 注釈編集画面へ。
   保存すると annotate.html 側が manual_id/step_id を見てステップを差し替える */
async function openAnnotate(stepId) {
  const s = manual.steps.find(x => x.id === stepId);
  if (!s || !s.file || !wnIsAnnotatable(s.file.file_name, s.file.mime_type)) return;
  /* 入力中のキャプションを確定（onchange）させ、保存の完走を待ってから遷移 */
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (pendingSaves.size) await Promise.allSettled([...pendingSaves]);
  const q = new URLSearchParams({
    id:        s.file.id,
    back:      `manual-edit.html?id=${manual.id}`,
    manual_id: manual.id,
    step_id:   stepId,
  });
  if (s.file.id === manual.cover_file_id) q.set('cover', '1');
  /* 編集中の内容を失わないよう別タブで開く。戻ってきたらフォーカス時に再取得する */
  window.open('annotate.html?' + q.toString(), '_blank');
}

window.saveCaption = saveCaption; window.saveBody = saveBody;
window.removeStep = removeStep; window.moveStep = moveStep;
window.setCover = setCover; window.openAnnotate = openAnnotate;
window.onStepDragStart = onStepDragStart; window.onStepDragEnd = onStepDragEnd;
window.onStepDragOver = onStepDragOver; window.onStepDragLeave = onStepDragLeave;
window.onStepDrop = onStepDrop;

/* ---------- ステップ追加 ---------- */
async function addFileSteps(files, type) {
  for (const f of files) {
    if (!f || f.size === 0) continue;
    try {
      wnShowToast(`${f.name} をアップロード中…`);
      const up = await wnUploadFile(f);
      const fileId = up?.data?.id;
      if (!fileId) throw new Error('アップロード失敗');
      const step = await wnAddManualStep(manual.id, { type, fileId, caption: '' });
      manual.steps.push(step);
      focusIdx = manual.steps.length - 1;
      renderSteps();
      /* 追加直後のキャプション欄へフォーカス（撮影→一言の最短ループ） */
      const last = isWide
        ? document.querySelector('#detail .e-detail-cap')
        : document.querySelector('#steps .e-step:last-child .e-scap input, #steps .e-step:last-child .e-scap textarea');
      if (last) last.focus();
    } catch (e) {
      wnShowToast(e.message || '追加に失敗しました', 'danger');
    }
  }
}

async function addTextStep(type, body) {
  try {
    const step = await wnAddManualStep(manual.id, { type, body });
    manual.steps.push(step);
    focusIdx = manual.steps.length - 1;
    renderSteps();
  } catch (e) {
    wnShowToast(e.message || '追加に失敗しました', 'danger');
  }
}

/* ---------- タグ ---------- */
let allTags = [];   /* 会社のタグマスター（ピッカー用に1回だけ取得） */

function renderTagChips() {
  const box = document.getElementById('tagChips');
  box.innerHTML = (manual.tags || []).map(t => `
    <span class="tag tag-removable">${escapeHtml(t.name)}<button
      onclick="removeTag(${t.id})" title="このタグを外す"><i class="fa-solid fa-xmark"></i></button></span>`).join('');
}

async function addTag({ tagId, name }) {
  try {
    const tag = await wnAddManualTag(manual.id, { tagId, name });
    if (!(manual.tags || []).some(t => t.id === tag.id)) {
      manual.tags = [...(manual.tags || []), tag];
    }
    if (!allTags.some(t => t.id === tag.id)) allTags.push(tag);
    renderTagChips();
    renderTagPicker();
  } catch (e) {
    wnShowToast(e.message || 'タグの追加に失敗しました', 'danger');
  }
}

async function removeTag(tagId) {
  const ok = await wnRemoveManualTag(manual.id, tagId);
  if (!ok) { wnShowToast('タグを外せませんでした', 'danger'); return; }
  manual.tags = (manual.tags || []).filter(t => t.id !== tagId);
  renderTagChips();
  renderTagPicker();
}
window.removeTag = removeTag;

/* ピッカーは取得済みのタグをクライアント側で絞り込む（打鍵ごとの通信をしない） */
function renderTagPicker() {
  const raw   = document.getElementById('tagPickSearch').value.trim();
  const q     = raw.toLowerCase();
  const owned = new Set((manual.tags || []).map(t => t.id));
  const list  = allTags.filter(t => !owned.has(t.id) && (!q || t.name.toLowerCase().includes(q)));

  document.getElementById('tagPickList').innerHTML = list.length
    ? list.map(t => `<span class="tag" data-pick-tag="${t.id}">${escapeHtml(t.name)}</span>`).join('')
    : '';

  document.getElementById('tagPickList').querySelectorAll('[data-pick-tag]').forEach(el => {
    el.addEventListener('click', () => addTag({ tagId: Number(el.dataset.pickTag) }));
  });

  const hint  = document.getElementById('tagPickHint');
  const exact = q && allTags.some(t => t.name.toLowerCase() === q);
  if (q && !exact) {
    hint.innerHTML = `Enter で「${escapeHtml(raw)}」を新しいタグとして作成`;
  } else {
    hint.textContent = list.length ? '' : '該当するタグがありません';
  }
}

function initTagPicker() {
  const btn    = document.getElementById('tagAddBtn');
  const panel  = document.getElementById('tagPickPanel');
  const search = document.getElementById('tagPickSearch');

  btn.addEventListener('click', async e => {
    e.stopPropagation();
    const opening = !panel.classList.contains('show');
    panel.classList.toggle('show', opening);
    if (!opening) return;
    if (!allTags.length) allTags = await wnGetManualTags();
    search.value = '';
    renderTagPicker();
    setTimeout(() => search.focus(), 50);
  });

  search.addEventListener('input', renderTagPicker);
  search.addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    const name = search.value.trim();
    if (!name) return;
    await addTag({ name });          // 既存が無ければサーバー側で作成される
    search.value = '';
    renderTagPicker();
  });

  panel.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', () => panel.classList.remove('show'));
}

/* ---------- 既存ファイルピッカー ---------- */
let pickSearchTimer = null;
let pickScope = 'mine';   /* 検索中はダッシュボードと同様スコープを外し、見える範囲全体から探す */

async function loadPickerFiles() {
  const grid = document.getElementById('pickGrid');
  const q    = document.getElementById('pickSearch').value.trim();
  grid.innerHTML = '<div class="e-empty">読み込み中…</div>';

  const params = { search: q, per_page: 60 };
  if (!q) params.scope = pickScope;
  const { data, error } = await wnGetFiles(params);
  if (error || !data || !data.length) {
    grid.innerHTML = `<div class="e-empty">${q ? '該当するファイルがありません' : '追加できるファイルがありません'}</div>`;
    return;
  }
  grid.innerHTML = data.map(f => `
    <div class="e-pick-item" onclick="pickFile(${f.id})">
      <div class="e-pick-thumb">${wnThumbSlotHtml(f)}</div>
      <div class="e-pick-name">${escapeHtml(f.file_name)}</div>
    </div>`).join('');
  wnThumbHydrate(grid);   /* 画像だけでなくPDF等もサムネイルで選べるようにする */
}
function openFilePicker() {
  document.getElementById('fileModal').classList.add('show');
  const search = document.getElementById('pickSearch');
  search.value = '';
  pickScope = 'mine';
  document.querySelectorAll('#pickScope button').forEach(b => b.classList.toggle('active', b.dataset.scope === 'mine'));
  loadPickerFiles();
  setTimeout(() => search.focus(), 50);
}

async function pickFile(fileId) {
  document.getElementById('fileModal').classList.remove('show');
  try {
    const step = await wnAddManualStep(manual.id, { type: 'file', fileId, caption: '' });
    manual.steps.push(step);
    renderSteps();
  } catch (e) {
    wnShowToast(e.message || '追加に失敗しました', 'danger');
  }
}
window.pickFile = pickFile;

/* ---------- 初期化 ---------- */
async function load() {
  manual = await wnGetManual(manualId);
  if (!manual) { wnShowToast('マニュアルが見つかりません', 'danger'); setTimeout(() => location.href = 'manuals.html', 1200); return; }
  renderAll();
}

/* 注釈編集を別タブで開いた後、このタブへ戻ってきたら最新の注釈済みサムネイルを反映する */
window.addEventListener('focus', () => {
  if (manual) load().catch(() => {});
});

document.addEventListener('DOMContentLoaded', () => {
  /* タイトル・説明のオートセーブ */
  document.getElementById('fTitle').addEventListener('change', async e => {
    const v = e.target.value.trim();
    if (!v) { e.target.value = manual.title; return; }
    manual.title = v;
    await wnUpdateManual(manual.id, { title: v });
  });
  document.getElementById('fDesc').addEventListener('change', async e => {
    manual.description = e.target.value;
    await wnUpdateManual(manual.id, { description: e.target.value });
  });

  /* 公開状態 */
  document.querySelectorAll('.e-status button').forEach(btn => {
    btn.addEventListener('click', async () => {
      const v = btn.dataset.v;
      if (manual.status === v) return;
      manual.status = v; renderStatus();
      await wnUpdateManual(manual.id, { status: v });
      wnShowToast(v === 'published' ? '公開しました' : '下書きに戻しました', 'success');
    });
  });

  /* 追加ボタン */
  document.getElementById('addCam').addEventListener('click', () => document.getElementById('inCam').click());
  document.getElementById('addImg').addEventListener('click', () => document.getElementById('inImg').click());
  document.getElementById('inCam').addEventListener('change', function () { addFileSteps(Array.from(this.files), 'photo'); this.value = ''; });
  document.getElementById('inImg').addEventListener('change', function () { addFileSteps(Array.from(this.files), 'photo'); this.value = ''; });
  document.getElementById('inSwap').addEventListener('change', function () { doSwapFile(this.files[0]); this.value = ''; });

  /* 下端の帯に写真を落としても手順にできる（PCで手が届きやすい場所に的を置く） */
  const bar = document.getElementById('addBar');
  const hasFiles = e => Array.from(e.dataTransfer?.types || []).includes('Files');
  bar.addEventListener('dragover', e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
    bar.classList.add('dragover');
  });
  bar.addEventListener('dragleave', e => { if (e.target === bar) bar.classList.remove('dragover'); });
  bar.addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    bar.classList.remove('dragover');
    addFileSteps(Array.from(e.dataTransfer.files), 'photo');
  });
  document.getElementById('addFile').addEventListener('click', openFilePicker);
  document.getElementById('pickSearch').addEventListener('input', () => {
    clearTimeout(pickSearchTimer);
    pickSearchTimer = setTimeout(loadPickerFiles, 400);
  });
  document.querySelectorAll('#pickScope button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (pickScope === btn.dataset.scope) return;
      pickScope = btn.dataset.scope;
      document.querySelectorAll('#pickScope button').forEach(b => b.classList.toggle('active', b === btn));
      loadPickerFiles();
    });
  });
  initTagPicker();
  document.getElementById('addText').addEventListener('click', () => {
    document.getElementById('textModal').classList.add('show');
    document.getElementById('textBody').value = '';
    setTimeout(() => document.getElementById('textBody').focus(), 50);
  });

  /* テキストモーダル タイプ切替 */
  let textType = 'heading';
  document.querySelectorAll('.e-type-row button').forEach(b => {
    b.addEventListener('click', () => {
      textType = b.dataset.t;
      document.querySelectorAll('.e-type-row button').forEach(x => x.classList.toggle('active', x === b));
    });
  });
  document.getElementById('textAddBtn').addEventListener('click', async () => {
    const body = document.getElementById('textBody').value.trim();
    if (!body) return;
    document.getElementById('textModal').classList.remove('show');
    await addTextStep(textType, body);
  });

  /* モーダルの閉じる */
  document.querySelectorAll('[data-close]').forEach(el => {
    el.addEventListener('click', () => document.getElementById(el.dataset.close).classList.remove('show'));
  });
  document.querySelectorAll('.e-overlay').forEach(ov => {
    ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('show'); });
  });

  /* 画面幅が変わったら1列 ⇄ 二面を切り替える */
  wideMq.addEventListener('change', e => {
    isWide = e.matches;
    if (manual) renderSteps();
  });

  /* 二面のときは ↑↓ で手順を選ぶ（入力中は邪魔しない） */
  document.addEventListener('keydown', e => {
    if (!isWide || !manual || !manual.steps.length) return;
    const tag = (e.target.tagName || '').toLowerCase();

    /* 説明欄で Enter → 確定して次の手順へ（改行は Shift+Enter） */
    if (e.key === 'Enter' && !e.shiftKey && e.target.classList?.contains('e-detail-cap')) {
      e.preventDefault();
      e.target.blur();                                   /* change を発火させて保存 */
      focusStep(Math.min(focusIdx + 1, manual.steps.length - 1));
      const next = document.querySelector('#detail .e-detail-cap');
      if (next) next.focus();
      return;
    }

    /* F2 を押している間だけ聞く（キーボードから手を離さずに声で書ける） */
    if (e.key === 'F2' && !e.repeat) {
      const btn = document.querySelector('#detail .e-voice');
      const ta  = document.querySelector('#detail .e-detail-cap');
      if (btn && ta) { e.preventDefault(); startVoice(ta, btn); }
      return;
    }

    if (tag === 'input' || tag === 'textarea') return;
    if (e.key === 'ArrowDown') { e.preventDefault(); focusStep(Math.min(focusIdx + 1, manual.steps.length - 1)); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); focusStep(Math.max(focusIdx - 1, 0)); }
  });
  document.addEventListener('keyup', e => { if (e.key === 'F2') stopVoice(); });

  /* マニュアル削除 */
  document.getElementById('delManualBtn').addEventListener('click', async () => {
    if (!confirm('このマニュアルを削除しますか？（元に戻せません）')) return;
    const ok = await wnDeleteManual(manual.id);
    if (ok) location.href = 'manuals.html';
    else wnShowToast('削除に失敗しました', 'danger');
  });

  load();
});
</script>
</body>
</html>
