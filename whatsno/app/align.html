<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E3A5F">
  <title>並べて表示 | What'sNo</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/wn-app.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: var(--bg); }

    .align-wrap { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* トップバー */
    .align-topbar {
      height: 52px; background: var(--white); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0; z-index: 10;
    }
    .align-topbar-back {
      color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px;
      text-decoration: none; white-space: nowrap;
    }
    .align-topbar-back:hover { color: var(--primary); }
    .align-topbar-title { font-size: 14px; font-weight: 700; color: var(--primary); flex: 1; }
    .align-topbar-hint { font-size: 11px; color: var(--muted); white-space: nowrap; }

    /* 本体レイアウト: Google フォト方式の justified layout。
       行ごとにサムネイルの高さを揃え、カード幅を画像の縦横比に比例させて
       行の合計幅がコンテナ幅ちょうどになるようJS(layoutAlign)が算出する。
       CSS Gridで列幅を固定すると縦横比の違いでカード下部に空白が残るため
       (横長画像の隣に縦長画像が並ぶと行の高さが最も高いカードに引っ張られる)、
       行の構成そのものをJS側で決める方式に変えている。 */
    .align-body { flex: 1; overflow: auto; padding: 14px; }
    .align-grid { display: flex; flex-direction: column; gap: 14px; }
    .align-row  { display: flex; gap: 14px; align-items: flex-start; }
    @media (max-width: 560px) { .align-topbar-hint { display: none; } }

    .align-card {
      display: block; flex: none; width: 100%;
      background: var(--white); border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; cursor: pointer; text-decoration: none; color: inherit;
      transition: box-shadow .15s;
    }
    .align-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.14); }

    /* 高さはJSがpxで指定する(行内で必ず同一値になる)。初期表示用に160pxを置く。 */
    .align-thumb-wrap {
      position: relative; width: 100%; height: 160px; background: var(--bg);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .align-thumb-wrap img { display: block; width: 100%; height: 100%; object-fit: contain; }

    .align-badge {
      position: absolute; top: 6px; left: 6px; z-index: 2;
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(21,101,192,.9); color: #fff; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .align-card-link {
      position: absolute; top: 6px; right: 6px; z-index: 2;
      width: 24px; height: 24px; border-radius: 6px;
      background: rgba(255,255,255,.9); color: var(--muted); font-size: 11px;
      display: flex; align-items: center; justify-content: center; text-decoration: none;
    }
    .align-card-link:hover { color: var(--primary); }

    /* 行内でカード高さを完全に揃えるため、ラベル部の高さも固定する
       (可変にすると1件だけ折り返して行の下端がずれる) */
    .align-card-label {
      height: 30px; line-height: 16px; padding: 7px 10px;
      font-size: 12px; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* サムネ枠の高さはJS管理なので、中身は絶対配置にして高さに影響させない */
    .align-card-spin, .align-card-noPreview {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; color: var(--muted); padding: 10px; font-size: 11px; text-align: center;
    }
    .align-card-spin i, .align-card-noPreview i { font-size: 26px; opacity: .5; }
    .align-card-error { color: #C62828; }
    .align-card-error i { color: #C62828; opacity: .8; }

    /* エラー(全体) */
    .align-error {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; color: var(--muted);
      background: var(--bg);
    }
    .align-error i { font-size: 48px; opacity: .4; }

    /* ── ライトボックス(クリックで実物大プレビュー) ── */
    .align-lightbox {
      position: fixed; inset: 0; background: rgba(10,14,20,.92); z-index: 999;
      display: none; flex-direction: column;
    }
    .align-lightbox.show { display: flex; }
    .align-lightbox-top {
      height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 8px;
      padding: 0 14px; color: #fff; background: #12161f;
    }
    .align-lightbox-title {
      flex: 1; min-width: 0; font-size: 13px; font-weight: 700;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .align-lightbox-counter { font-size: 12px; color: rgba(255,255,255,.6); white-space: nowrap; }
    .align-lightbox-btn {
      width: 34px; height: 34px; border-radius: 8px; border: none; background: rgba(255,255,255,.12);
      color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; text-decoration: none;
    }
    .align-lightbox-btn:hover { background: rgba(255,255,255,.24); }

    .align-lightbox-body { flex: 1; position: relative; overflow: hidden; }
    .align-lightbox-content-wrap {
      position: absolute; inset: 0; overflow: auto;
      display: flex; align-items: flex-start; justify-content: center; padding: 16px;
    }
    .align-lightbox-content-wrap.align-pannable { touch-action: none; overscroll-behavior: contain; }
    .align-lightbox-content-wrap.zoomed { align-items: flex-start; justify-content: flex-start; }
    .align-content { max-width: 100%; border-radius: 6px; background: #fff; display: block; margin: auto; }
    .align-dxf-wrap { width: 100%; height: 100%; }
    .align-dxf-wrap canvas { display: block; }

    .align-lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 5;
      width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(0,0,0,.4);
      color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .align-lightbox-nav:hover { background: rgba(0,0,0,.6); }
    .align-lightbox-nav.prev { left: 14px; }
    .align-lightbox-nav.next { right: 14px; }

    .align-lightbox-page-badge {
      position: absolute; left: 20px; bottom: 16px; z-index: 4;
      background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 10px;
    }
    .align-lightbox-hint {
      position: absolute; right: 20px; bottom: 16px; z-index: 4; font-size: 11px; color: rgba(255,255,255,.5);
    }

    .align-lightbox-spin, .align-lightbox-error, .align-lightbox-noPreview {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; color: rgba(255,255,255,.7); width: 100%; height: 100%; text-align: center;
    }
    .align-lightbox-spin i, .align-lightbox-noPreview i { font-size: 40px; opacity: .5; }
    .align-lightbox-error i { font-size: 34px; color: #EF5350; }
  </style>
</head>
<body>
<div class="align-wrap">

  <!-- トップバー -->
  <div class="align-topbar">
    <a href="dashboard.html" class="align-topbar-back">
      <i class="fa-solid fa-chevron-left"></i> 一覧に戻る
    </a>
    <div class="align-topbar-title" id="alignTitle">並べて表示</div>
    <div class="align-topbar-hint">クリックで拡大表示</div>
  </div>

  <!-- 本体 -->
  <div class="align-body" id="alignBody">
    <div class="align-grid" id="alignGrid"></div>
  </div>

</div>

<!-- ライトボックス -->
<div class="align-lightbox" id="alignLightbox">
  <div class="align-lightbox-top">
    <button class="align-lightbox-btn" id="lbCloseBtn" title="閉じる（Esc）"><i class="fa-solid fa-xmark"></i></button>
    <div class="align-lightbox-title" id="lbTitle"></div>
    <div class="align-lightbox-counter" id="lbCounter"></div>
    <a class="align-lightbox-btn" id="lbDetailLink" href="#" target="_blank" rel="noopener" title="詳細を開く（新しいタブ）">
      <i class="fa-solid fa-up-right-from-square"></i>
    </a>
  </div>
  <div class="align-lightbox-body">
    <button class="align-lightbox-nav prev" id="lbPrevBtn" title="前へ（←）"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="align-lightbox-nav next" id="lbNextBtn" title="次へ（→）"><i class="fa-solid fa-chevron-right"></i></button>
    <div class="align-lightbox-content-wrap" id="lbContentWrap"></div>
  </div>
</div>

<!-- toast -->
<div id="toastContainer" style="position:fixed;bottom:24px;right:24px;z-index:99999;display:flex;flex-direction:column;gap:8px;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="../../solid/assets/js/auth.js"></script>
<script src="../assets/js/wn-api.js"></script>
<script src="../assets/js/wn-dxf-viewer.js"></script>
<script>
'use strict';

const alignIds = (new URLSearchParams(location.search).get('ids') || '')
  .split(',').map(s => s.trim()).filter(Boolean);

const ALIGN_IMG_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp'];
const extOf = f => (f?.file_name ?? '').split('.').pop().toLowerCase();

/* 選択順を保持したままファイル本体をキャッシュ（グリッドはサムネイルのみ、
   ライトボックスを開いたときだけ実体を取得する: index → file record） */
const alignFiles = new Array(alignIds.length).fill(null);

/* justified layout 用: index → サムネイルの縦横比(w/h)。0は未取得(仮に正方形として扱う) */
const alignAspects = new Array(alignIds.length).fill(0);
const alignCardEls = new Array(alignIds.length).fill(null);

const ALIGN_GAP        = 14;  /* CSSの gap と一致させること */
const ALIGN_LABEL_H    = 30;  /* .align-card-label の固定高さ */
const ALIGN_BORDER_H   = 2;   /* カード上下のborder */
const ALIGN_MIN_ROW_H  = 110; /* サムネイルをこれ以上小さくしない */
const ALIGN_MIN_CARD_W = 190; /* 1行に詰め込みすぎないための下限 */

/* 安全網: 予期しない例外でページ全体が沈黙状態にならないようにする */
window.addEventListener('error', e => console.error(e.error || e.message));
window.addEventListener('unhandledrejection', e => console.error(e.reason));

document.addEventListener('DOMContentLoaded', async () => {
  if (alignIds.length < 2) { showAlignFatal('並べて表示するファイルが指定されていません'); return; }
  requireSpaceAuth();

  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  document.getElementById('alignTitle').textContent = `並べて表示（${alignIds.length}件）`;

  const grid = document.getElementById('alignGrid');
  grid.innerHTML = alignIds.map((id, i) => cardSkeletonHtml(id, i)).join('');
  alignIds.forEach((id, i) => { alignCardEls[i] = document.getElementById(`alignCard-${id}`); });

  layoutAlign();
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layoutAlign, 150);
  });

  initLightboxControls();

  /* 各カードは独立して読み込み・描画する（1件失敗しても他は表示され続ける） */
  alignIds.forEach((id, i) => loadCard(id, i));
});

/* ────────────────── justified layout（隙間なく並べる） ──────────────────
   考え方は Google フォト / Flickr と同じ:
     1. 並び順を保ったまま、連続するカードを「行」に区切る
     2. 行内のカード幅を各サムネイルの縦横比に比例させ、
        合計がコンテナ幅ちょうどになる高さを解く（→ 行の右端まで必ず埋まる）
     3. 行内は同じ高さ・ラベル高さも固定なので、カード下部にも空白が出ない
   行の区切りは貪欲法ではなく動的計画法で選ぶ。貪欲だと最終行だけ極端に
   詰まったり空いたりするが、DPなら全行が目標高さに均等に近づく。 */

/* 縦横比の極端な値はレイアウトを壊す(横長パノラマ1枚で行が潰れる等)ため丸める */
function alignAspectAt(i) {
  const a = alignAspects[i];
  return a > 0 ? Math.min(Math.max(a, 0.4), 3.0) : 1;
}

/* 目標高さ targetH に対して、各行の高さが targetH からどれだけ離れるかの
   総コストが最小になる行分割を返す。コストは比率の対数の2乗（targetHの
   半分になる/2倍になるを対称に扱う）。 */
function buildAlignRows(W, targetH, maxPerRow) {
  const n = alignIds.length;
  const cost = new Array(n + 1).fill(Infinity);
  const from = new Array(n + 1).fill(-1);
  cost[0] = 0;

  for (let i = 0; i < n; i++) {
    if (cost[i] === Infinity) continue;
    let sumA = 0;
    for (let j = i; j < n && j - i < maxPerRow; j++) {
      sumA += alignAspectAt(j);
      const cnt = j - i + 1;
      const h = (W - (cnt - 1) * ALIGN_GAP) / sumA;
      if (h <= 0) break;
      const c = cost[i] + Math.pow(Math.log(h / targetH), 2);
      if (c < cost[j + 1]) { cost[j + 1] = c; from[j + 1] = i; }
      /* これ以上詰めても行はさらに低くなるだけ(コスト増)なので打ち切り */
      if (h < targetH * 0.5 && j > i) break;
    }
  }

  const rows = [];
  for (let end = n; end > 0; end = from[end]) {
    const start = from[end];
    const items = [];
    for (let k = start; k < end; k++) items.push(k);
    let sumA = 0;
    items.forEach(k => { sumA += alignAspectAt(k); });
    const raw = (W - (items.length - 1) * ALIGN_GAP) / sumA;
    /* 高さの上限は最終行にだけ掛ける。最終行は残り物なので1枚だけ極端に
       巨大化することがあり、その場合は左寄せ（幅は余る）を許容する。
       途中の行に上限を掛けると幅が足りなくなり、行の右側に空白が残る。 */
    const isLast = rows.length === 0;
    const h = isLast ? Math.min(raw, targetH * 1.6) : raw;
    rows.unshift({ items, h, full: h === raw });
  }
  return rows;
}

function alignRowsTotalHeight(rows) {
  const inner = rows.reduce((s, r) => s + r.h + ALIGN_LABEL_H + ALIGN_BORDER_H, 0);
  return inner + Math.max(0, rows.length - 1) * ALIGN_GAP;
}

/* 全体が1画面に収まる範囲で、できるだけ大きいサムネイル高さを選ぶ。
   targetHを上げるほど1行の枚数が減り→行数が増え→総高さが増えるので、
   総高さは targetH に対して単調増加とみなして二分探索できる。 */
function pickAlignTargetHeight(W, availH, maxPerRow) {
  const total = th => alignRowsTotalHeight(buildAlignRows(W, th, maxPerRow));
  /* 件数が多く1画面に収まらない場合はスクロール前提。ここで無理に縮めても
     全部は入らずサムネイルが小さくなるだけなので、画面高さの1/3を目安にする。 */
  const base = Math.max(ALIGN_MIN_ROW_H, Math.round(availH / 3));
  const hi0 = Math.max(base + 1, availH - ALIGN_LABEL_H - ALIGN_BORDER_H);
  if (total(base) > availH) return base;
  if (total(hi0) <= availH) return hi0;
  let lo = base, hi = hi0;
  for (let k = 0; k < 16; k++) {
    const mid = (lo + hi) / 2;
    if (total(mid) <= availH) lo = mid; else hi = mid;
  }
  return lo;
}

function layoutAlign(retry) {
  const grid = document.getElementById('alignGrid');
  const body = document.getElementById('alignBody');
  if (!grid || !body) return;
  const W = grid.clientWidth;
  if (W < 60) return;
  const availH = Math.max(240, body.clientHeight - 28);

  /* スマホ幅では下限をそのまま使うと1行1枚になり縦に長大化するため緩める */
  const minCardW = W < 640 ? 130 : ALIGN_MIN_CARD_W;
  const maxPerRow = Math.max(1, Math.floor((W + ALIGN_GAP) / (minCardW + ALIGN_GAP)));
  const targetH = pickAlignTargetHeight(W, availH, maxPerRow);
  const rows = buildAlignRows(W, targetH, maxPerRow);

  const frag = document.createDocumentFragment();
  rows.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'align-row';
    const h = Math.round(row.h);
    const avail = W - (row.items.length - 1) * ALIGN_GAP;
    let used = 0;
    row.items.forEach((idx, k) => {
      const card = alignCardEls[idx];
      if (!card) return;
      const isLast = k === row.items.length - 1;
      /* 端数を最後の1枚で吸収し、行の右端をコンテナ幅にぴったり合わせる */
      const w = (isLast && row.full) ? avail - used : Math.round(row.h * alignAspectAt(idx));
      used += w;
      card.style.width = Math.max(40, w) + 'px';
      const thumb = card.querySelector('.align-thumb-wrap');
      if (thumb) thumb.style.height = h + 'px';
      rowEl.appendChild(card);
    });
    frag.appendChild(rowEl);
  });
  grid.innerHTML = '';
  grid.appendChild(frag);

  /* 組み直しで縦スクロールバーが出た(消えた)場合はコンテナ幅が変わり、
     計算した幅とズレて右端に隙間が残る。幅が変わったときだけ1回やり直す。 */
  if (!retry && grid.clientWidth !== W) layoutAlign(true);
}

/* サムネイルは1件ずつ非同期に届くため、届くたびに組み直す（まとめて1回） */
let alignLayoutTimer = null;
function scheduleAlignLayout() {
  clearTimeout(alignLayoutTimer);
  alignLayoutTimer = setTimeout(layoutAlign, 60);
}

function cardSkeletonHtml(id, i) {
  return `
  <div class="align-card" id="alignCard-${id}" data-idx="${i}">
    <div class="align-thumb-wrap" id="alignThumb-${id}">
      <span class="align-badge">${i + 1}</span>
      <a href="file-detail.html?id=${encodeURIComponent(id)}" target="_blank" rel="noopener"
         class="align-card-link" title="詳細を開く（新しいタブ）" onclick="event.stopPropagation();">
        <i class="fa-solid fa-up-right-from-square"></i>
      </a>
      <div class="align-card-spin"><i class="fa-solid fa-spinner fa-spin"></i></div>
    </div>
    <div class="align-card-label" id="alignName-${id}">読み込み中…</div>
  </div>`;
}

async function loadCard(id, i) {
  const nameEl  = document.getElementById(`alignName-${id}`);
  const thumbEl = document.getElementById(`alignThumb-${id}`);
  const cardEl  = document.getElementById(`alignCard-${id}`);
  if (!nameEl || !thumbEl || !cardEl) return;
  try {
    const res = await wnFetch(`/wn/files/${id}`);
    if (!res || !res.ok) throw new Error('ファイル情報の取得に失敗しました');
    const file = (await res.json()).data;
    if (!file) throw new Error('ファイルが見つかりません');

    alignFiles[i] = file;
    nameEl.textContent = file.file_name;
    nameEl.title = file.file_name;
    cardEl.addEventListener('click', () => openLightbox(i));

    const thumbUrl = wnThumbUrl(file.id, file.updated_at ?? file.created_at);
    const img = document.createElement('img');
    img.alt = '';
    const ok = await new Promise(resolve => {
      img.onload  = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = thumbUrl;
    });
    const spin = thumbEl.querySelector('.align-card-spin');
    if (spin) spin.remove();
    if (ok) {
      /* 実物の縦横比が分かった時点でレイアウトを組み直す（隙間なく詰めるため） */
      if (img.naturalWidth > 0 && img.naturalHeight > 0) {
        alignAspects[i] = img.naturalWidth / img.naturalHeight;
        scheduleAlignLayout();
      }
      thumbEl.appendChild(img);
    } else {
      const { icon, cls } = (typeof wnFileIcon === 'function')
        ? wnFileIcon(file.file_name, file.mime_type) : { icon: 'fa-file', cls: '' };
      const ph = document.createElement('div');
      ph.className = 'align-card-noPreview';
      ph.innerHTML = `<i class="fa-solid ${icon} ${cls}"></i><span>プレビューなし</span>`;
      thumbEl.appendChild(ph);
    }
  } catch (err) {
    console.error(err);
    const spin = thumbEl.querySelector('.align-card-spin');
    if (spin) spin.remove();
    nameEl.textContent = 'エラー';
    const ph = document.createElement('div');
    ph.className = 'align-card-noPreview align-card-error';
    ph.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i><span>${h(err.message || '読み込みに失敗しました')}</span>`;
    thumbEl.appendChild(ph);
  }
}

/* ────────────────── ライトボックス(実物大プレビュー) ────────────────── */
let lbIndex = -1;
let lbDispose = null; /* DXFビューアの後片付け(WebGLコンテキスト解放)用 */
let lbRenderToken = 0; /* 連打で次へ/前へした際、古い非同期処理が新しい描画を上書きしないためのトークン */

function initLightboxControls() {
  document.getElementById('lbCloseBtn').addEventListener('click', closeLightbox);
  document.getElementById('lbPrevBtn').addEventListener('click', () => stepLightbox(-1));
  document.getElementById('lbNextBtn').addEventListener('click', () => stepLightbox(1));
  document.getElementById('alignLightbox').addEventListener('click', e => {
    if (e.target.id === 'alignLightbox') closeLightbox();
  });
  window.addEventListener('keydown', e => {
    const lb = document.getElementById('alignLightbox');
    if (!lb.classList.contains('show')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') stepLightbox(-1);
    else if (e.key === 'ArrowRight') stepLightbox(1);
  });
}

function openLightbox(i) {
  lbIndex = i;
  document.getElementById('alignLightbox').classList.add('show');
  renderLightbox(i);
}

function closeLightbox() {
  document.getElementById('alignLightbox').classList.remove('show');
  disposeLightboxContent();
  document.getElementById('lbContentWrap').innerHTML = '';
}

function stepLightbox(dir) {
  const n = alignIds.length;
  lbIndex = (lbIndex + dir + n) % n;
  renderLightbox(lbIndex);
}

function disposeLightboxContent() {
  if (lbDispose) { try { lbDispose(); } catch (_) {} lbDispose = null; }
}

async function renderLightbox(i) {
  const myToken = ++lbRenderToken;
  disposeLightboxContent();
  const id = alignIds[i];
  const wrap = document.getElementById('lbContentWrap');
  wrap.className = 'align-lightbox-content-wrap';
  wrap.innerHTML = `<div class="align-lightbox-spin"><i class="fa-solid fa-spinner fa-spin"></i><span>読み込み中…</span></div>`;
  document.getElementById('lbCounter').textContent = `${i + 1} / ${alignIds.length}`;
  document.getElementById('lbDetailLink').href = `file-detail.html?id=${encodeURIComponent(id)}`;

  try {
    const file = alignFiles[i] ?? await (async () => {
      const res = await wnFetch(`/wn/files/${id}`);
      if (!res || !res.ok) throw new Error('ファイル情報の取得に失敗しました');
      const f = (await res.json()).data;
      if (!f) throw new Error('ファイルが見つかりません');
      alignFiles[i] = f;
      return f;
    })();
    /* この間に次へ/前へが押されていたら(=より新しいトークンが発行済み)、
       ここで中断して古い結果によるDOM上書き・二重描画(DXFのWebGLコンテキストリーク等)を防ぐ */
    if (myToken !== lbRenderToken) return;

    document.getElementById('lbTitle').textContent = file.file_name;
    document.getElementById('lbTitle').title = file.file_name;

    await renderLightboxContent(file, wrap);
    if (myToken !== lbRenderToken) { disposeLightboxContent(); return; }
  } catch (err) {
    if (myToken !== lbRenderToken) return;
    console.error(err);
    wrap.innerHTML = `
      <div class="align-lightbox-error">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>${h(err.message || '読み込みに失敗しました')}</span>
      </div>`;
  }
}

async function renderLightboxContent(file, wrap) {
  const ext = extOf(file);
  wrap.innerHTML = '';
  /* ページバッジはwrapの外(.align-lightbox-body)に置くため個別に掃除する */
  wrap.parentElement.querySelectorAll('.align-lightbox-page-badge').forEach(b => b.remove());

  if (ext === 'pdf') {
    if (typeof pdfjsLib === 'undefined') throw new Error('PDF表示ライブラリの読み込みに失敗しました');
    const url = await wnGetViewUrl(file.id);
    if (!url) throw new Error('ファイルのURL取得に失敗しました');
    const doc = await pdfjsLib.getDocument(url).promise;
    const page = await doc.getPage(1);
    const vp = page.getViewport({ scale: 2 });
    const canvas = document.createElement('canvas');
    canvas.width = vp.width;
    canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    canvas.className = 'align-content';
    wrap.appendChild(canvas);
    if (doc.numPages > 1) {
      const badge = document.createElement('div');
      badge.className = 'align-lightbox-page-badge';
      badge.textContent = `1 / ${doc.numPages} ページ`;
      wrap.parentElement.appendChild(badge);
    }
    initAlignZoomPan(wrap, canvas);

  } else if (ALIGN_IMG_EXTS.includes(ext)) {
    const buf = await wnFetchFileBuffer(file.id);
    if (!buf) throw new Error('画像の取得に失敗しました');
    const blobUrl = URL.createObjectURL(new Blob([buf]));
    const img = document.createElement('img');
    img.className = 'align-content';
    img.alt = '';
    await new Promise((resolve, reject) => {
      img.onload  = resolve;
      img.onerror = () => reject(new Error('画像の表示に失敗しました'));
      img.src = blobUrl;
    });
    wrap.appendChild(img);
    initAlignZoomPan(wrap, img);

  } else if (ext === 'dxf') {
    if (typeof wnRenderDxf !== 'function' || typeof THREE === 'undefined') {
      throw new Error('DXF表示ライブラリの読み込みに失敗しました');
    }
    const text = await fetchDxfText(file.id);
    if (!text) throw new Error('DXFの取得に失敗しました');
    const dxfWrap = document.createElement('div');
    dxfWrap.className = 'align-dxf-wrap';
    wrap.appendChild(dxfWrap);
    /* wnRenderDxf は内部で独自にホイールズーム/ドラッグパンを備えている */
    const handle = wnRenderDxf(dxfWrap, text);
    lbDispose = handle?.dispose ?? null;

  } else {
    /* Office文書・その他: サーバー生成サムネイルにフォールバック */
    const thumbUrl = wnThumbUrl(file.id, file.updated_at ?? file.created_at);
    const img = document.createElement('img');
    img.className = 'align-content';
    img.alt = '';
    const ok = await new Promise(resolve => {
      img.onload  = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = thumbUrl;
    });
    if (!ok) {
      const { icon, cls } = (typeof wnFileIcon === 'function')
        ? wnFileIcon(file.file_name, file.mime_type) : { icon: 'fa-file', cls: '' };
      wrap.innerHTML = `
        <div class="align-lightbox-noPreview">
          <i class="fa-solid ${icon} ${cls}"></i>
          <span>プレビュー非対応の形式です。「詳細を開く」から本体を確認してください</span>
        </div>`;
      return;
    }
    wrap.appendChild(img);
    initAlignZoomPan(wrap, img);
  }
}

async function fetchDxfText(fileId) {
  const token = sessionStorage.getItem('space_token');
  const url = WN_API_BASE + `/wn/files/${fileId}/public-view` + (token ? `?token=${encodeURIComponent(token)}` : '');
  try {
    const res = await fetch(url);
    if (!res.ok) return null;
    return await res.text();
  } catch { return null; }
}

/* ── ライトボックス内のズーム・パン ──
   Ctrl/Cmd+ホイールまたはピンチで拡大、1本指ドラッグでパン、ダブルクリックでトグル。 */
function initAlignZoomPan(wrap, el) {
  let zoom = 1;
  let baseW = 0;
  const ZOOM_MIN = 1, ZOOM_MAX = 6;

  requestAnimationFrame(() => {
    el.style.maxWidth = '100%';
    baseW = el.getBoundingClientRect().width || el.width || 0;
  });

  function apply() {
    if (!baseW) return;
    if (zoom <= 1) { el.style.width = ''; el.style.maxWidth = '100%'; }
    else { el.style.width = Math.round(baseW * zoom) + 'px'; el.style.maxWidth = 'none'; }
    wrap.classList.toggle('zoomed', zoom > 1);
  }

  function setZoom(nz, cx, cy) {
    nz = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, nz));
    if (Math.abs(nz - zoom) < 0.005) return;
    const px = cx ?? wrap.clientWidth  / 2;
    const py = cy ?? wrap.clientHeight / 2;
    const fx = (wrap.scrollLeft + px) / Math.max(1, wrap.scrollWidth);
    const fy = (wrap.scrollTop  + py) / Math.max(1, wrap.scrollHeight);
    zoom = nz;
    apply();
    wrap.scrollLeft = fx * wrap.scrollWidth  - px;
    wrap.scrollTop  = fy * wrap.scrollHeight - py;
  }

  wrap.addEventListener('wheel', e => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    setZoom(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  wrap.addEventListener('dblclick', e => {
    const r = wrap.getBoundingClientRect();
    setZoom(zoom > 1 ? 1 : 2, e.clientX - r.left, e.clientY - r.top);
  });

  wrap.classList.add('align-pannable');
  const ptrs = new Map();
  let panning = false, panPtrId = null, startX = 0, startY = 0, startL = 0, startT = 0;
  let pinching = false, pinchStartDist = 0, pinchStartZoom = 1;

  wrap.addEventListener('pointerdown', e => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (ptrs.size >= 2) {
      if (panning) {
        panning = false;
        try { wrap.releasePointerCapture(panPtrId); } catch (_) {}
        panPtrId = null;
        wrap.style.cursor = '';
      }
      if (ptrs.size === 2) {
        pinching = true;
        const [a, b] = [...ptrs.values()];
        pinchStartDist = Math.hypot(a.x - b.x, a.y - b.y);
        pinchStartZoom = zoom;
      }
      return;
    }

    if (e.button !== 0) return;
    const pannable = wrap.scrollWidth > wrap.clientWidth || wrap.scrollHeight > wrap.clientHeight;
    if (!pannable) return;
    e.preventDefault();
    panning  = true;
    panPtrId = e.pointerId;
    startX = e.clientX; startY = e.clientY;
    startL = wrap.scrollLeft; startT = wrap.scrollTop;
    wrap.setPointerCapture(e.pointerId);
    wrap.style.cursor = 'grabbing';
  });

  wrap.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pinching && ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchStartDist > 0) setZoom(pinchStartZoom * (dist / pinchStartDist));
      return;
    }

    if (!panning) return;
    wrap.scrollLeft = startL - (e.clientX - startX);
    wrap.scrollTop  = startT - (e.clientY - startY);
  });

  const endPan = e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinching = false;
    if (!panning || e.pointerId !== panPtrId) return;
    panning  = false;
    panPtrId = null;
    try { wrap.releasePointerCapture(e.pointerId); } catch (_) {}
    wrap.style.cursor = '';
  };
  wrap.addEventListener('pointerup', endPan);
  wrap.addEventListener('pointercancel', endPan);
}

function showAlignFatal(msg) {
  const body = document.getElementById('alignBody');
  if (!body) return;
  body.innerHTML = `
    <div class="align-error">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <p style="font-size:14px;max-width:80%;text-align:center;">${h(msg)}</p>
      <a href="dashboard.html" class="btn btn-outline btn-sm">一覧に戻る</a>
    </div>`;
}

function h(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
