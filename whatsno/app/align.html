<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E3A5F">
  <title>並べて表示 | What'sNo</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/wn-app.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: var(--bg); }

    .align-wrap { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* トップバー */
    .align-topbar {
      height: 52px; background: var(--white); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0; z-index: 10;
    }
    .align-topbar-back {
      color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px;
      text-decoration: none; white-space: nowrap;
    }
    .align-topbar-back:hover { color: var(--primary); }
    .align-topbar-title { font-size: 14px; font-weight: 700; color: var(--primary); flex: 1; }
    .align-topbar-hint { font-size: 11px; color: var(--muted); white-space: nowrap; }

    /* 本体レイアウト: Google フォト方式の justified layout。
       行ごとにサムネイルの高さを揃え、カード幅を画像の縦横比に比例させて
       行の合計幅がコンテナ幅ちょうどになるようJS(layoutAlign)が算出する。
       CSS Gridで列幅を固定すると縦横比の違いでカード下部に空白が残るため
       (横長画像の隣に縦長画像が並ぶと行の高さが最も高いカードに引っ張られる)、
       行の構成そのものをJS側で決める方式に変えている。 */
    .align-body { flex: 1; overflow: auto; padding: 14px; }
    /* カードは並べ替えで親を付け替えない（3D表示の iframe は付け替えると読み込み直しになる）。
       幅だけJSで決め、行の合計がちょうどコンテナ幅になるので flex-wrap が同じ位置で折り返す。 */
    .align-grid { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
    @media (max-width: 560px) { .align-topbar-hint { display: none; } }

    .align-card {
      display: block; flex: none; width: 100%;
      background: var(--white); border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; cursor: pointer; text-decoration: none; color: inherit;
      transition: box-shadow .15s;
    }
    .align-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.14); }

    /* 高さはJSがpxで指定する(行内で必ず同一値になる)。初期表示用に160pxを置く。 */
    .align-thumb-wrap {
      position: relative; width: 100%; height: 160px; background: var(--bg);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .align-thumb-wrap img { display: block; width: 100%; height: 100%; object-fit: contain; }

    /* 番号とボタンは名前の行に置く（表示の上に重ねると、3Dの視点ボタンや図面が隠れる） */
    .align-badge {
      flex: none; width: 20px; height: 20px; border-radius: 50%;
      background: rgba(21,101,192,.9); color: #fff; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .align-card-btn {
      flex: none; width: 24px; height: 24px; border-radius: 6px; border: none; padding: 0;
      background: none; color: var(--muted); font-size: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; text-decoration: none;
    }
    .align-card-btn:hover { color: var(--primary); background: var(--bg); }

    /* 行内でカード高さを完全に揃えるため、ラベル部の高さも固定する
       (可変にすると1件だけ折り返して行の下端がずれる) */
    .align-card-label {
      height: 30px; padding: 0 6px 0 8px; display: flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: var(--text);
    }
    .align-card-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── カードの中でそのまま動かせる表示（3Dモデル・PDF） ── */
    .align-card.is-live { cursor: default; }
    .align-thumb-wrap img.align-thumb-under { visibility: hidden; }
    .align-model-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #eef2f6; }
    .align-model-frame.loading { opacity: 0; pointer-events: none; }
    .apv { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
    .apv.grabbing { cursor: grabbing; }
    .apv canvas { position: absolute; left: 0; top: 0; max-width: none; background: #fff; }
    .apv canvas.apv-base { box-shadow: 0 1px 4px rgba(0,0,0,.25); }
    .apv-bar {
      position: absolute; right: 8px; bottom: 8px; z-index: 3; cursor: default;
      display: flex; align-items: center; gap: 2px; padding: 3px;
      border-radius: 8px; background: rgba(31,41,51,.82); color: #fff; font-size: 12px;
    }
    .apv-bar button {
      width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: #fff;
      font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .apv-bar button:hover { background: rgba(255,255,255,.2); }
    .apv-bar .apv-page { padding: 0 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .apv-bar .apv-sep { width: 1px; height: 16px; background: rgba(255,255,255,.3); margin: 0 3px; }
    .apv-bar [hidden] { display: none; }
    .align-live-fill { position: relative; flex: 1; align-self: stretch; min-width: 0; overflow: hidden; border-radius: 6px; }

    /* サムネ枠の高さはJS管理なので、中身は絶対配置にして高さに影響させない */
    .align-card-spin, .align-card-noPreview {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; color: var(--muted); padding: 10px; font-size: 11px; text-align: center;
    }
    .align-card-spin i, .align-card-noPreview i { font-size: 26px; opacity: .5; }
    .align-card-error { color: #C62828; }
    .align-card-error i { color: #C62828; opacity: .8; }

    /* エラー(全体) */
    .align-error {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; color: var(--muted);
      background: var(--bg);
    }
    .align-error i { font-size: 48px; opacity: .4; }

    /* ── ライトボックス(クリックで実物大プレビュー) ── */
    .align-lightbox {
      position: fixed; inset: 0; background: rgba(10,14,20,.92); z-index: 999;
      display: none; flex-direction: column;
    }
    .align-lightbox.show { display: flex; }
    .align-lightbox-top {
      height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 8px;
      padding: 0 14px; color: #fff; background: #12161f;
    }
    .align-lightbox-title {
      flex: 1; min-width: 0; font-size: 13px; font-weight: 700;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .align-lightbox-counter { font-size: 12px; color: rgba(255,255,255,.6); white-space: nowrap; }
    .align-lightbox-btn {
      width: 34px; height: 34px; border-radius: 8px; border: none; background: rgba(255,255,255,.12);
      color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; text-decoration: none;
    }
    .align-lightbox-btn:hover { background: rgba(255,255,255,.24); }

    .align-lightbox-body { flex: 1; position: relative; overflow: hidden; }
    .align-lightbox-content-wrap {
      position: absolute; inset: 0; overflow: auto;
      display: flex; align-items: flex-start; justify-content: center; padding: 16px;
    }
    .align-lightbox-content-wrap.align-pannable { touch-action: none; overscroll-behavior: contain; }
    .align-lightbox-content-wrap.zoomed { align-items: flex-start; justify-content: flex-start; }
    .align-content { max-width: 100%; border-radius: 6px; background: #fff; display: block; margin: auto; }
    .align-dxf-wrap { width: 100%; height: 100%; }
    .align-dxf-wrap canvas { display: block; }

    .align-lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 5;
      width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(0,0,0,.4);
      color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .align-lightbox-nav:hover { background: rgba(0,0,0,.6); }
    .align-lightbox-nav.prev { left: 14px; }
    .align-lightbox-nav.next { right: 14px; }

    .align-lightbox-page-badge {
      position: absolute; left: 20px; bottom: 16px; z-index: 4;
      background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 10px;
    }
    .align-lightbox-hint {
      position: absolute; right: 20px; bottom: 16px; z-index: 4; font-size: 11px; color: rgba(255,255,255,.5);
    }

    .align-lightbox-spin, .align-lightbox-error, .align-lightbox-noPreview {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; color: rgba(255,255,255,.7); width: 100%; height: 100%; text-align: center;
    }
    .align-lightbox-spin i, .align-lightbox-noPreview i { font-size: 40px; opacity: .5; }
    .align-lightbox-error i { font-size: 34px; color: #EF5350; }
  </style>

<div id="toastContainer" style="position:fixed;bottom:24px;right:24px;z-index:99999;display:flex;flex-direction:column;gap:8px;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="../../solid/assets/js/auth.js?v=14"></script>
<script src="../assets/js/wn-api.js?v=38"></script>
<script src="../assets/js/wn-dxf-viewer.js"></script>
<script src="../assets/js/wn-thumb.js?v=20261112"></script>
<script>
'use strict';

/* ids は HTML の id 属性などに入れるので、英数字・ハイフン以外は受け付けない */
const alignIds = (new URLSearchParams(location.search).get('ids') || '')
  .split(',').map(s => s.trim()).filter(s => /^[\w-]+$/.test(s));

const ALIGN_IMG_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp'];
const ALIGN_3D_EXTS  = ['stl', 'stp', 'step'];

/* カードの中でそのまま動かす（3Dを回す・PDFを拡大して動かす）のはマウスのある端末だけ。
   指で触る端末では、カードの上をなぞると画面のスクロールと取り合いになるので、
   タップで開く大きい表示のほうで動かせるようにしている。
   3D は1件ごとに WebGL とメモリを使うので、同時に動かす件数に上限を置く（超えた分は画像のまま） */
const ALIGN_LIVE_IN_CARD   = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
const ALIGN_LIVE_3D_MAX    = 6;
const ALIGN_LIVE_PDF_MAX   = 12;
const ALIGN_LIVE_3D_BYTES  = 150 * 1024 * 1024;
const ALIGN_MODEL_PAGE     = 'model3d.html?v=20261117';
let alignLive3dCount = 0, alignLivePdfCount = 0;
let alignModelChain = Promise.resolve();
const extOf = f => (f?.file_name ?? '').split('.').pop().toLowerCase();

/* 選択順を保持したままファイル本体をキャッシュ（グリッドはサムネイルのみ、
   ライトボックスを開いたときだけ実体を取得する: index → file record） */
const alignFiles = new Array(alignIds.length).fill(null);

/* justified layout 用: index → サムネイルの縦横比(w/h)。0は未取得(仮に正方形として扱う) */
const alignAspects = new Array(alignIds.length).fill(0);
const alignCardEls = new Array(alignIds.length).fill(null);

const ALIGN_GAP        = 14;  /* CSSの gap と一致させること */
const ALIGN_LABEL_H    = 30;  /* .align-card-label の固定高さ */
const ALIGN_BORDER_H   = 2;   /* カード上下のborder */
const ALIGN_MIN_ROW_H  = 110; /* サムネイルをこれ以上小さくしない */
const ALIGN_MIN_CARD_W = 190; /* 1行に詰め込みすぎないための下限 */

/* 安全網: 予期しない例外でページ全体が沈黙状態にならないようにする */
window.addEventListener('error', e => console.error(e.error || e.message));
window.addEventListener('unhandledrejection', e => console.error(e.reason));

document.addEventListener('DOMContentLoaded', async () => {
  if (alignIds.length < 2) { showAlignFatal('並べて表示するファイルが指定されていません'); return; }
  requireSpaceAuth();
  if (!wnRequireExtendedOptions()) return;

  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  document.getElementById('alignTitle').textContent = `並べて表示（${alignIds.length}件）`;
  document.getElementById('alignHint').textContent = ALIGN_LIVE_IN_CARD
    ? '3D・PDFはそのまま動かせます（ドラッグで移動・ホイールで拡大縮小）'
    : 'タップで大きく表示（3D・PDFを動かせます）';

  const grid = document.getElementById('alignGrid');
  grid.innerHTML = alignIds.map((id, i) => cardSkeletonHtml(id, i)).join('');
  alignIds.forEach((id, i) => { alignCardEls[i] = document.getElementById(`alignCard-${id}`); });

  layoutAlign();
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layoutAlign, 150);
  });

  initLightboxControls();

  /* 各カードは独立して読み込み・描画する（1件失敗しても他は表示され続ける） */
  alignIds.forEach((id, i) => loadCard(id, i));
});

/* ────────────────── justified layout（隙間なく並べる） ──────────────────
   考え方は Google フォト / Flickr と同じ:
     1. 並び順を保ったまま、連続するカードを「行」に区切る
     2. 行内のカード幅を各サムネイルの縦横比に比例させ、
        合計がコンテナ幅ちょうどになる高さを解く（→ 行の右端まで必ず埋まる）
     3. 行内は同じ高さ・ラベル高さも固定なので、カード下部にも空白が出ない
   行の区切りは貪欲法ではなく動的計画法で選ぶ。貪欲だと最終行だけ極端に
   詰まったり空いたりするが、DPなら全行が目標高さに均等に近づく。 */

/* 縦横比の極端な値はレイアウトを壊す(横長パノラマ1枚で行が潰れる等)ため丸める */
function alignAspectAt(i) {
  const a = alignAspects[i];
  return a > 0 ? Math.min(Math.max(a, 0.4), 3.0) : 1;
}

/* 目標高さ targetH に対して、各行の高さが targetH からどれだけ離れるかの
   総コストが最小になる行分割を返す。コストは比率の対数の2乗（targetHの
   半分になる/2倍になるを対称に扱う）。 */
function buildAlignRows(W, targetH, maxPerRow) {
  const n = alignIds.length;
  const cost = new Array(n + 1).fill(Infinity);
  const from = new Array(n + 1).fill(-1);
  cost[0] = 0;

  for (let i = 0; i < n; i++) {
    if (cost[i] === Infinity) continue;
    let sumA = 0;
    for (let j = i; j < n && j - i < maxPerRow; j++) {
      sumA += alignAspectAt(j);
      const cnt = j - i + 1;
      const h = (W - (cnt - 1) * ALIGN_GAP) / sumA;
      if (h <= 0) break;
      const c = cost[i] + Math.pow(Math.log(h / targetH), 2);
      if (c < cost[j + 1]) { cost[j + 1] = c; from[j + 1] = i; }
      /* これ以上詰めても行はさらに低くなるだけ(コスト増)なので打ち切り */
      if (h < targetH * 0.5 && j > i) break;
    }
  }

  const rows = [];
  for (let end = n; end > 0; end = from[end]) {
    const start = from[end];
    const items = [];
    for (let k = start; k < end; k++) items.push(k);
    let sumA = 0;
    items.forEach(k => { sumA += alignAspectAt(k); });
    const raw = (W - (items.length - 1) * ALIGN_GAP) / sumA;
    /* 高さの上限は最終行にだけ掛ける。最終行は残り物なので1枚だけ極端に
       巨大化することがあり、その場合は左寄せ（幅は余る）を許容する。
       途中の行に上限を掛けると幅が足りなくなり、行の右側に空白が残る。 */
    const isLast = rows.length === 0;
    const h = isLast ? Math.min(raw, targetH * 1.6) : raw;
    rows.unshift({ items, h, full: h === raw });
  }
  return rows;
}

function alignRowsTotalHeight(rows) {
  const inner = rows.reduce((s, r) => s + r.h + ALIGN_LABEL_H + ALIGN_BORDER_H, 0);
  return inner + Math.max(0, rows.length - 1) * ALIGN_GAP;
}

/* 全体が1画面に収まる範囲で、できるだけ大きいサムネイル高さを選ぶ。
   targetHを上げるほど1行の枚数が減り→行数が増え→総高さが増えるので、
   総高さは targetH に対して単調増加とみなして二分探索できる。 */
function pickAlignTargetHeight(W, availH, maxPerRow) {
  const total = th => alignRowsTotalHeight(buildAlignRows(W, th, maxPerRow));
  /* 件数が多く1画面に収まらない場合はスクロール前提。ここで無理に縮めても
     全部は入らずサムネイルが小さくなるだけなので、画面高さの1/3を目安にする。 */
  const base = Math.max(ALIGN_MIN_ROW_H, Math.round(availH / 3));
  const hi0 = Math.max(base + 1, availH - ALIGN_LABEL_H - ALIGN_BORDER_H);
  if (total(base) > availH) return base;
  if (total(hi0) <= availH) return hi0;
  let lo = base, hi = hi0;
  for (let k = 0; k < 16; k++) {
    const mid = (lo + hi) / 2;
    if (total(mid) <= availH) lo = mid; else hi = mid;
  }
  return lo;
}

function layoutAlign(retry) {
  const grid = document.getElementById('alignGrid');
  const body = document.getElementById('alignBody');
  if (!grid || !body) return;
  /* 端数を切り捨てる（実幅より1pxでも広く見積もると、行の最後の1枚が次の行へ落ちる） */
  const W = Math.floor(grid.getBoundingClientRect().width);
  if (W < 60) return;
  const availH = Math.max(240, body.clientHeight - 28);

  /* スマホ幅では下限をそのまま使うと1行1枚になり縦に長大化するため緩める */
  const minCardW = W < 640 ? 130 : ALIGN_MIN_CARD_W;
  const maxPerRow = Math.max(1, Math.floor((W + ALIGN_GAP) / (minCardW + ALIGN_GAP)));
  const targetH = pickAlignTargetHeight(W, availH, maxPerRow);
  const rows = buildAlignRows(W, targetH, maxPerRow);

  rows.forEach(row => {
    const h = Math.round(row.h);
    const avail = W - (row.items.length - 1) * ALIGN_GAP;
    let used = 0;
    row.items.forEach((idx, k) => {
      const card = alignCardEls[idx];
      if (!card) return;
      const isLast = k === row.items.length - 1;
      /* 端数を最後の1枚で吸収し、行の右端をコンテナ幅にぴったり合わせる */
      const w = (isLast && row.full) ? avail - used : Math.round(row.h * alignAspectAt(idx));
      used += w;
      card.style.width = Math.max(40, w) + 'px';
      const thumb = card.querySelector('.align-thumb-wrap');
      if (thumb) thumb.style.height = h + 'px';
    });
  });

  /* 組み直しで縦スクロールバーが出た(消えた)場合はコンテナ幅が変わり、
     計算した幅とズレて右端に隙間が残る。幅が変わったときだけ1回やり直す。 */
  if (!retry && Math.floor(grid.getBoundingClientRect().width) !== W) layoutAlign(true);
}

/* サムネイルは1件ずつ非同期に届くため、届くたびに組み直す（まとめて1回） */
let alignLayoutTimer = null;
function scheduleAlignLayout() {
  clearTimeout(alignLayoutTimer);
  alignLayoutTimer = setTimeout(layoutAlign, 60);
}

function cardSkeletonHtml(id, i) {
  return `
  <div class="align-card" id="alignCard-${id}" data-idx="${i}">
    <div class="align-thumb-wrap" id="alignThumb-${id}">
      <div class="align-card-spin"><i class="fa-solid fa-spinner fa-spin"></i></div>
    </div>
    <div class="align-card-label">
      <span class="align-badge">${i + 1}</span>
      <span class="align-card-name" id="alignName-${id}">読み込み中…</span>
      <button type="button" class="align-card-btn align-card-expand" title="大きく表示">
        <i class="fa-solid fa-expand"></i>
      </button>
      <a href="file-detail.html?id=${encodeURIComponent(id)}" target="_blank" rel="noopener"
         class="align-card-btn align-card-link" title="詳細を開く（新しいタブ）" onclick="event.stopPropagation();">
        <i class="fa-solid fa-up-right-from-square"></i>
      </a>
    </div>
  </div>`;
}

async function loadCard(id, i) {
  const nameEl  = document.getElementById(`alignName-${id}`);
  const thumbEl = document.getElementById(`alignThumb-${id}`);
  const cardEl  = document.getElementById(`alignCard-${id}`);
  if (!nameEl || !thumbEl || !cardEl) return;
  try {
    const res = await wnFetch(`/wn/files/${id}`);
    if (!res || !res.ok) throw new Error('ファイル情報の取得に失敗しました');
    const file = (await res.json()).data;
    if (!file) throw new Error('ファイルが見つかりません');

    alignFiles[i] = file;
    nameEl.textContent = file.file_name;
    nameEl.title = file.file_name;
    /* そのまま動かせるカードは、表示の上のクリック（＝ドラッグ操作）では大きい表示を開かない。
       名前の行と「大きく表示」ボタンからは開ける */
    cardEl.addEventListener('click', e => {
      if (cardEl.classList.contains('is-live') && e.target.closest('.align-thumb-wrap')) return;
      openLightbox(i);
    });

    /* サーバーが作れない種別（PDF/HEIC/動画/DXF）は wn-thumb.js が生成して保存し直す。
       出せなければ null が返り、下の「プレビューなし」に落ちる。 */
    const thumbUrl = await wnThumbResolve(file);
    const img = document.createElement('img');
    img.alt = '';
    const ok = thumbUrl ? await new Promise(resolve => {
      img.onload  = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = thumbUrl;
    }) : false;
    const spin = thumbEl.querySelector('.align-card-spin');
    if (spin) spin.remove();
    if (ok) {
      /* 実物の縦横比が分かった時点でレイアウトを組み直す（隙間なく詰めるため） */
      if (img.naturalWidth > 0 && img.naturalHeight > 0) {
        alignAspects[i] = img.naturalWidth / img.naturalHeight;
        scheduleAlignLayout();
      }
      thumbEl.appendChild(img);
    } else {
      const { icon, cls } = (typeof wnFileIcon === 'function')
        ? wnFileIcon(file.file_name, file.mime_type) : { icon: 'fa-file', cls: '' };
      const ph = document.createElement('div');
      ph.className = 'align-card-noPreview';
      ph.innerHTML = `<i class="fa-solid ${icon} ${cls}"></i><span>プレビューなし</span>`;
      thumbEl.appendChild(ph);
    }
    upgradeCardToLive(file, i, cardEl, thumbEl);
  } catch (err) {
    console.error(err);
    const spin = thumbEl.querySelector('.align-card-spin');
    if (spin) spin.remove();
    nameEl.textContent = 'エラー';
    const ph = document.createElement('div');
    ph.className = 'align-card-noPreview align-card-error';
    ph.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i><span>${h(err.message || '読み込みに失敗しました')}</span>`;
    thumbEl.appendChild(ph);
  }
}

/* ────────────────── カードの中でそのまま動かす（3Dモデル・PDF） ──────────────────
   先に出した画像（サムネイル）はそのまま残し、動かせる表示の用意ができたら上に重ねる。
   用意できなかったときは画像のままになる（クリックで大きい表示は開ける）。 */
function upgradeCardToLive(file, i, cardEl, thumbEl) {
  if (!ALIGN_LIVE_IN_CARD) return;
  const ext = extOf(file);
  const settle = () => {
    thumbEl.querySelectorAll('img, .align-card-noPreview').forEach(el => {
      if (el.tagName === 'IMG') el.classList.add('align-thumb-under'); else el.remove();
    });
    cardEl.classList.add('is-live');
  };

  if (ALIGN_3D_EXTS.includes(ext)) {
    if (alignLive3dCount >= ALIGN_LIVE_3D_MAX || (file.file_size ?? 0) > ALIGN_LIVE_3D_BYTES) return;
    alignLive3dCount++;
    if (!alignAspects[i]) { alignAspects[i] = 4 / 3; scheduleAlignLayout(); }
    /* 解析が重いので1件ずつ順に開く */
    alignModelChain = alignModelChain.then(async () => {
      const view = alignModelView(thumbEl, file, ext);
      view.frame.classList.add('loading');
      try {
        await view.ready;
        view.frame.classList.remove('loading');
        settle();
      } catch (e) {
        console.error('[align] 3D表示に失敗', e);
        view.dispose();
      }
    });

  } else if (ext === 'pdf' && typeof pdfjsLib !== 'undefined') {
    if (alignLivePdfCount >= ALIGN_LIVE_PDF_MAX) return;
    alignLivePdfCount++;
    const view = alignPdfView(thumbEl, file.id, {
      /* 件数が多くて画面が縦にスクロールするときは、ホイールをスクロールに譲る（拡大は Ctrl＋ホイール） */
      wheelNeedsCtrl: () => {
        const body = document.getElementById('alignBody');
        return body.scrollHeight > body.clientHeight + 1;
      },
      onAspect: a => { alignAspects[i] = a; scheduleAlignLayout(); },
    });
    view.ready.then(settle).catch(e => {
      console.error('[align] PDF表示に失敗', e);
      view.dispose();
    });
  }
}

/* 3Dモデル: ファイル詳細と同じ model3d.html を iframe で開く（回す・拡大・視点ボタンがそのまま使える）。
   このページは DXF 用に three@0.160 を読んでいて STL/STEP 用の 0.128 と同居できないため、ページを分けている。 */
function alignModelView(host, file, ext) {
  const frame = document.createElement('iframe');
  frame.className = 'align-model-frame';
  frame.title = file.file_name || '3Dモデル';
  let dead = false;
  const loaded = new Promise(r => { frame.onload = r; });
  frame.src = ALIGN_MODEL_PAGE;
  host.appendChild(frame);
  const ready = (async () => {
    const buffer = await wnFetchFileBuffer(file.id, { timeoutMs: 300000 });
    if (!buffer) throw new Error('ファイルの取得に失敗しました');
    await loaded;
    if (dead) return;
    const ok = await frame.contentWindow.wnOpenModel(buffer, ext);
    if (!ok && !dead) throw new Error('3Dモデルを表示できませんでした');
  })();
  return { ready, frame, dispose() { dead = true; frame.remove(); } };
}

/* PDF: 拡大縮小とドラッグでの移動ができる表示。
   画質を落とさないため、止まるたびに「いま見えている範囲」を画面の実ピクセルに合わせて描き直す
   （拡大しても線や文字がぼやけない。描くのは見えている範囲だけなので、大きく拡大してもメモリは増えない）。
   動かしている最中は、先に描いておいたページ全体の画（下敷き）を伸び縮みさせて見せる。 */
function alignPdfView(host, fileId, opts = {}) {
  const ZOOM_MAX = 24;
  const BASE_LONG = 1600;          /* 下敷きの長辺(px) */
  const MAX_SHARP_PX = 12e6;       /* 描き直す画の画素数の上限 */
  const st = { dead: false, doc: null, page: null, pageNo: 1, pw: 1, ph: 1,
               fit: 1, zoom: 1, x: 0, y: 0, cw: 0, ch: 0,
               base: null, sharp: null, sharpRect: null, task: null, timer: null, seq: 0 };

  host.classList.add('apv');
  const bar = document.createElement('div');
  bar.className = 'apv-bar';
  bar.innerHTML = `
    <button type="button" data-act="prev" title="前のページ" hidden><i class="fa-solid fa-chevron-left"></i></button>
    <span class="apv-page" hidden></span>
    <button type="button" data-act="next" title="次のページ" hidden><i class="fa-solid fa-chevron-right"></i></button>
    <span class="apv-sep" hidden></span>
    <button type="button" data-act="out" title="縮小"><i class="fa-solid fa-minus"></i></button>
    <button type="button" data-act="in" title="拡大"><i class="fa-solid fa-plus"></i></button>
    <button type="button" data-act="fit" title="全体を表示"><i class="fa-solid fa-compress"></i></button>`;

  function clamp() {
    const w = st.pw * st.fit * st.zoom, h = st.ph * st.fit * st.zoom;
    st.x = w <= st.cw ? (st.cw - w) / 2 : Math.min(0, Math.max(st.cw - w, st.x));
    st.y = h <= st.ch ? (st.ch - h) / 2 : Math.min(0, Math.max(st.ch - h, st.y));
  }

  function place() {
    clamp();
    const w = st.pw * st.fit * st.zoom, h = st.ph * st.fit * st.zoom;
    if (st.base) {
      st.base.style.width = w + 'px'; st.base.style.height = h + 'px';
      st.base.style.transform = `translate(${st.x}px, ${st.y}px)`;
    }
    if (st.sharp && st.sharpRect) {
      const r = st.sharpRect;
      st.sharp.style.width  = (r.u1 - r.u0) * w + 'px';
      st.sharp.style.height = (r.v1 - r.v0) * h + 'px';
      st.sharp.style.transform = `translate(${st.x + r.u0 * w}px, ${st.y + r.v0 * h}px)`;
    }
  }

  function scheduleSharp(delay = 140) {
    clearTimeout(st.timer);
    st.timer = setTimeout(renderSharp, delay);
  }

  async function renderSharp() {
    if (st.dead || !st.page || !st.cw || !st.ch) return;
    const seq = ++st.seq;
    if (st.task) { try { st.task.cancel(); } catch (_) {} st.task = null; }
    const w = st.pw * st.fit * st.zoom, h = st.ph * st.fit * st.zoom;
    const vx0 = Math.max(0, -st.x), vy0 = Math.max(0, -st.y);
    const vx1 = Math.min(w, st.cw - st.x), vy1 = Math.min(h, st.ch - st.y);
    if (vx1 - vx0 < 1 || vy1 - vy0 < 1) return;
    let dpr = Math.min(window.devicePixelRatio || 1, 3);
    const area = (vx1 - vx0) * (vy1 - vy0);
    if (area * dpr * dpr > MAX_SHARP_PX) dpr = Math.sqrt(MAX_SHARP_PX / area);
    const c = document.createElement('canvas');
    c.className = 'apv-sharp';
    c.width  = Math.max(1, Math.round((vx1 - vx0) * dpr));
    c.height = Math.max(1, Math.round((vy1 - vy0) * dpr));
    const vp = st.page.getViewport({ scale: st.fit * st.zoom * dpr, offsetX: -vx0 * dpr, offsetY: -vy0 * dpr });
    const task = st.page.render({ canvasContext: c.getContext('2d'), viewport: vp });
    st.task = task;
    try { await task.promise; } catch (_) { return; }   /* 途中で次の描き直しが来た（取り消し） */
    if (st.dead || seq !== st.seq) return;
    st.task = null;
    if (st.sharp) st.sharp.remove();
    st.sharp = c;
    st.sharpRect = { u0: vx0 / w, v0: vy0 / h, u1: vx1 / w, v1: vy1 / h };
    host.insertBefore(c, bar);
    place();
  }

  function measure() {
    const cw = host.clientWidth, ch = host.clientHeight;
    if (!cw || !ch) return false;
    /* 枠の大きさが変わっても、見ている場所（中心）は保つ */
    const w0 = st.pw * st.fit * st.zoom, h0 = st.ph * st.fit * st.zoom;
    const u = st.cw ? (st.cw / 2 - st.x) / w0 : 0.5, v = st.ch ? (st.ch / 2 - st.y) / h0 : 0.5;
    st.cw = cw; st.ch = ch;
    st.fit = Math.min(cw / st.pw, ch / st.ph);
    const w = st.pw * st.fit * st.zoom, h = st.ph * st.fit * st.zoom;
    st.x = cw / 2 - u * w; st.y = ch / 2 - v * h;
    return true;
  }

  function zoomAt(nz, cx, cy) {
    nz = Math.max(1, Math.min(ZOOM_MAX, nz));
    if (Math.abs(nz - st.zoom) < 1e-4) return;
    cx = cx ?? st.cw / 2; cy = cy ?? st.ch / 2;
    st.x = cx - (cx - st.x) * nz / st.zoom;
    st.y = cy - (cy - st.y) * nz / st.zoom;
    st.zoom = nz;
    place(); scheduleSharp();
  }

  async function setPage(n) {
    const page = await st.doc.getPage(n);
    if (st.dead) return;
    const vp1 = page.getViewport({ scale: 1 });
    const s = Math.min(4, BASE_LONG / Math.max(vp1.width, vp1.height));
    const vp = page.getViewport({ scale: s });
    const base = document.createElement('canvas');
    base.className = 'apv-base';
    base.width = Math.round(vp.width); base.height = Math.round(vp.height);
    await page.render({ canvasContext: base.getContext('2d'), viewport: vp }).promise;
    if (st.dead) return;
    if (st.base) st.base.remove();
    if (st.sharp) { st.sharp.remove(); st.sharp = null; st.sharpRect = null; }
    st.page = page; st.pageNo = n; st.pw = vp1.width; st.ph = vp1.height;
    st.base = base; st.zoom = 1; st.cw = 0; st.ch = 0;
    host.insertBefore(base, host.firstChild);
    if (!bar.parentNode) host.appendChild(bar);
    const many = st.doc.numPages > 1;
    bar.querySelectorAll('[data-act="prev"], [data-act="next"], .apv-page, .apv-sep').forEach(el => { el.hidden = !many; });
    bar.querySelector('.apv-page').textContent = `${n} / ${st.doc.numPages}`;
    if (opts.onAspect) opts.onAspect(st.pw / st.ph);
    if (measure()) { place(); scheduleSharp(0); }
  }

  let paging = false;
  bar.addEventListener('click', async e => {
    const act = e.target.closest('button')?.dataset.act;
    if (!act) return;
    e.stopPropagation();
    if (act === 'in')  zoomAt(st.zoom * 1.4);
    if (act === 'out') zoomAt(st.zoom / 1.4);
    if (act === 'fit') zoomAt(1);
    if ((act === 'prev' || act === 'next') && !paging && st.doc) {
      const n = st.pageNo + (act === 'next' ? 1 : -1);
      if (n < 1 || n > st.doc.numPages) return;
      paging = true;
      try { await setPage(n); } catch (err) { console.error(err); } finally { paging = false; }
    }
  });
  bar.addEventListener('dblclick', e => e.stopPropagation());

  const onWheel = e => {
    if (!st.page) return;
    if (opts.wheelNeedsCtrl && opts.wheelNeedsCtrl() && !e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const r = host.getBoundingClientRect();
    /* マウスのホイールは1目盛りで約1.16倍。トラックパッドのピンチ(ctrlKey付き・細かい値)は感度を上げる */
    const f = Math.exp(-e.deltaY * (e.ctrlKey && Math.abs(e.deltaY) < 40 ? 0.01 : 0.0015));
    zoomAt(st.zoom * Math.max(0.8, Math.min(1.25, f)), e.clientX - r.left, e.clientY - r.top);
  };
  const onDbl = e => {
    const r = host.getBoundingClientRect();
    zoomAt(st.zoom > 1.01 ? 1 : 2.5, e.clientX - r.left, e.clientY - r.top);
  };

  const ptrs = new Map();
  let pinch = null;   /* { dist, zoom } */
  const onDown = e => {
    if (e.target.closest('.apv-bar') || (e.pointerType === 'mouse' && e.button !== 0)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { host.setPointerCapture(e.pointerId); } catch (_) {}
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y), zoom: st.zoom };
    }
    host.classList.add('grabbing');
    e.preventDefault();
  };
  const onMove = e => {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size >= 2 && pinch) {
      const [a, b] = [...ptrs.values()];
      const r = host.getBoundingClientRect();
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      st.x += dx / 2; st.y += dy / 2;
      if (pinch.dist > 0) zoomAt(pinch.zoom * dist / pinch.dist, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      place(); scheduleSharp();
      return;
    }
    st.x += dx; st.y += dy;
    place(); scheduleSharp();
  };
  const onUp = e => {
    if (!ptrs.delete(e.pointerId)) return;
    try { host.releasePointerCapture(e.pointerId); } catch (_) {}
    if (ptrs.size < 2) pinch = null;
    if (!ptrs.size) host.classList.remove('grabbing');
  };
  host.addEventListener('wheel', onWheel, { passive: false });
  host.addEventListener('dblclick', onDbl);
  host.addEventListener('pointerdown', onDown);
  host.addEventListener('pointermove', onMove);
  host.addEventListener('pointerup', onUp);
  host.addEventListener('pointercancel', onUp);

  const ro = new ResizeObserver(() => {
    if (st.dead || !st.page) return;
    if (host.clientWidth === st.cw && host.clientHeight === st.ch) return;
    if (measure()) { place(); scheduleSharp(); }
  });
  ro.observe(host);

  const ready = (async () => {
    const url = await wnGetViewUrl(fileId);
    if (!url) throw new Error('ファイルのURL取得に失敗しました');
    const loading = pdfjsLib.getDocument({
      url,
      cMapUrl: 'https://unpkg.com/pdfjs-dist@3.11.174/cmaps/',
      cMapPacked: true,
    });
    st.loading = loading;
    st.doc = await loading.promise;
    if (st.dead) return;
    await setPage(1);
  })();

  function dispose() {
    st.dead = true;
    clearTimeout(st.timer);
    ro.disconnect();
    if (st.task) { try { st.task.cancel(); } catch (_) {} }
    try { st.loading?.destroy(); } catch (_) {}
    host.removeEventListener('wheel', onWheel);
    host.removeEventListener('dblclick', onDbl);
    host.removeEventListener('pointerdown', onDown);
    host.removeEventListener('pointermove', onMove);
    host.removeEventListener('pointerup', onUp);
    host.removeEventListener('pointercancel', onUp);
    host.classList.remove('apv', 'grabbing');
    [st.base, st.sharp, bar].forEach(el => el && el.remove());
  }

  return { ready, dispose, state: st };
}

/* ────────────────── ライトボックス(実物大プレビュー) ────────────────── */
let lbIndex = -1;
let lbDispose = null; /* DXFビューアの後片付け(WebGLコンテキスト解放)用 */
let lbRenderToken = 0; /* 連打で次へ/前へした際、古い非同期処理が新しい描画を上書きしないためのトークン */

function initLightboxControls() {
  document.getElementById('lbCloseBtn').addEventListener('click', closeLightbox);
  document.getElementById('lbPrevBtn').addEventListener('click', () => stepLightbox(-1));
  document.getElementById('lbNextBtn').addEventListener('click', () => stepLightbox(1));
  document.getElementById('alignLightbox').addEventListener('click', e => {
    if (e.target.id === 'alignLightbox') closeLightbox();
  });
  window.addEventListener('keydown', e => {
    const lb = document.getElementById('alignLightbox');
    if (!lb.classList.contains('show')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') stepLightbox(-1);
    else if (e.key === 'ArrowRight') stepLightbox(1);
  });
}

function openLightbox(i) {
  lbIndex = i;
  document.getElementById('alignLightbox').classList.add('show');
  renderLightbox(i);
}

function closeLightbox() {
  document.getElementById('alignLightbox').classList.remove('show');
  disposeLightboxContent();
  document.getElementById('lbContentWrap').innerHTML = '';
}

function stepLightbox(dir) {
  const n = alignIds.length;
  lbIndex = (lbIndex + dir + n) % n;
  renderLightbox(lbIndex);
}

function disposeLightboxContent() {
  if (lbDispose) { try { lbDispose(); } catch (_) {} lbDispose = null; }
}

async function renderLightbox(i) {
  const myToken = ++lbRenderToken;
  disposeLightboxContent();
  const id = alignIds[i];
  const wrap = document.getElementById('lbContentWrap');
  wrap.className = 'align-lightbox-content-wrap';
  wrap.innerHTML = `<div class="align-lightbox-spin"><i class="fa-solid fa-spinner fa-spin"></i><span>読み込み中…</span></div>`;
  document.getElementById('lbCounter').textContent = `${i + 1} / ${alignIds.length}`;
  document.getElementById('lbDetailLink').href = `file-detail.html?id=${encodeURIComponent(id)}`;

  try {
    const file = alignFiles[i] ?? await (async () => {
      const res = await wnFetch(`/wn/files/${id}`);
      if (!res || !res.ok) throw new Error('ファイル情報の取得に失敗しました');
      const f = (await res.json()).data;
      if (!f) throw new Error('ファイルが見つかりません');
      alignFiles[i] = f;
      return f;
    })();
    /* この間に次へ/前へが押されていたら(=より新しいトークンが発行済み)、
       ここで中断して古い結果によるDOM上書き・二重描画(DXFのWebGLコンテキストリーク等)を防ぐ */
    if (myToken !== lbRenderToken) return;

    document.getElementById('lbTitle').textContent = file.file_name;
    document.getElementById('lbTitle').title = file.file_name;

    await renderLightboxContent(file, wrap);
    if (myToken !== lbRenderToken) { disposeLightboxContent(); return; }
  } catch (err) {
    if (myToken !== lbRenderToken) return;
    console.error(err);
    wrap.innerHTML = `
      <div class="align-lightbox-error">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>${h(err.message || '読み込みに失敗しました')}</span>
      </div>`;
  }
}

async function renderLightboxContent(file, wrap) {
  const ext = extOf(file);
  wrap.innerHTML = '';
  /* ページバッジはwrapの外(.align-lightbox-body)に置くため個別に掃除する */
  wrap.parentElement.querySelectorAll('.align-lightbox-page-badge').forEach(b => b.remove());

  if (ext === 'pdf') {
    if (typeof pdfjsLib === 'undefined') throw new Error('PDF表示ライブラリの読み込みに失敗しました');
    /* カードと同じ表示（拡大しても描き直すのでぼやけない・ページ送りつき） */
    const box = document.createElement('div');
    box.className = 'align-live-fill';
    wrap.appendChild(box);
    const view = alignPdfView(box, file.id);
    lbDispose = view.dispose;
    await view.ready;

  } else if (ALIGN_3D_EXTS.includes(ext)) {
    const box = document.createElement('div');
    box.className = 'align-live-fill';
    wrap.appendChild(box);
    const view = alignModelView(box, file, ext);
    lbDispose = view.dispose;
    await view.ready;

  } else if (ALIGN_IMG_EXTS.includes(ext)) {
    const buf = await wnFetchFileBuffer(file.id);
    if (!buf) throw new Error('画像の取得に失敗しました');
    const blobUrl = URL.createObjectURL(new Blob([buf]));
    const img = document.createElement('img');
    img.className = 'align-content';
    img.alt = '';
    await new Promise((resolve, reject) => {
      img.onload  = resolve;
      img.onerror = () => reject(new Error('画像の表示に失敗しました'));
      img.src = blobUrl;
    });
    wrap.appendChild(img);
    initAlignZoomPan(wrap, img);

  } else if (ext === 'dxf') {
    if (typeof wnRenderDxf !== 'function' || typeof THREE === 'undefined') {
      throw new Error('DXF表示ライブラリの読み込みに失敗しました');
    }
    const text = await fetchDxfText(file.id);
    if (!text) throw new Error('DXFの取得に失敗しました');
    const dxfWrap = document.createElement('div');
    dxfWrap.className = 'align-dxf-wrap';
    wrap.appendChild(dxfWrap);
    /* wnRenderDxf は内部で独自にホイールズーム/ドラッグパンを備えている */
    const handle = wnRenderDxf(dxfWrap, text);
    lbDispose = handle?.dispose ?? null;

  } else {
    /* Office文書・その他: サムネイル（無ければ生成）にフォールバック */
    const thumbUrl = await wnThumbResolve(file);
    const img = document.createElement('img');
    img.className = 'align-content';
    img.alt = '';
    const ok = thumbUrl ? await new Promise(resolve => {
      img.onload  = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = thumbUrl;
    }) : false;
    if (!ok) {
      const { icon, cls } = (typeof wnFileIcon === 'function')
        ? wnFileIcon(file.file_name, file.mime_type) : { icon: 'fa-file', cls: '' };
      wrap.innerHTML = `
        <div class="align-lightbox-noPreview">
          <i class="fa-solid ${icon} ${cls}"></i>
          <span>プレビュー非対応の形式です。「詳細を開く」から本体を確認してください</span>
        </div>`;
      return;
    }
    wrap.appendChild(img);
    initAlignZoomPan(wrap, img);
  }
}

async function fetchDxfText(fileId) {
  const token = sessionStorage.getItem('space_token');
  const url = WN_API_BASE + `/wn/files/${fileId}/public-view` + (token ? `?token=${encodeURIComponent(token)}` : '');
  try {
    const res = await fetch(url);
    if (!res.ok) return null;
    return await res.text();
  } catch { return null; }
}

/* ── ライトボックス内のズーム・パン ──
   Ctrl/Cmd+ホイールまたはピンチで拡大、1本指ドラッグでパン、ダブルクリックでトグル。 */
function initAlignZoomPan(wrap, el) {
  let zoom = 1;
  let baseW = 0;
  const ZOOM_MIN = 1, ZOOM_MAX = 6;

  requestAnimationFrame(() => {
    el.style.maxWidth = '100%';
    baseW = el.getBoundingClientRect().width || el.width || 0;
  });

  function apply() {
    if (!baseW) return;
    if (zoom <= 1) { el.style.width = ''; el.style.maxWidth = '100%'; }
    else { el.style.width = Math.round(baseW * zoom) + 'px'; el.style.maxWidth = 'none'; }
    wrap.classList.toggle('zoomed', zoom > 1);
  }

  function setZoom(nz, cx, cy) {
    nz = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, nz));
    if (Math.abs(nz - zoom) < 0.005) return;
    const px = cx ?? wrap.clientWidth  / 2;
    const py = cy ?? wrap.clientHeight / 2;
    const fx = (wrap.scrollLeft + px) / Math.max(1, wrap.scrollWidth);
    const fy = (wrap.scrollTop  + py) / Math.max(1, wrap.scrollHeight);
    zoom = nz;
    apply();
    wrap.scrollLeft = fx * wrap.scrollWidth  - px;
    wrap.scrollTop  = fy * wrap.scrollHeight - py;
  }

  wrap.addEventListener('wheel', e => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    setZoom(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  wrap.addEventListener('dblclick', e => {
    const r = wrap.getBoundingClientRect();
    setZoom(zoom > 1 ? 1 : 2, e.clientX - r.left, e.clientY - r.top);
  });

  wrap.classList.add('align-pannable');
  const ptrs = new Map();
  let panning = false, panPtrId = null, startX = 0, startY = 0, startL = 0, startT = 0;
  let pinching = false, pinchStartDist = 0, pinchStartZoom = 1;

  wrap.addEventListener('pointerdown', e => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (ptrs.size >= 2) {
      if (panning) {
        panning = false;
        try { wrap.releasePointerCapture(panPtrId); } catch (_) {}
        panPtrId = null;
        wrap.style.cursor = '';
      }
      if (ptrs.size === 2) {
        pinching = true;
        const [a, b] = [...ptrs.values()];
        pinchStartDist = Math.hypot(a.x - b.x, a.y - b.y);
        pinchStartZoom = zoom;
      }
      return;
    }

    if (e.button !== 0) return;
    const pannable = wrap.scrollWidth > wrap.clientWidth || wrap.scrollHeight > wrap.clientHeight;
    if (!pannable) return;
    e.preventDefault();
    panning  = true;
    panPtrId = e.pointerId;
    startX = e.clientX; startY = e.clientY;
    startL = wrap.scrollLeft; startT = wrap.scrollTop;
    wrap.setPointerCapture(e.pointerId);
    wrap.style.cursor = 'grabbing';
  });

  wrap.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pinching && ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchStartDist > 0) setZoom(pinchStartZoom * (dist / pinchStartDist));
      return;
    }

    if (!panning) return;
    wrap.scrollLeft = startL - (e.clientX - startX);
    wrap.scrollTop  = startT - (e.clientY - startY);
  });

  const endPan = e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinching = false;
    if (!panning || e.pointerId !== panPtrId) return;
    panning  = false;
    panPtrId = null;
    try { wrap.releasePointerCapture(e.pointerId); } catch (_) {}
    wrap.style.cursor = '';
  };
  wrap.addEventListener('pointerup', endPan);
  wrap.addEventListener('pointercancel', endPan);
}

function showAlignFatal(msg) {
  const body = document.getElementById('alignBody');
  if (!body) return;
  body.innerHTML = `
    <div class="align-error">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <p style="font-size:14px;max-width:80%;text-align:center;">${h(msg)}</p>
      <a href="dashboard.html" class="btn btn-outline btn-sm">一覧に戻る</a>
    </div>`;
}

function h(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
