<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A5F">
  <title>マニュアル — What'sNo</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/wn-app.css?v=20260725a">
  <style>
    .m-wrap { max-width: 1080px; margin: 0 auto; padding: 16px 16px calc(28px + env(safe-area-inset-bottom)); }
    .m-head { display: flex; align-items: center; gap: 12px; padding: 8px 0 18px; }
    .m-back { width: 38px; height: 38px; flex: none; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; color: var(--primary); text-decoration: none; font-size: 17px; transition: background .15s; }
    .m-back:hover { background: var(--bg); }
    .m-title { font-size: 20px; font-weight: 800; color: var(--primary); line-height: 1.2; }
    .m-sub   { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .m-new-btn { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px;
      border: none; border-radius: var(--radius); background: var(--accent); color: #fff; font-size: 14px;
      font-weight: 700; cursor: pointer; font-family: inherit; transition: background .15s; white-space: nowrap; }
    .m-new-btn:hover { background: var(--accent-dk); }

    .m-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .m-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
      overflow: hidden; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; cursor: pointer;
      transition: box-shadow .15s, transform .15s; text-decoration: none; }
    .m-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .m-cover { aspect-ratio: 4 / 3; position: relative; display: grid; place-items: center; overflow: hidden;
      background: linear-gradient(135deg, #1a3a5c, #0a2540); color: #fff; font-size: 34px; }
    .m-cover img { width: 100%; height: 100%; object-fit: cover; }
    .m-badge { position: absolute; top: 8px; left: 8px; font-size: 10.5px; font-weight: 700; padding: 3px 9px;
      border-radius: 100px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
    .m-badge.draft { background: rgba(105,115,134,.55); backdrop-filter: blur(3px); }
    .m-badge.pub   { background: rgba(26,156,107,.6); backdrop-filter: blur(3px); }
    .m-steps { position: absolute; bottom: 8px; right: 8px; font-size: 10.5px; font-weight: 600; padding: 3px 9px;
      border-radius: 100px; background: rgba(10,37,64,.45); backdrop-filter: blur(3px); color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,.5); }
    .m-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .m-name { font-size: 14.5px; font-weight: 700; color: var(--primary); line-height: 1.4; }
    .m-meta { font-size: 12px; color: var(--muted); margin-top: auto; display: flex; align-items: center; gap: 8px; }
    .m-edit { color: var(--muted); font-size: 13px; padding: 2px 6px; border-radius: 6px; margin-left: auto; }
    .m-edit:hover { color: var(--accent); background: var(--bg); }

    .m-card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .m-card-tags .tag { font-size: 10.5px; padding: 2px 8px; cursor: default; }

    .m-empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .m-empty .ei { font-size: 44px; color: var(--border); }
    .m-empty .et { font-size: 15px; font-weight: 700; color: var(--primary); margin-top: 14px; }
    .m-empty .es { font-size: 13px; margin-top: 6px; }
    .m-empty .eb { margin-top: 16px; background: none; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 8px 16px; font-size: 13px; font-family: inherit; color: var(--primary); cursor: pointer; }
    .m-empty .eb:hover { border-color: var(--accent); color: var(--accent); }

    /* ツールバー（検索・状態・並び替え・タグ） */
    .m-tools { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .m-search { position: relative; display: flex; align-items: center; }
    .m-search > i { position: absolute; left: 14px; color: var(--muted); font-size: 14px; pointer-events: none; }
    .m-search input { width: 100%; padding: 11px 38px 11px 38px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 14px; font-family: inherit; box-sizing: border-box; background: var(--bg-card); }
    .m-search input:focus { outline: none; border-color: var(--accent); }
    .m-search-clear { position: absolute; right: 8px; background: none; border: none; color: var(--muted);
      font-size: 14px; cursor: pointer; padding: 6px 8px; display: none; }
    .m-search-clear:hover { color: var(--primary); }

    .m-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .m-chips { display: flex; gap: 6px; }
    .m-chip { padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-card);
      font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; font-family: inherit;
      transition: background .15s, color .15s, border-color .15s; white-space: nowrap; }
    .m-chip:hover { color: var(--primary); }
    .m-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .m-sort { margin-left: auto; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg-card); font-size: 12.5px; font-family: inherit; color: var(--primary); cursor: pointer; }
    .m-sort:focus { outline: none; border-color: var(--accent); }
    .m-count { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .m-tagrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .m-tagrow > .lbl { font-size: 12px; font-weight: 700; color: var(--primary); flex: none; }
    .m-and { font-size: 10.5px; font-weight: 700; color: var(--accent); background: rgba(99,91,255,.1);
      border-radius: 20px; padding: 2px 9px; white-space: nowrap; }
    .m-tag-clear { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 2px 9px;
      font-size: 11.5px; color: var(--muted); cursor: pointer; font-family: inherit; white-space: nowrap; }
    .m-tag-clear:hover { border-color: var(--accent); color: var(--accent); }

    .m-more { text-align: center; padding: 20px; color: var(--muted); font-size: 13px; }

    @media (max-width: 560px) {
      .m-head { padding-bottom: 12px; }
      .m-new-btn { padding: 9px 12px; font-size: 13px; }
      .m-sort { margin-left: 0; width: 100%; }
      .m-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    }

    /* 新規作成モーダル */
    .m-overlay { position: fixed; inset: 0; background: rgba(10,37,64,.5); display: none; align-items: center;
      justify-content: center; z-index: 100; padding: 20px; }
    .m-overlay.show { display: flex; }
    .m-modal { background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 420px; padding: 22px;
      box-shadow: var(--shadow-md); }
    .m-modal h3 { margin: 0 0 4px; font-size: 17px; font-weight: 800; color: var(--primary); }
    .m-modal p  { margin: 0 0 16px; font-size: 12.5px; color: var(--muted); }
    .m-label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
    .m-input { width: 100%; margin-top: 6px; padding: 11px 13px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 14px; font-family: inherit; box-sizing: border-box; }
    .m-input:focus { outline: none; border-color: var(--accent); }
    .m-modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .m-modal-actions button { flex: 1; padding: 12px; border-radius: var(--radius); font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit; border: 1px solid var(--border); }
    .m-cancel { background: #fff; color: var(--primary); }
    .m-cancel:hover { border-color: var(--accent); color: var(--accent); }
    .m-create { background: var(--accent); color: #fff; border-color: var(--accent) !important; }
    .m-create:hover { background: var(--accent-dk); }
    .m-create:disabled { opacity: .5; cursor: not-allowed; }

    /* ── C案「親指ファースト」──
       主要動作（作りはじめる）は画面幅にかかわらず常に画面下端に固定する。
       編集画面の追加バーと同じ位置なので、探す→作るで手の位置が変わらない。 */
    .m-wrap { padding-bottom: calc(104px + env(safe-area-inset-bottom)); }
    .m-bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      background: var(--bg-card); border-top: 1px solid var(--border);
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      box-shadow: 0 -2px 12px rgba(10,37,64,.06); }
    .m-bb-inner { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
    .m-bb-btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 54px;
      padding: 0 22px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card);
      color: var(--primary); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
      white-space: nowrap; }
    .m-bb-btn:hover { border-color: var(--accent); color: var(--accent); }
    .m-bb-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .m-bb-btn.primary:hover { background: var(--accent-dk); color: #fff; }
    .m-bb-hint { font-size: 12px; color: var(--muted); margin-left: auto; }

    /* 写真で思い出せるよう、表紙を大きめに取る */
    .m-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }

    @media (max-width: 560px) {
      .m-grid { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); }
      .m-bb-btn { flex: 1; padding: 0 10px; font-size: 13.5px; }
      .m-bb-hint { display: none; }
    }
  </style>
</head>
<body>
<div class="m-wrap">
  <div class="m-head">
    <a href="dashboard.html" class="m-back" aria-label="戻る"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
      <div class="m-title">マニュアル</div>
      <div class="m-sub">工場の作業手順・保守点検・安全手順をまとめて共有</div>
    </div>
  </div>

  <!-- 検索・絞り込み・並べ替え -->
  <div class="m-tools">
    <div class="m-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" autocomplete="off"
             placeholder="マニュアル名・手順の中身で検索…">
      <button class="m-search-clear" id="searchClear" title="クリア" aria-label="検索をクリア">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="m-row">
      <div class="m-chips" id="statusChips">
        <button class="m-chip active" data-status="">すべて</button>
        <button class="m-chip" data-status="published">公開中</button>
        <button class="m-chip" data-status="draft">下書き</button>
      </div>
      <span class="m-count" id="countLabel"></span>
      <select class="m-sort" id="sortSelect">
        <option value="recent">最近見た順</option>
        <option value="popular">よく見る順</option>
        <option value="newest">更新が新しい順</option>
        <option value="oldest">更新が古い順</option>
        <option value="name">タイトル順</option>
      </select>
    </div>

    <div class="m-tagrow" id="tagRow" style="display:none;">
      <span class="lbl"><i class="fa-solid fa-tag"></i> タグ</span>
      <div class="tag-list" id="tagList"></div>
      <span class="m-and" id="tagAndBadge" style="display:none;">AND</span>
      <button class="m-tag-clear" id="tagClearBtn" style="display:none;">
        <i class="fa-solid fa-xmark"></i> 全解除
      </button>
    </div>
  </div>

  <div id="listArea"></div>
  <div id="scrollSentinel" style="height:1px;"></div>
</div>

<!-- 主要動作は常に画面下端（C案） -->
<div class="m-bottombar">
  <div class="m-bb-inner">
    <button class="m-bb-btn primary" id="newBtn"><i class="fa-solid fa-plus"></i> 新しいマニュアル</button>
    <button class="m-bb-btn" id="fromPhotosBtn"><i class="fa-solid fa-image"></i> 写真から作る</button>
    <span class="m-bb-hint">写真を選ぶと、1枚が1手順になった下書きができます</span>
  </div>
</div>
<input type="file" id="photoInput" accept="image/*" multiple style="display:none;">

<!-- 新規作成モーダル -->
<div class="m-overlay" id="newModal">
  <div class="m-modal">
    <h3>新規マニュアル</h3>
    <p id="modalHint">タイトルを入力すると編集画面が開きます</p>
    <label class="m-label" for="newTitle">タイトル</label>
    <input class="m-input" id="newTitle" type="text" placeholder="例: 集塵機フィルター交換手順" maxlength="200" autocomplete="off">
    <div class="m-modal-actions">
      <button class="m-cancel" id="cancelBtn">キャンセル</button>
      <button class="m-create" id="createBtn">作成して編集</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="../../solid/assets/js/auth.js?v=7"></script>
<script src="../assets/js/wn-api.js?v=27"></script>
<script>
'use strict';
/* マニュアル一覧画面 */
const user = requireSpaceAuth();
if (!user) throw new Error('未認証');
if (!wnRequireExtendedOptions()) throw new Error('拡張オプション未契約');

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

/* ── 一覧の状態（URLクエリと同期させる） ── */
const state = {
  search: '', tags: [], status: '', sort: 'recent',
  page: 1, lastPage: 1, total: 0, loading: false, items: [],
};
let allTags = [];

function readStateFromUrl() {
  const p = new URLSearchParams(location.search);
  state.search = p.get('q') || '';
  state.tags   = (p.get('tag') || '').split(',').map(Number).filter(Boolean);
  state.status = ['draft', 'published'].includes(p.get('status')) ? p.get('status') : '';
  state.sort   = ['recent', 'popular', 'newest', 'oldest', 'name'].includes(p.get('sort'))
    ? p.get('sort') : 'recent';
}

function writeStateToUrl() {
  const p = new URLSearchParams();
  if (state.search)      p.set('q', state.search);
  if (state.tags.length) p.set('tag', state.tags.join(','));
  if (state.status)      p.set('status', state.status);
  if (state.sort !== 'recent') p.set('sort', state.sort);
  const qs = p.toString();
  history.replaceState(null, '', qs ? `?${qs}` : location.pathname);
}

function hasFilter() {
  return !!(state.search || state.tags.length || state.status);
}

function coverHtml(m) {
  const badge = m.status === 'published'
    ? '<span class="m-badge pub">公開中</span>'
    : '<span class="m-badge draft">下書き</span>';
  const steps = `<span class="m-steps">${m.step_count}ステップ</span>`;
  let inner = '<i class="fa-solid fa-book"></i>';
  if (m.cover && m.cover.id) {
    inner = `<img src="${wnThumbUrl(m.cover.id, m.cover.updated_at)}" alt="" loading="lazy"
      onerror="this.outerHTML='<i class=&quot;fa-solid fa-book&quot;></i>'">`;
  }
  return `<div class="m-cover">${inner}${badge}${steps}</div>`;
}

/* カード内のタグは2件まで。残りは +N に畳む */
function cardTagsHtml(m) {
  const tags = m.tags || [];
  if (!tags.length) return '';
  const shown = tags.slice(0, 2).map(t => `<span class="tag">${escapeHtml(t.name)}</span>`).join('');
  const rest  = tags.length > 2 ? `<span class="tag">+${tags.length - 2}</span>` : '';
  return `<div class="m-card-tags">${shown}${rest}</div>`;
}

function cardHtml(m) {
  return `
    <a class="m-card" href="manual-view.html?id=${m.id}">
      ${coverHtml(m)}
      <div class="m-body">
        <div class="m-name">${escapeHtml(m.title)}</div>
        ${cardTagsHtml(m)}
        <div class="m-meta">
          <span>${wnFormatDate(m.updated_at)}</span>
          <span class="m-edit" title="編集"
            onclick="event.preventDefault();event.stopPropagation();location.href='manual-edit.html?id=${m.id}'">
            <i class="fa-solid fa-pen"></i> 編集
          </span>
        </div>
      </div>
    </a>`;
}

function emptyHtml() {
  if (hasFilter()) {
    return `
      <div class="m-empty">
        <div class="ei"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="et">条件に合うマニュアルがありません</div>
        <div class="es">キーワードやタグを変えて試してください</div>
        <button class="eb" id="clearAllBtn"><i class="fa-solid fa-rotate-left"></i> 絞り込みを解除</button>
      </div>`;
  }
  return `
    <div class="m-empty">
      <div class="ei"><i class="fa-solid fa-book-open"></i></div>
      <div class="et">まだマニュアルがありません</div>
      <div class="es">「新規マニュアル」から、スマホで撮った写真を並べるだけで作れます</div>
    </div>`;
}

function renderManuals() {
  const area = document.getElementById('listArea');
  if (!state.items.length) {
    area.innerHTML = emptyHtml();
    const clearBtn = document.getElementById('clearAllBtn');
    if (clearBtn) clearBtn.addEventListener('click', clearAllFilters);
    return;
  }
  area.innerHTML = `<div class="m-grid">${state.items.map(cardHtml).join('')}</div>`;
}

function renderCount() {
  const el = document.getElementById('countLabel');
  el.textContent = state.total ? `${state.total}件` : '';
}

/* ── タグ絞り込みバー ── */
function renderTagFilter() {
  const row  = document.getElementById('tagRow');
  const list = document.getElementById('tagList');
  // マニュアルに1件も付いていないタグは候補に出さない（ファイル用タグが混ざるため）
  if (!allTags.length) { row.style.display = 'none'; return; }
  row.style.display = 'flex';

  list.innerHTML = allTags.map(t => `
    <span class="tag ${state.tags.includes(t.id) ? 'active' : ''}" data-tag-id="${t.id}">
      ${escapeHtml(t.name)}
    </span>`).join('');

  list.querySelectorAll('[data-tag-id]').forEach(el => {
    el.addEventListener('click', () => toggleTag(Number(el.dataset.tagId)));
  });

  document.getElementById('tagAndBadge').style.display = state.tags.length > 1 ? '' : 'none';
  document.getElementById('tagClearBtn').style.display = state.tags.length ? '' : 'none';
}

function toggleTag(id) {
  state.tags = state.tags.includes(id) ? state.tags.filter(t => t !== id) : [...state.tags, id];
  renderTagFilter();
  reload();
}

function clearAllFilters() {
  state.search = '';
  state.tags   = [];
  state.status = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').style.display = 'none';
  document.querySelectorAll('#statusChips .m-chip').forEach(c =>
    c.classList.toggle('active', c.dataset.status === ''));
  renderTagFilter();
  reload();
}

/* ── 読み込み ── */
function buildParams() {
  return {
    search:   state.search,
    tag:      state.tags.join(','),
    status:   state.status,
    sort:     state.sort,
    page:     state.page,
    per_page: 24,
  };
}

/* 先頭ページから読み直す */
async function reload() {
  writeStateToUrl();
  state.page = 1;
  state.loading = true;

  const { data, meta, error } = await wnGetManuals(buildParams());
  state.loading = false;

  if (error) {
    if (error !== 'auth') wnShowToast('一覧を取得できませんでした', 'danger');
    return;
  }
  state.items    = data;
  state.total    = meta?.total ?? data.length;
  state.lastPage = meta?.last_page ?? 1;
  renderManuals();
  renderCount();
}

/* 次ページを追記（無限スクロール） */
async function loadMore() {
  if (state.loading || state.page >= state.lastPage) return;
  state.loading = true;
  state.page   += 1;

  const { data, meta, error } = await wnGetManuals(buildParams());
  state.loading = false;
  if (error) { state.page -= 1; return; }

  state.items    = state.items.concat(data);
  state.lastPage = meta?.last_page ?? state.lastPage;
  renderManuals();
}

async function loadTags() {
  allTags = await wnGetManualTags(true);   // 実際に使われているタグのみ
  renderTagFilter();
}

/* ── 操作のひもづけ ── */
function initTools() {
  const input = document.getElementById('searchInput');
  const clear = document.getElementById('searchClear');
  input.value = state.search;
  clear.style.display = state.search ? 'block' : 'none';

  let timer;
  input.addEventListener('input', () => {
    clear.style.display = input.value ? 'block' : 'none';
    clearTimeout(timer);
    timer = setTimeout(() => { state.search = input.value.trim(); reload(); }, 400);
  });
  clear.addEventListener('click', () => {
    input.value = ''; clear.style.display = 'none';
    state.search = ''; reload(); input.focus();
  });

  document.querySelectorAll('#statusChips .m-chip').forEach(chip => {
    chip.classList.toggle('active', chip.dataset.status === state.status);
    chip.addEventListener('click', () => {
      state.status = chip.dataset.status;
      document.querySelectorAll('#statusChips .m-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      reload();
    });
  });

  const sortSel = document.getElementById('sortSelect');
  sortSel.value = state.sort;
  sortSel.addEventListener('change', () => { state.sort = sortSel.value; reload(); });

  document.getElementById('tagClearBtn').addEventListener('click', () => {
    state.tags = []; renderTagFilter(); reload();
  });

  // 末尾が見えたら次ページを読む
  new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) loadMore();
  }, { rootMargin: '600px' }).observe(document.getElementById('scrollSentinel'));
}

/* 新規作成モーダル */
const modal = document.getElementById('newModal');
const titleInput = document.getElementById('newTitle');

/* 「写真から作る」で選んだファイル。作成後に1枚=1手順として積む */
let pendingPhotos = [];

function openModal(hint) {
  modal.classList.add('show');
  titleInput.value = '';
  document.getElementById('modalHint').textContent = hint || 'タイトルを入力すると編集画面が開きます';
  setTimeout(() => titleInput.focus(), 50);
}
function closeModal() {
  modal.classList.remove('show');
  pendingPhotos = [];
}

async function createManual() {
  const title = titleInput.value.trim();
  if (!title) { titleInput.focus(); return; }
  const btn = document.getElementById('createBtn');
  btn.disabled = true; btn.textContent = '作成中…';
  try {
    const m = await wnCreateManual(title);
    /* 選んだ写真をそのまま手順にする。1枚失敗しても残りは続ける */
    for (let i = 0; i < pendingPhotos.length; i++) {
      const f = pendingPhotos[i];
      btn.textContent = `写真を追加中… ${i + 1}/${pendingPhotos.length}`;
      try {
        const up = await wnUploadFile(f);
        const fileId = up?.data?.id;
        if (!fileId) throw new Error('アップロードに失敗しました');
        await wnAddManualStep(m.id, { type: 'photo', fileId, caption: '' });
      } catch (err) {
        wnShowToast(`${f.name} を手順にできませんでした`, 'warning');
      }
    }
    pendingPhotos = [];
    location.href = `manual-edit.html?id=${m.id}`;
  } catch (e) {
    wnShowToast(e.message || '作成に失敗しました', 'danger');
    btn.disabled = false; btn.textContent = '作成して編集';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('newBtn').addEventListener('click', () => openModal());
  document.getElementById('fromPhotosBtn').addEventListener('click',
    () => document.getElementById('photoInput').click());
  document.getElementById('photoInput').addEventListener('change', function () {
    pendingPhotos = Array.from(this.files).filter(f => f && f.size > 0);
    this.value = '';
    if (!pendingPhotos.length) return;
    openModal(`${pendingPhotos.length}枚の写真を、1枚=1手順の下書きにします`);
  });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('createBtn').addEventListener('click', createManual);
  titleInput.addEventListener('keydown', e => { if (e.key === 'Enter') createManual(); });
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  readStateFromUrl();
  initTools();
  reload();
  loadTags();
});
</script>
</body>
