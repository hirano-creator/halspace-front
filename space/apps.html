<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a8a">
  <title>アプリ選択 | Space by HaLSpace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/space.css?v=20260919a">
</head>
<body class="apps-page">

  <!-- ヘッダー -->
  <header class="apps-header">
    <span class="apps-header-logo">Space.app</span>
    <div class="apps-header-user">
      <div class="user-info">
        <span class="user-name" id="headerUserName">読み込み中...</span>
        <span class="user-company" id="headerCompany"></span>
      </div>
      <a class="btn-admin" id="adminLink" href="admin.html" style="display:none;">
        <i class="fa-solid fa-shield-halved"></i>
        管理者設定
      </a>
      <!-- 全ロール共通。管理画面（super_admin専用のシステム設定）に頼らず自分のパスワードを変えられるようにする -->
      <button class="btn-logout" id="pwChangeBtn" title="パスワード変更">
        <i class="fa-solid fa-key"></i>
        パスワード変更
      </button>
      <button class="btn-logout" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i>
        ログアウト
      </button>
    </div>
  </header>

  <!-- 今月のおすすめ（ヒーロー） -->
  <section class="hero" id="hero">
    <div class="hero-inner">
      <div class="hero-text">
        <p class="hero-greeting" id="welcomeMsg">おかえりなさい</p>
        <span class="hero-eyebrow" id="heroEyebrow"></span>
        <h1 class="hero-title" id="heroTitle"></h1>
        <p class="hero-desc" id="heroDesc"></p>
        <div class="hero-actions" id="heroActions"></div>
      </div>
      <div class="hero-visual">
        <img id="heroImage" src="" alt="">
      </div>
    </div>
  </section>

  <!-- メイン -->
  <main class="apps-body">
    <div class="apps-section-header">
      <div class="apps-section-label">利用中のアプリ</div>
      <a class="apps-all-link" href="all-apps.html">ALL APPS <i class="fa-solid fa-arrow-right"></i></a>
    </div>
    <div class="apps-scroll-wrap">
      <button class="apps-arrow apps-arrow-left" id="arrowLeft" aria-label="前へ">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <div class="apps-grid" id="appsGrid">
        <!-- JSで描画 -->
      </div>
      <button class="apps-arrow apps-arrow-right" id="arrowRight" aria-label="次へ">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <!-- 提携企業からのお知らせ（協賛バナー枠） -->
    <section class="sponsor-section">
      <div class="apps-section-header">
        <div>
          <div class="sponsor-eyebrow">SPONSORED</div>
          <h2 class="sponsor-title">提携企業からのお知らせ</h2>
          <p class="sponsor-sub">おすすめの取引先・サービス</p>
        </div>
        <a class="apps-all-link" href="#" id="sponsorMoreLink">MORE <i class="fa-solid fa-arrow-right"></i></a>
      </div>
      <div class="sponsor-grid" id="sponsorGrid">
        <!-- JSで描画 -->
      </div>
    </section>

    <!-- Space.app ストア -->
    <section class="store-section">
      <div class="apps-section-header">
        <div>
          <div class="store-eyebrow">SPACE.APP STORE</div>
          <h2 class="store-title">これから追加できるアプリ</h2>
          <p class="store-sub">気になるアプリはお申し込み・先行受付にご登録いただけます</p>
        </div>
        <a class="apps-all-link store-link" href="#" id="storeMoreLink">すべて見る <i class="fa-solid fa-arrow-right"></i></a>
      </div>
      <div class="store-grid" id="storeGrid">
        <!-- JSで描画 -->
      </div>
    </section>
  </main>

  <!-- パスワード変更モーダル -->
  <div class="pw-modal-overlay hidden" id="pwModal" role="dialog" aria-modal="true" aria-labelledby="pwModalTitle">
    <form class="pw-modal" id="pwForm" autocomplete="off" novalidate>
      <div class="pw-modal-header">
        <span class="pw-modal-title" id="pwModalTitle"><i class="fa-solid fa-key"></i> パスワード変更</span>
        <button type="button" class="pw-modal-close" id="pwModalClose" aria-label="閉じる"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="pw-modal-body">
        <p class="pw-modal-desc">現在のパスワードを確認のうえ、新しいパスワード（8文字以上）を設定します。</p>
        <div class="pw-field">
          <label class="pw-label" for="pwCurrent">現在のパスワード</label>
          <div class="pw-input-wrap">
            <input type="password" class="pw-input" id="pwCurrent" autocomplete="current-password" placeholder="現在のパスワード">
            <button type="button" class="pw-input-eye" data-target="pwCurrent" tabindex="-1" aria-label="パスワードを表示"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <div class="pw-field">
          <label class="pw-label" for="pwNew">新しいパスワード</label>
          <div class="pw-input-wrap">
            <input type="password" class="pw-input" id="pwNew" autocomplete="new-password" placeholder="8文字以上">
            <button type="button" class="pw-input-eye" data-target="pwNew" tabindex="-1" aria-label="パスワードを表示"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <div class="pw-field">
          <label class="pw-label" for="pwConfirm">新しいパスワード（確認）</label>
          <div class="pw-input-wrap">
            <input type="password" class="pw-input" id="pwConfirm" autocomplete="new-password" placeholder="もう一度入力">
            <button type="button" class="pw-input-eye" data-target="pwConfirm" tabindex="-1" aria-label="パスワードを表示"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <div class="pw-error" id="pwError" role="alert"></div>
        <div class="pw-success" id="pwSuccess" role="status"></div>
      </div>
      <div class="pw-modal-footer">
        <button type="button" class="pw-btn pw-btn-sub" id="pwModalCancel">キャンセル</button>
        <button type="submit" class="pw-btn pw-btn-main" id="pwSaveBtn"><i class="fa-solid fa-check"></i> パスワードを変更</button>
      </div>
    </form>
  </div>

  <script src="assets/js/space.js?v=20260919a"></script>
</body>
</html>
