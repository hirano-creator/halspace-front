<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b21b6"/><stop offset="55%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="26%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <rect width="960" height="600" fill="url(#grid)"/>
  <rect width="960" height="600" fill="url(#glow)"/>

  <!-- 重なったファイルカード -->
  <g transform="translate(480,300)">
    <g transform="translate(-18,-96) rotate(-7)" opacity=".38">
      <rect x="-140" y="-96" width="280" height="192" rx="16" fill="#fff" fill-opacity=".22" stroke="#fff" stroke-opacity=".4" stroke-width="3"/>
    </g>
    <g transform="translate(14,-40) rotate(4)" opacity=".55">
      <rect x="-150" y="-100" width="300" height="200" rx="16" fill="#fff" fill-opacity=".26" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>
    </g>
    <!-- 前面のカード（図面のプレビュー風） -->
    <g transform="translate(-6,44)">
      <rect x="-166" y="-108" width="332" height="216" rx="18" fill="#fff" fill-opacity=".95"/>
      <g stroke="#7c3aed" stroke-opacity=".55" fill="none" stroke-linecap="round">
        <rect x="-126" y="-72" width="130" height="98" rx="6" stroke-width="4"/>
        <circle cx="-61" cy="-23" r="26" stroke-width="4"/>
        <circle cx="-61" cy="-23" r="8" stroke-width="4"/>
        <g stroke-width="3" stroke-dasharray="7 6" stroke-opacity=".45">
          <line x1="-126" y1="42" x2="4" y2="42"/>
        </g>
      </g>
      <g fill="#7c3aed" fill-opacity=".22">
        <rect x="26" y="-72" width="120" height="14" rx="7"/>
        <rect x="26" y="-42" width="96"  height="14" rx="7"/>
        <rect x="26" y="-12" width="120" height="14" rx="7"/>
        <rect x="26" y="18"  width="72"  height="14" rx="7"/>
      </g>
      <g fill="#7c3aed" fill-opacity=".5">
        <rect x="26" y="52" width="52" height="24" rx="12"/>
      </g>
    </g>
  </g>

  <!-- 浮遊するファイルタイプのチップ -->
  <g opacity=".5" fill="#fff">
    <g transform="translate(170,120)"><rect x="-38" y="-20" width="76" height="40" rx="12" fill-opacity=".26" stroke="#fff" stroke-opacity=".4" stroke-width="2"/></g>
    <g transform="translate(806,168)"><rect x="-42" y="-20" width="84" height="40" rx="12" fill-opacity=".26" stroke="#fff" stroke-opacity=".4" stroke-width="2"/></g>
    <g transform="translate(150,470)"><rect x="-44" y="-20" width="88" height="40" rx="12" fill-opacity=".26" stroke="#fff" stroke-opacity=".4" stroke-width="2"/></g>
    <g transform="translate(820,452)"><rect x="-36" y="-20" width="72" height="40" rx="12" fill-opacity=".26" stroke="#fff" stroke-opacity=".4" stroke-width="2"/></g>
  </g>
</svg>