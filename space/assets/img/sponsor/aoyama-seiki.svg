<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="アオヤマ精機 写真と寸法だけで、治具になる。">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#075985"/><stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity=".42"/>
      <stop offset="62%" stop-color="#000" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    
  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="1"/>
  </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#g)"/>
  <g transform="translate(950,200)" opacity=".55" fill="none" stroke="#fff" stroke-linecap="round">
    <rect x="-130" y="-96" width="260" height="192" rx="8" stroke-width="3" stroke-opacity=".5"/>
    <path d="M-96 40 L-96 -40 L-24 -40 L-24 -8 L48 -8 L48 40 Z" stroke-width="5" stroke-opacity=".8" fill="#fff" fill-opacity=".12"/>
    <g stroke-width="2" stroke-opacity=".55" stroke-dasharray="7 6">
      <line x1="-96" y1="64" x2="48" y2="64"/><line x1="72" y1="-40" x2="72" y2="40"/>
    </g>
    <g stroke-width="2" stroke-opacity=".7">
      <line x1="-96" y1="58" x2="-96" y2="70"/><line x1="48" y1="58" x2="48" y2="70"/>
      <line x1="66" y1="-40" x2="78" y2="-40"/><line x1="66" y1="40" x2="78" y2="40"/>
    </g>
  </g>
  <rect width="1200" height="400" fill="url(#shade)"/>
</svg>