<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="山田工業株式会社 薄物でも、浮かない。">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/><stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity=".42"/>
      <stop offset="62%" stop-color="#000" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    
  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="1"/>
  </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#g)"/>
  <g transform="translate(960,200)" opacity=".5">
    <circle r="128" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".55"/>
    <circle r="96"  fill="none" stroke="#fff" stroke-width="2" stroke-opacity=".45"/>
    <circle r="62"  fill="#fff" fill-opacity=".14"/>
    <circle r="18"  fill="#fff" fill-opacity=".38"/>
    <g stroke="#fff" stroke-width="8" stroke-opacity=".35" stroke-linecap="round">
      <line x1="-128" y1="0" x2="-96" y2="0"/><line x1="96" y1="0" x2="128" y2="0"/>
      <line x1="0" y1="-128" x2="0" y2="-96"/><line x1="0" y1="96" x2="0" y2="128"/>
    </g>
    <rect x="-150" y="-14" width="300" height="28" rx="4" fill="#fff" fill-opacity=".22"/>
  </g>
  <rect width="1200" height="400" fill="url(#shade)"/>
</svg>