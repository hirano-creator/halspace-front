    </g>
    <g stroke="#fff" stroke-width="8" stroke-opacity=".95" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-56"/><line x1="0" y1="0" x2="44" y2="26"/>
    </g>
    <circle r="8" fill="#fff"/>
