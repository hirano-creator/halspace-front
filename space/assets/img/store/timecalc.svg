      <stop offset="0%" stop-color="#c2410c"/><stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    
  <pattern id="h" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
