<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <title>ログイン | Space.app</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/space.css">
  <style>
    /* ── 2カラムログインレイアウト ── */
    .login-page {
      min-height: 100vh;
      display: flex;
      background: #fff;
      padding: 0;
      align-items: stretch;
      opacity: 0;
      animation: pageIn .6s ease forwards;
    }
    @keyframes pageIn {
      to { opacity: 1; }
    }

    /* ── 左パネル ── */
    .login-brand {
      flex: 0 0 45%;
      background: linear-gradient(160deg, #1a1a2e, #0f3460, #1a1a2e, #16213e);
      background-size: 400% 400%;
      animation: gradShift 8s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 44px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    @keyframes gradShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* パーティクル canvas */
    #brandCanvas {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .login-brand-name {
      font-family: 'Poppins', sans-serif;
      font-size: 40px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -1px;
      line-height: 1;
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(20px);
      animation: slideUp .7s .3s ease forwards;
      transition: text-shadow .55s ease;
    }
    .login-brand-name span { color: #FF6B35; }
    .login-brand-tagline {
      font-size: 14px;
      color: rgba(255,255,255,.55);
      margin-top: 12px;
      font-weight: 400;
      line-height: 1.6;
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(16px);
      animation: slideUp .7s .5s ease forwards;
    }
    .login-brand-footer {
      font-size: 12px;
      color: rgba(255,255,255,.3);
      position: absolute;
      bottom: 28px;
      left: 0; right: 0;
      text-align: center;
      z-index: 1;
    }

    /* ── 右パネル ── */
    .login-form-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
    }
    .login-form-inner {
      width: 100%;
      max-width: 400px;
      opacity: 0;
      transform: translateX(24px);
      animation: slideLeft .65s .2s ease forwards;
    }
    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideLeft {
      to { opacity: 1; transform: translateX(0); }
    }

    .login-form-title {
      font-size: 15px;
      color: #444;
      margin-bottom: 28px;
      line-height: 1.7;
    }
    .login-form-inner .form-group { margin-bottom: 18px; }
    .login-form-inner .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #333;
      margin-bottom: 6px;
    }
    .login-form-inner .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      color: #333;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      font-family: inherit;
    }
    .login-form-inner .form-group input:focus {
      border-color: #1a1a2e;
      box-shadow: 0 0 0 3px rgba(26,26,46,.08);
    }
    .login-form-inner .form-group input::placeholder { color: #bbb; }

    /* パスワード表示トグル */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 46px; }
    .pw-eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #bbb;
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
      transition: color .15s;
      background: none;
      border: none;
      line-height: 1;
    }
    .pw-eye:hover { color: #555; }

    /* ログインボタン */
    .btn-login {
      width: 100%;
      padding: 15px;
      background: #1a1a2e;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      border-radius: 50px;
      margin-top: 38px;
      transition: background .2s, transform .15s, box-shadow .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      position: relative;
      overflow: hidden;
    }
    .btn-login:hover {
      background: #0f3460;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(15,52,96,.35);
    }
    .btn-login:active {
      transform: scale(.97);
      box-shadow: none;
    }
    /* ローディング中 */
    .btn-login.loading {
      pointer-events: none;
      background: #374151;
    }
    .btn-login .btn-spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .btn-spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* リップル */
    .btn-ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.25);
      transform: scale(0);
      animation: ripple .5s linear;
      pointer-events: none;
    }
    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    .login-error {
      display: none;
      background: #fff5f5;
      border: 1px solid #fed7d7;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #e53e3e;
      margin-bottom: 16px;
      align-items: center;
      gap: 8px;
    }
    .login-error.show { display: flex; }

    /* ── ログイン演出（認証成立から apps.html へ移るまでの間） ──
       種類は spaceLoginFx がランダムに選び、body[data-fx] に入れる。
       canvas 側の動きが主役で、ここは付随するロゴとフォームの見せ方だけ。 */
    .login-brand-copy {
      position: relative;
      z-index: 1;
      transition: transform .55s cubic-bezier(.2,.8,.2,1), filter .55s ease;
    }
    .fx-flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
    }
    .login-page.fx-run .login-form-panel {
      opacity: .22;
      transform: translateX(14px);
      transition: opacity .45s ease, transform .45s ease;
      pointer-events: none;
    }
    .login-page.fx-run[data-fx="converge"] .login-brand-copy {
      transform: scale(1.14);
      filter: blur(.4px);
    }
    .login-page.fx-run[data-fx="constellation"] .login-brand-name {
      text-shadow: 0 0 18px rgba(255,255,255,.8), 0 0 46px rgba(255,107,53,.6);
    }
    .login-page.fx-run[data-fx="sweep"]  .login-brand-copy { transform: translateX(6px); }
    .login-page.fx-run[data-fx="ripple"] .login-brand-copy { transform: scale(1.05); }
    .login-page.fx-run[data-fx="grid"]   .login-brand-copy { transform: translateY(-10px) scale(1.02); }

    @media (max-width: 700px) {
      /* セーフエリア（上下余白）をグラデーション端色に統一 */
      html {
        background: #1a1a2e;
        min-height: 100%;
      }
      body {
        background: transparent;
      }

      /* ページ全体をブランド背景に */
      .login-page {
        flex-direction: column;
        background: linear-gradient(160deg, #1a1a2e, #0f3460, #1a1a2e, #16213e);
        background-size: 400% 400%;
        animation: gradShift 8s ease infinite, pageIn .6s ease forwards;
        min-height: 100svh;
      }

      /* パーティクルcanvasをページ全体に */
      #brandCanvas { position: fixed; width: 100vw; height: 100vh; z-index: 0; }

      /* ロゴエリア */
      .login-brand {
        flex: 0 0 auto;
        min-height: 38vh;
        background: none;
        padding: 60px 24px 32px;
        animation: none;
        z-index: 1;
        justify-content: center;
      }
      .login-brand-name { font-size: 38px; }
      .login-brand-tagline { font-size: 12px; margin-top: 10px; opacity: .7; }
      .login-brand-footer { display: none; }

      /* フォームエリア */
      .login-form-panel {
        background: transparent;
        align-items: flex-start;
        padding: 8px 28px 52px;
        z-index: 1;
        position: relative;
      }
      .login-form-inner { max-width: 100%; }

      /* 説明文 */
      .login-form-title {
        font-size: 13px;
        color: rgba(255,255,255,.5);
        margin-bottom: 24px;
      }

      /* ラベル */
      .login-form-inner .form-group { margin-bottom: 16px; }
      .login-form-inner .form-group label {
        font-size: 11px;
        letter-spacing: .06em;
        color: rgba(255,255,255,.5);
        text-transform: uppercase;
      }

      /* 入力フィールド：フロスト感 */
      .login-form-inner .form-group input {
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.18);
        color: #fff;
        padding: 14px 16px;
        border-radius: 12px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .login-form-inner .form-group input::placeholder {
        color: rgba(255,255,255,.25);
      }
      .login-form-inner .form-group input:focus {
        border-color: rgba(255,107,53,.7);
        box-shadow: 0 0 0 3px rgba(255,107,53,.15);
        background: rgba(255,255,255,.1);
      }

      /* オートフィル上書き（黄色を消す） */
      .login-form-inner .form-group input:-webkit-autofill,
      .login-form-inner .form-group input:-webkit-autofill:focus {
        -webkit-box-shadow: 0 0 0 1000px #1a3060 inset !important;
        -webkit-text-fill-color: #fff !important;
        caret-color: #fff;
        border-color: rgba(255,255,255,.18) !important;
      }

      /* パスワード目アイコン */
      .pw-eye { color: rgba(255,255,255,.3); }
      .pw-eye:hover { color: rgba(255,255,255,.7); }

      /* ログインボタン */
      .btn-login {
        background: linear-gradient(135deg, #FF6B35, #e8451a);
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(255,107,53,.35);
        margin-top: 38px;
        letter-spacing: .04em;
      }
      .btn-login:hover {
        background: linear-gradient(135deg, #ff7d4d, #FF6B35);
        transform: translateY(-1px);
        box-shadow: 0 8px 28px rgba(255,107,53,.5);
      }

      /* エラー */
      .login-error {
        background: rgba(229,62,62,.15);
        border-color: rgba(229,62,62,.4);
        color: #fca5a5;
      }

    }
  </style>
</head>
<body class="login-page">

  <!-- 左：ブランドパネル -->
  <div class="login-brand">
    <canvas id="brandCanvas"></canvas>
    <div class="login-brand-copy">
      <div class="login-brand-name">Space<span>.</span>app</div>
      <p class="login-brand-tagline">
        HaLSpace のサービスポータル<br>
        SOLID・What'sNo をここから
      </p>
    </div>
    <div class="login-brand-footer">&copy; 2025 HaLSpace Inc.</div>
  </div>

  <!-- 右：フォームパネル -->
  <div class="login-form-panel">
    <div class="login-form-inner">

      <p class="login-form-title">
        ログインするには、メールアドレスと<br>パスワードを入力してください。
      </p>

      <div class="login-error" id="loginError">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="loginErrorMsg">メールアドレスまたはパスワードが正しくありません。</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email"
                 placeholder="example@company.co.jp" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">パスワード</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password"
                   placeholder="パスワードを入力" autocomplete="current-password" required>
            <button type="button" class="pw-eye" id="pwToggle" tabindex="-1" aria-label="パスワードを表示">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text">ログイン</span>
          <span class="btn-spinner"></span>
        </button>
      </form>

    </div>
  </div>

  <!-- ログイン演出の白フラッシュ（案A 収束でのみ使う） -->
  <div class="fx-flash" id="fxFlash"></div>

  <script src="assets/js/mfa.js"></script>
  <script src="assets/js/space.js"></script>
  <script>
  /* ── パーティクル背景 ＋ ログイン演出 ──
     待機中は従来どおり点が漂い、近いものを線で結ぶ。
     ログインが成立すると spaceLoginFx.play() が呼ばれ、5種類の演出から
     ランダムに1つを再生してから apps.html へ移る。?fx=grid のように
     URLパラメータを付けると種類を固定できる（動作確認用）。 */
  (function () {
    const canvas = document.getElementById('brandCanvas');
    const ctx    = canvas.getContext('2d');
    const flash  = document.getElementById('fxFlash');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* 演出の種類と再生時間(ms)。この時間ぶん遷移が遅れるので、長くしすぎない */
    const MODES = {
      converge:      1150,
      constellation: 1200,
      sweep:         1300,
      ripple:        1350,
      grid:          1200,
    };
    const COUNT = 90;

    let W, H, particles;
    let cols, rows, gapX, gapY;
    let fx = null;   /* 演出中のみ { mode, dur, t0, origin } が入る */

    const clamp01       = v => (v < 0 ? 0 : v > 1 ? 1 : v);
    const lerp          = (a, b, t) => a + (b - a) * t;
    const easeOutCubic  = t => 1 - Math.pow(1 - t, 3);
    const easeInOutCubic = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

    function resize() {
      W = canvas.width  = canvas.offsetWidth;
      H = canvas.height = canvas.offsetHeight;
      /* 整列演出で使う格子。粒子数と縦横比から列数を決める */
      cols = Math.max(4, Math.round(Math.sqrt(COUNT * W / Math.max(H, 1))));
      rows = Math.max(4, Math.ceil(COUNT / cols));
      gapX = W / (cols + 1);
      gapY = H / (rows + 1);
    }

    function mkParticle() {
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.8 + 0.4,
        vx: (Math.random() - 0.5) * 0.35,
        vy: (Math.random() - 0.5) * 0.35,
        alpha: Math.random() * 0.5 + 0.15,
        sx: 0, sy: 0,   /* 演出開始時の座標 */
        gx: 0, gy: 0,   /* 整列先の格子点 */
        heat: 0,        /* 発光量 0..1 */
      };
    }

    function init() {
      resize();
      particles = Array.from({ length: COUNT }, mkParticle);
    }

    /* ══════ 待機中の漂い ══════ */
    function drift() {
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = W;
        if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H;
        if (p.y > H) p.y = 0;
      });
    }

    /* ══════ 案A 収束 ══════ */
    function stepConverge(p) {
      const cx = W / 2, cy = H / 2;
      const pull = p * p * 0.14;
      particles.forEach(q => {
        q.x += (cx - q.x) * pull;
        q.y += (cy - q.y) * pull;
        q.heat = easeOutCubic(clamp01((p - 0.15) / 0.6)) * 0.8;
        q.alpha = Math.min(1, q.alpha + p * 0.012);
      });
      flash.style.opacity = p > 0.72 ? ((p - 0.72) / 0.28) * 0.95 : 0;
    }
    function drawConvergeGlow(p) {
      const cx = W / 2, cy = H / 2;
      const r = 6 + easeInOutCubic(p) * 78;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0,   `rgba(255,255,255,${0.28 + p * 0.6})`);
      g.addColorStop(0.4, `rgba(255,107,53,${0.22 + p * 0.35})`);
      g.addColorStop(1,   'rgba(255,107,53,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    /* ══════ 案B 星座結線 ══════ */
    function stepConstellation(p) {
      const cx = W / 2, cy = H / 2;
      const front = easeOutCubic(p) * Math.sqrt(cx * cx + cy * cy) * 1.15;
      particles.forEach(q => {
        q.x += q.vx * 0.3;
        q.y += q.vy * 0.3;
        q.heat = clamp01((front - Math.hypot(q.x - cx, q.y - cy)) / 70);
        q.alpha = Math.min(1, q.alpha + q.heat * 0.02);
      });
    }

    /* ══════ 案C 走査 ══════ */
    let sweepX = 0;
    function stepSweep(p) {
      sweepX = -40 + easeInOutCubic(p) * (W + 80);
      particles.forEach(q => {
        q.x += q.vx * 0.25;
        q.y += q.vy * 0.25;
        if (q.x < sweepX) {
          q.heat = Math.max(0.55, clamp01(1 - (sweepX - q.x) / 60));
        }
      });
    }
    function drawSweepBeam() {
      if (sweepX < -40 || sweepX > W + 40) return;
      const g = ctx.createLinearGradient(sweepX - 46, 0, sweepX + 14, 0);
      g.addColorStop(0,   'rgba(255,107,53,0)');
      g.addColorStop(0.7, 'rgba(255,150,90,.30)');
      g.addColorStop(1,   'rgba(255,255,255,.85)');
      ctx.fillStyle = g;
      ctx.fillRect(sweepX - 46, 0, 60, H);
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.fillRect(sweepX, 0, 1.6, H);
    }

    /* ══════ 案D 波紋 ══════ */
    let waves = [];
    function stepRipple(p) {
      const t = p * fx.dur;
      const o = fx.origin;
      /* 波面は等速で進める。イージングを掛けると序盤で通り過ぎて見えなくなる */
      const maxR = Math.hypot(W, H) * 1.6;
      const travel = fx.dur - 150;
      waves = [];
      [0, 260, 520].forEach(delay => {
        const age = t - delay;
        if (age <= 0) return;
        const prog = clamp01(age / travel);
        waves.push({ r: prog * maxR, fade: 1 - prog * 0.75 });
      });
      particles.forEach(q => {
        q.x += q.vx * 0.4;
        q.y += q.vy * 0.4;
        const dx = q.x - o.x, dy = q.y - o.y;
        const d = Math.hypot(dx, dy) || 1;
        let heat = 0;
        waves.forEach(w => {
          const diff = Math.abs(d - w.r);
          if (diff >= 52) return;
          const f = (1 - diff / 52) * w.fade;
          heat = Math.max(heat, f);
          q.x += (dx / d) * f * 2.2;
          q.y += (dy / d) * f * 2.2;
        });
        q.heat = heat;
        q.x = Math.max(0, Math.min(W, q.x));
        q.y = Math.max(0, Math.min(H, q.y));
      });
    }
    function drawRippleRings() {
      const o = fx.origin;
      waves.forEach(w => {
        ctx.beginPath();
        ctx.arc(o.x, o.y, w.r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,150,90,${0.40 * w.fade})`;
        ctx.lineWidth = 1.8;
        ctx.stroke();
      });
    }

    /* ══════ 案E 整列 ══════ */
    function assignGrid() {
      /* 現在位置から最も近い未使用の格子点を割り当てる。粒子90個なら総当たりで十分速い */
      const slots = [];
      for (let r = 1; r <= rows; r++) {
        for (let c = 1; c <= cols; c++) slots.push({ x: gapX * c, y: gapY * r, used: false });
      }
      particles.forEach(q => {
        let best = -1, bestD = Infinity;
        for (let s = 0; s < slots.length; s++) {
          if (slots[s].used) continue;
          const d = (q.x - slots[s].x) ** 2 + (q.y - slots[s].y) ** 2;
          if (d < bestD) { bestD = d; best = s; }
        }
        if (best >= 0) {
          slots[best].used = true;
          q.gx = slots[best].x;
          q.gy = slots[best].y;
        }
      });
    }
    function stepGrid(p) {
      const e = easeInOutCubic(clamp01(p / 0.7));
      particles.forEach(q => {
        q.x = lerp(q.sx, q.gx, e);
        q.y = lerp(q.sy, q.gy, e);
        q.heat = e * 0.55;
        q.alpha = Math.min(1, q.alpha + e * 0.01);
      });
    }
    function drawGridLines(p) {
      const e = easeOutCubic(clamp01(p / 0.8));
      ctx.strokeStyle = `rgba(255,255,255,${0.13 * e})`;
      ctx.lineWidth = 1;
      for (let x = gapX; x < W; x += gapX) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = gapY; y < H; y += gapY) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
    }
    function drawGridMarks(p) {
      const e = easeOutCubic(clamp01((p - 0.45) / 0.55));
      if (e <= 0) return;
      ctx.strokeStyle = `rgba(255,107,53,${0.55 * e})`;
      ctx.lineWidth = 1.2;
      const s = 7;
      [[0.22, 0.24], [0.78, 0.24], [0.22, 0.76], [0.78, 0.76]].forEach(([fxr, fyr]) => {
        const x = W * fxr, y = H * fyr;
        ctx.beginPath();
        ctx.moveTo(x - s, y); ctx.lineTo(x + s, y);
        ctx.moveTo(x, y - s); ctx.lineTo(x, y + s);
        ctx.stroke();
      });
    }

    /* ══════ 共通描画 ══════ */
    function drawLinks(linkDist, lineBase) {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          if (dist >= linkDist) continue;
          const k = 1 - dist / linkDist;
          const heat = Math.min(a.heat, b.heat);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = heat > 0.05
            ? `rgba(255,${Math.round(lerp(255, 130, heat))},${Math.round(lerp(255, 70, heat))},${lineBase * k * (1 + heat * 2.2)})`
            : `rgba(255,255,255,${lineBase * k})`;
          ctx.lineWidth = 0.6 + heat * 0.7;
          ctx.stroke();
        }
      }
    }
    function drawParticles() {
      particles.forEach(q => {
        ctx.beginPath();
        ctx.arc(q.x, q.y, q.r * (1 + q.heat * 1.5), 0, Math.PI * 2);
        if (q.heat > 0.05) {
          ctx.fillStyle = `rgba(255,${Math.round(lerp(255, 120, q.heat))},${Math.round(lerp(255, 60, q.heat))},${Math.min(1, q.alpha + q.heat)})`;
          ctx.shadowColor = 'rgba(255,107,53,.9)';
          ctx.shadowBlur = 10 * q.heat;
        } else {
          ctx.fillStyle = `rgba(255,255,255,${q.alpha})`;
          ctx.shadowBlur = 0;
        }
        ctx.fill();
        ctx.shadowBlur = 0;
      });
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      const run = fx !== null;
      const p   = run ? clamp01((performance.now() - fx.t0) / fx.dur) : 0;
      let linkDist = 80;
      let lineBase = 0.08;

      if (!run) {
        drift();
      } else if (fx.mode === 'converge') {
        stepConverge(p);
      } else if (fx.mode === 'constellation') {
        /* 結線距離は画面の短辺に対する比率で頭打ちにする。
           スマホでは canvas が全画面になるため、固定値だと線で埋め尽くされる */
        const maxLink = Math.min(190, Math.min(W, H) * 0.33);
        linkDist = lerp(80, maxLink, easeInOutCubic(p));
        lineBase = lerp(0.08, 0.20, easeOutCubic(p));
        stepConstellation(p);
      } else if (fx.mode === 'sweep') {
        stepSweep(p);
      } else if (fx.mode === 'ripple') {
        stepRipple(p);
      } else if (fx.mode === 'grid') {
        drawGridLines(p);
        stepGrid(p);
      }

      drawLinks(linkDist, lineBase);
      drawParticles();

      if (run) {
        if (fx.mode === 'converge')    drawConvergeGlow(p);
        else if (fx.mode === 'sweep')  drawSweepBeam();
        else if (fx.mode === 'ripple') drawRippleRings();
        else if (fx.mode === 'grid')   drawGridMarks(p);
      }

      requestAnimationFrame(draw);
    }

    /* ══════ 演出の起動 ══════ */
    function play() {
      if (reduceMotion || fx) return Promise.resolve();

      const keys  = Object.keys(MODES);
      const fixed = new URLSearchParams(location.search).get('fx');
      const mode  = MODES[fixed] ? fixed : keys[Math.floor(Math.random() * keys.length)];

      /* 波紋の発生源はログインボタンの中心。canvas 内の座標に直す */
      const btn   = document.getElementById('loginBtn');
      const cRect = canvas.getBoundingClientRect();
      const bRect = btn ? btn.getBoundingClientRect() : cRect;

      particles.forEach(q => { q.sx = q.x; q.sy = q.y; q.heat = 0; });
      if (mode === 'grid') assignGrid();

      fx = {
        mode,
        dur: MODES[mode],
        t0: performance.now(),
        origin: {
          x: bRect.left + bRect.width / 2 - cRect.left,
          y: bRect.top  + bRect.height / 2 - cRect.top,
        },
      };

      document.body.dataset.fx = mode;
      document.body.classList.add('fx-run');

      return new Promise(resolve => setTimeout(resolve, MODES[mode]));
    }

    /* space.js から呼ばれる。未定義でも遷移するので、読み込み順が崩れても壊れない */
    window.spaceLoginFx = { play };

    window.addEventListener('resize', () => { resize(); });
    init();
    draw();
  })();

  /* ── パスワード表示トグル ── */
  document.getElementById('pwToggle').addEventListener('click', function () {
    const input = document.getElementById('password');
    const icon  = this.querySelector('i');
    const show  = input.type === 'password';
    input.type  = show ? 'text' : 'password';
    icon.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
  });

  /* ── ボタンリップル ── */
  document.getElementById('loginBtn').addEventListener('mousedown', function (e) {
    const btn = this;
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 2;
    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top  - size / 2;
    const ripple = document.createElement('span');
    ripple.className = 'btn-ripple';
    ripple.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px`;
    btn.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
  });

  </script>
</body>
</html>
