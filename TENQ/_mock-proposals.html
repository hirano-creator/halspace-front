<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TENQ 画面モック5案</title>
<style>
/* ===== 比較ページ全体（モックの外枠） ===== */
:root {
  --page-bg: #EEF1F5;
  --page-ink: #1B2430;
  --page-sub: #5B6675;
  --page-line: #D6DCE4;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page-bg); color: var(--page-ink); font-family: var(--font); line-height: 1.6; }
.page-head { background: #fff; border-bottom: 1px solid var(--page-line); padding: 20px 24px 0; position: sticky; top: 0; z-index: 10; }
.page-head h1 { margin: 0; font-size: 20px; }
.page-head p { margin: 4px 0 12px; font-size: 13px; color: var(--page-sub); }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tabs button { font: inherit; font-size: 14px; border: 1px solid var(--page-line); border-bottom: none; background: #F6F8FA; padding: 8px 16px; border-radius: 8px 8px 0 0; cursor: pointer; white-space: nowrap; color: var(--page-sub); }
.tabs button[aria-selected="true"] { background: var(--page-bg); color: var(--page-ink); font-weight: 700; }
main { padding: 24px; max-width: 1400px; margin: 0 auto; }
.concept { background: #fff; border: 1px solid var(--page-line); border-radius: 12px; padding: 20px 24px; margin-bottom: 24px; }
.concept h2 { margin: 0 0 4px; font-size: 22px; }
.concept .lead { margin: 0 0 12px; color: var(--page-sub); }
.concept .pc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 24px; font-size: 14px; }
.concept h3 { font-size: 13px; margin: 0 0 4px; color: var(--page-sub); }
.concept ul { margin: 0; padding-left: 1.2em; }
.frames { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.frame-wrap { display: flex; flex-direction: column; gap: 8px; }
.frame-label { font-size: 13px; color: var(--page-sub); font-weight: 700; }
.phone { width: 375px; max-width: calc(100vw - 48px); height: 760px; border: 10px solid #1B2430; border-radius: 36px; overflow: hidden; background: #fff; position: relative; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
.phone .screen { height: 100%; overflow-y: auto; position: relative; }
.pc { width: 100%; border: 1px solid #C3CBD6; border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
.pc .chrome { height: 28px; background: #E4E8EE; display: flex; align-items: center; gap: 6px; padding: 0 12px; }
.pc .chrome i { width: 10px; height: 10px; border-radius: 50%; background: #C3CBD6; display: block; }
.pc .pc-body { overflow-x: auto; }
.pc .pc-inner { min-width: 1080px; }
.compare { background: #fff; border: 1px solid var(--page-line); border-radius: 12px; padding: 20px 24px; margin-top: 32px; overflow-x: auto; }
.compare table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 14px; }
.compare th, .compare td { border-bottom: 1px solid var(--page-line); padding: 10px 12px; text-align: left; vertical-align: top; }
.compare thead th { background: #F6F8FA; }
.note { font-size: 12px; color: var(--page-sub); margin-top: 8px; }
[hidden] { display: none !important; }

/* ===== モック内の共通部品 ===== */
.m { font-family: var(--font); color: var(--ink); background: var(--bg); min-height: 100%; font-size: 15px; }
.m button { font: inherit; cursor: pointer; }
.m .hdr { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--hdr-bg); color: var(--hdr-ink); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
.m .hdr .who { font-size: 12px; opacity: .8; text-align: right; line-height: 1.3; }
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .08em; font-size: 18px; }
.logo svg { width: 26px; height: 26px; flex: none; }
.logo small { display: block; font-size: 9px; letter-spacing: .12em; font-weight: 600; opacity: .7; margin-top: -2px; }
.m .muted { color: var(--sub); }
.m .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.m .b-ok { background: var(--ok-lt); color: var(--ok); }
.m .b-ng { background: var(--ng-lt); color: var(--ng); }
.m .b-wait { background: var(--wait-lt); color: var(--wait); }
.m .b-gray { background: #EEF1F4; color: #4A5462; }
.m .sec-title { font-size: 13px; font-weight: 700; color: var(--sub); margin: 20px 16px 8px; letter-spacing: .04em; }
.m .scanfab { position: sticky; bottom: 0; padding: 12px 16px 20px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
.m .btn-main { width: 100%; border: none; border-radius: var(--radius); background: var(--accent); color: #fff; font-weight: 700; font-size: 17px; padding: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.m .btn-main:disabled { background: #B8C0CB; color: #fff; cursor: not-allowed; }
.m .btn-sub { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: var(--radius); padding: 10px 14px; font-weight: 600; }
.m .eqhead { padding: 16px; background: var(--card); border-bottom: 1px solid var(--line); }
.m .eqhead .code { font-size: 12px; color: var(--sub); }
.m .eqhead .name { font-size: 20px; font-weight: 800; margin: 2px 0 4px; }
.m .eqhead .meta { font-size: 12px; color: var(--sub); }
.m .progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.m .progress > span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.m .req { color: var(--ng); font-size: 11px; font-weight: 700; margin-left: 4px; }
.m .crit { font-size: 12px; color: var(--sub); margin-top: 2px; }
.ico { width: 18px; height: 18px; flex: none; }

/* PC 共通 */
.m.pcm { display: grid; grid-template-columns: 220px 1fr; min-height: 640px; }
.m .side { background: var(--side-bg); color: var(--side-ink); padding: 16px 12px; border-right: 1px solid var(--line); }
.m .side .logo { padding: 4px 8px 16px; }
.m .side a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: inherit; text-decoration: none; font-size: 14px; opacity: .85; }
.m .side a.on { background: var(--side-on); opacity: 1; font-weight: 700; }
.m .content { padding: 20px 24px; }
.m .content h1 { font-size: 20px; margin: 0; }
.m .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin: 16px 0; }
.m .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.m .kpi .l { font-size: 12px; color: var(--sub); }
.m .kpi .v { font-size: 28px; font-weight: 800; line-height: 1.2; }
.m .kpi .v small { font-size: 13px; font-weight: 600; color: var(--sub); margin-left: 2px; }
.m .row2 { display: grid; grid-template-columns: 1.8fr 1fr; gap: 16px; }
.m .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.m .panel h2 { font-size: 15px; margin: 0 0 10px; }
.m table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.m table.t th { text-align: left; font-weight: 600; color: var(--sub); border-bottom: 1px solid var(--line); padding: 6px 8px; }
.m table.t td { border-bottom: 1px solid var(--line); padding: 8px; white-space: nowrap; }
.m table.t th { white-space: nowrap; }
.m .barrow { display: grid; grid-template-columns: 110px 1fr 64px; gap: 10px; align-items: center; font-size: 13px; margin: 8px 0; }
.m .bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; display: flex; }
.m .bar .ok { background: var(--ok); }
.m .bar .ng { background: var(--ng); }

/* ===== A案: クリア・カード ===== */
.pA { --bg:#F5F7FA; --card:#fff; --ink:#1B2430; --sub:#5F6B7A; --line:#E1E6EC; --accent:#1F5FD1; --ok:#12804A; --ok-lt:#E3F4EA; --ng:#C62828; --ng-lt:#FDECEC; --wait:#A15C00; --wait-lt:#FFF2DC; --hdr-bg:#fff; --hdr-ink:#1B2430; --side-bg:#fff; --side-ink:#1B2430; --side-on:#E8F0FD; --radius:12px; }
.pA .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin: 0 16px 10px; padding: 14px; }
.pA .item-top { display: flex; justify-content: space-between; gap: 8px; }
.pA .item-label { font-weight: 700; }
.pA .judge { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.pA .judge.na3 { grid-template-columns: 1fr 1fr .7fr; }
.pA .judge button { border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 12px 6px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--sub); }
.pA .judge button.on-ok { border-color: var(--ok); background: var(--ok-lt); color: var(--ok); }
.pA .judge button.on-ng { border-color: var(--ng); background: var(--ng-lt); color: var(--ng); }
.pA .judge button.on-na { border-color: #6B7684; background: #EEF1F4; color: #3B4552; }
.pA .ngnote { margin-top: 10px; padding: 10px; border-radius: 8px; background: var(--ng-lt); color: var(--ng); font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pA .ngnote button { border: none; background: var(--ng); color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 700; }
.pA .stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px; }
.pA .stat3 > div { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
.pA .stat3 .v { font-size: 26px; font-weight: 800; line-height: 1.1; }
.pA .stat3 .l { font-size: 12px; color: var(--sub); }
.pA .eqrow { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; margin: 0 16px 8px; padding: 12px 14px; }
.pA .eqrow .n { font-weight: 700; }
.pA .eqrow .s { font-size: 12px; color: var(--sub); }

/* ===== B案: ワンタップ連続 ===== */
.pB { --bg:#fff; --card:#fff; --ink:#0F1F1E; --sub:#5A6B6A; --line:#DDE5E4; --accent:#0F766E; --ok:#0F7A43; --ok-lt:#E2F5EA; --ng:#C42B1C; --ng-lt:#FCE9E7; --wait:#9A5B00; --wait-lt:#FFF1D6; --hdr-bg:#fff; --hdr-ink:#0F1F1E; --side-bg:#0F2E2C; --side-ink:#E6F2F1; --side-on:rgba(255,255,255,.12); --radius:16px; }
.pB .stepper { display: flex; gap: 4px; padding: 12px 16px 0; }
.pB .stepper i { flex: 1; height: 6px; border-radius: 999px; background: var(--line); }
.pB .stepper i.ok { background: var(--ok); }
.pB .stepper i.ng { background: var(--ng); }
.pB .stepper i.na { background: #8A9796; }
.pB .stepper i.cur { background: var(--accent); }
.pB .one { padding: 24px 20px; display: flex; flex-direction: column; min-height: 520px; }
.pB .one .num { font-size: 14px; color: var(--sub); font-weight: 700; }
.pB .one .q { font-size: 28px; font-weight: 800; line-height: 1.3; margin: 8px 0; }
.pB .one .c { background: #F3F7F7; border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.pB .big { display: grid; gap: 12px; margin-top: auto; padding-top: 20px; }
.pB .big button { border: none; border-radius: 18px; padding: 22px; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; }
.pB .big .ok { background: var(--ok); color: #fff; }
.pB .big .ng { background: #fff; color: var(--ng); border: 3px solid var(--ng); }
.pB .big .na { background: #F0F3F3; color: #4A5857; font-size: 16px; padding: 14px; }
.pB .navrow { display: flex; justify-content: space-between; padding: 0 20px 16px; font-size: 14px; }
.pB .navrow button { border: none; background: none; color: var(--accent); font-weight: 700; padding: 8px 0; }
.pB .done { padding: 24px 20px; }
.pB .done .ring { width: 96px; height: 96px; border-radius: 50%; background: var(--ok-lt); color: var(--ok); display: grid; place-items: center; margin: 12px auto; }
.pB .sumrow { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.pB .homehero { margin: 16px; padding: 20px; border-radius: 20px; background: var(--accent); color: #fff; }
.pB .homehero .v { font-size: 44px; font-weight: 800; line-height: 1; }
.pB .homehero .bar { background: rgba(255,255,255,.25); margin-top: 12px; }
.pB .homehero .bar span { background: #fff; display: block; }
.pB .eqrow { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.pB .eqrow .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--wait); flex: none; }

/* ===== C案: チェックシート（紙の点検表に近い） ===== */
.pC { --bg:#FBFBF8; --card:#fff; --ink:#1A2433; --sub:#5C6675; --line:#C9D1DC; --accent:#1E3A5F; --ok:#1B6E3A; --ok-lt:#E4F2E8; --ng:#B3261E; --ng-lt:#FBE7E5; --wait:#8A5A00; --wait-lt:#FFF0D3; --hdr-bg:#1E3A5F; --hdr-ink:#fff; --side-bg:#1E3A5F; --side-ink:#E9EEF5; --side-on:rgba(255,255,255,.14); --radius:4px; }
.pC .sheet-meta { display: grid; grid-template-columns: 72px 1fr; border: 1px solid var(--line); margin: 12px; background: #fff; font-size: 13px; }
.pC .sheet-meta > * { padding: 6px 8px; border-bottom: 1px solid var(--line); }
.pC .sheet-meta > :nth-child(odd) { background: #F1F4F8; color: var(--sub); border-right: 1px solid var(--line); }
.pC .sheet-meta > :nth-last-child(-n+2) { border-bottom: none; }
.pC table.sheet { width: calc(100% - 24px); margin: 0 12px; border-collapse: collapse; background: #fff; font-size: 14px; }
.pC table.sheet th, .pC table.sheet td { border: 1px solid var(--line); padding: 0; }
.pC table.sheet thead th { background: #F1F4F8; font-size: 12px; color: var(--sub); padding: 6px 4px; font-weight: 600; }
.pC table.sheet td.lbl { padding: 8px; }
.pC table.sheet td.lbl b { display: block; font-size: 14px; }
.pC table.sheet td.lbl span:not(.req) { display: block; font-size: 11px; color: var(--sub); line-height: 1.4; }
.pC table.sheet td.mk { width: 46px; text-align: center; }
.pC table.sheet td.mk button { width: 100%; height: 56px; border: none; background: none; font-size: 22px; font-weight: 800; color: #C3CAD3; }
.pC table.sheet td.mk button.on-ok { background: var(--ok-lt); color: var(--ok); }
.pC table.sheet td.mk button.on-ng { background: var(--ng-lt); color: var(--ng); }
.pC table.sheet td.mk button.on-na { background: #EEF1F4; color: #3B4552; }
.pC table.sheet td.mk button:disabled { background: repeating-linear-gradient(45deg,#F4F6F8,#F4F6F8 4px,#fff 4px,#fff 8px); color: transparent; cursor: not-allowed; }
.pC .legend { margin: 8px 12px; font-size: 12px; color: var(--sub); }
.pC .stamp { display: flex; gap: 8px; margin: 12px; }
.pC .stamp > div { flex: 1; border: 1px solid var(--line); background: #fff; text-align: center; font-size: 11px; color: var(--sub); }
.pC .stamp > div b { display: block; height: 40px; line-height: 40px; color: var(--ink); font-size: 13px; }
.pC .stamp > div span { display: block; border-bottom: 1px solid var(--line); background: #F1F4F8; padding: 2px; }
.pC table.list { width: calc(100% - 24px); margin: 0 12px; border-collapse: collapse; background: #fff; font-size: 13px; }
.pC table.list th, .pC table.list td { border: 1px solid var(--line); padding: 8px 6px; }
.pC table.list th { background: #F1F4F8; color: var(--sub); font-weight: 600; font-size: 12px; }
.pC .sumline { display: grid; grid-template-columns: repeat(3,1fr); margin: 12px; border: 1px solid var(--line); background: #fff; }
.pC .sumline > div { text-align: center; padding: 8px 4px; border-right: 1px solid var(--line); }
.pC .sumline > div:last-child { border-right: none; }
.pC .sumline .v { font-size: 22px; font-weight: 800; }
.pC .sumline .l { font-size: 11px; color: var(--sub); }
.pC .m .btn-main, .pC .btn-main { border-radius: 4px; }

/* ===== D案: 一括正常（異常だけ選ぶ） ===== */
.pD { --bg:#F6F8F6; --card:#fff; --ink:#18241B; --sub:#5B6A5F; --line:#DEE5DF; --accent:#15803D; --ok:#15803D; --ok-lt:#E3F3E8; --ng:#D9480F; --ng-lt:#FFEDE3; --wait:#9A5B00; --wait-lt:#FFF1D6; --hdr-bg:#fff; --hdr-ink:#18241B; --side-bg:#fff; --side-ink:#18241B; --side-on:#E3F3E8; --radius:14px; }
.pD .allok { margin: 16px; padding: 16px; border-radius: 16px; background: #fff; border: 1px solid var(--line); }
.pD .allok p { margin: 0 0 10px; font-size: 13px; color: var(--sub); }
.pD .allok button { width: 100%; border: none; border-radius: 12px; background: var(--ok); color: #fff; font-size: 18px; font-weight: 800; padding: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.pD .allok button.undo { background: #fff; color: var(--sub); border: 1px solid var(--line); font-size: 14px; padding: 10px; font-weight: 600; }
.pD .lst { margin: 0 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.pD .lrow { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.pD .lrow:last-child { border-bottom: none; }
.pD .lrow .t { flex: 1; min-width: 0; }
.pD .lrow .t b { display: block; }
.pD .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
.pD .seg button { border: none; background: #fff; padding: 10px 10px; font-size: 13px; font-weight: 700; color: var(--sub); min-width: 48px; }
.pD .seg button + button { border-left: 1px solid var(--line); }
.pD .seg button.on-ok { background: var(--ok); color: #fff; }
.pD .seg button.on-ng { background: var(--ng); color: #fff; }
.pD .seg button.on-na { background: #5B6A5F; color: #fff; }
.pD .lrow.is-ng { background: var(--ng-lt); }
.pD .warn { margin: 12px 16px; padding: 12px 14px; border-radius: 12px; background: var(--ng-lt); color: var(--ng); font-size: 13px; font-weight: 600; }
.pD .ring { margin: 16px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; gap: 16px; align-items: center; }
.pD .ring svg { width: 92px; height: 92px; flex: none; }
.pD .chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px; }
.pD .chips span { white-space: nowrap; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.pD .chips span.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.pD .eqrow { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); background: #fff; }

/* ===== E案: 現場ハイコントラスト ===== */
.pE { --bg:#fff; --card:#fff; --ink:#0A0A0A; --sub:#3D3D3D; --line:#0A0A0A; --accent:#0A0A0A; --ok:#0B6B2F; --ok-lt:#DFF2E5; --ng:#C40000; --ng-lt:#FFE5E5; --wait:#7A4D00; --wait-lt:#FFF0C2; --hdr-bg:#0A0A0A; --hdr-ink:#fff; --side-bg:#0A0A0A; --side-ink:#fff; --side-on:#FFC400; --radius:6px; }
.pE { font-size: 17px; }
.pE .hdr { border-bottom: 4px solid #FFC400; }
.pE .side a.on { color: #0A0A0A; }
.pE .eqhead { border-bottom: 3px solid #0A0A0A; }
.pE .eqhead .name { font-size: 24px; }
.pE .xi { border-bottom: 2px solid #0A0A0A; padding: 14px 16px; }
.pE .xi .top { display: flex; gap: 12px; align-items: baseline; }
.pE .xi .no { font-size: 28px; font-weight: 900; min-width: 36px; }
.pE .xi .lb { font-size: 19px; font-weight: 800; }
.pE .xi .cr { font-size: 14px; color: var(--sub); margin: 2px 0 10px 48px; }
.pE .xj { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-left: 48px; }
.pE .xj.na3 { grid-template-columns: 1fr 1fr 1fr; }
.pE .xj button { border: 3px solid #0A0A0A; background: #fff; border-radius: 6px; padding: 14px 4px; font-size: 18px; font-weight: 900; color: #0A0A0A; display: flex; align-items: center; justify-content: center; gap: 6px; }
.pE .xj button.on-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.pE .xj button.on-ng { background: var(--ng); border-color: var(--ng); color: #fff; }
.pE .xj button.on-na { background: #3D3D3D; border-color: #3D3D3D; color: #fff; }
.pE .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-bottom: 3px solid #0A0A0A; }

const stepB = { cur: 0 };

const allOkD = { on: false };

function answeredCount(p) { return ITEMS.filter(it => state[p][it.id]).length; }

const A = {
  home() {
    return `<div class="m pA">
      <div class="hdr">${logo('#1F5FD1', '#1F5FD1')}${who()}</div>

/* ===== 描画 ===== */
const tabs = document.getElementById('tabs');
const main = document.getElementById('main');
let current = 'A';

function renderTabs() {
  tabs.innerHTML = PROPOSALS.map(p => `<button role="tab" aria-selected="${p.id === current}" data-tab="${p.id}">${p.name.replace('　', ' ')}</button>`).join('')
    + `<button role="tab" aria-selected="${current === 'cmp'}" data-tab="cmp">5案の比較表</button>`;
}

function renderMain() {
  if (current === 'cmp') { main.innerHTML = compareHtml(); return; }
  const p = PROPOSALS.find(x => x.id === current);
  main.innerHTML = `
    <section class="concept">
      <h2>${p.name}</h2>
      <p class="lead">${p.lead}</p>
      <div class="pc-grid">
        <div><h3>よいところ</h3><ul>${p.good.map(g => `<li>${g}</li>`).join('')}</ul></div>

      <div class="frame-wrap"><div class="frame-label">スマホ ・ 設備点検（タップできます）</div><div class="phone"><div class="screen" id="insp">${p.r.inspect()}</div></div></div>
    </div>
    <div class="frame-wrap" style="margin-top:24px"><div class="frame-label">PC ・ ダッシュボード</div><div class="pc"><div class="chrome"><i></i><i></i><i></i></div><div class="pc-body"><div class="pc-inner">${p.r.pc()}</div></div></div></div>
    <div class="compare" style="margin-top:24px">${compareTable()}</div>`;
}

function compareTable() {
  return `<table>
    <thead><tr><th></th>${PROPOSALS.map(p => `<th>${p.id}案</th>`).join('')}</tr></thead>
    <tbody>
      <tr><th>一言で</th><td>標準カード</td><td>1項目ずつ特大ボタン</td><td>紙の点検表そのまま</td><td>一括正常＋異常だけ</td><td>白黒・太字・安全色</td></tr>
      <tr><th>全項目正常の日のタップ数（8項目）</th><td>8＋完了</td><td>8＋確認＋完了</td><td>8＋完了</td><td><b>1＋完了</b></td><td>8＋完了</td></tr>
      <tr><th>押し間違いにくさ</th><td>○</td><td><b>◎</b></td><td>△</td><td>○</td><td>◎</td></tr>
      <tr><th>「見ずに押す」の防ぎやすさ</th><td>○</td><td><b>◎</b></td><td>○</td><td><b>△ 要対策</b></td><td>○</td></tr>
      <tr><th>紙からの移行のしやすさ</th><td>○</td><td>○</td><td><b>◎</b></td><td>○</td><td>○</td></tr>
      <tr><th>暗い場所・屋外での見やすさ</th><td>○</td><td>○</td><td>△</td><td>○</td><td><b>◎</b></td></tr>
      <tr><th>項目が多い設備（20項目〜）</th><td>△ 縦に長い</td><td>△ 画面が多い</td><td><b>◎</b></td><td>○</td><td>△ 縦に長い</td></tr>
      <tr><th>PC 画面のなじみ</th><td><b>◎</b></td><td>○</td><td>○</td><td>◎</td><td>△</td></tr>
    </tbody>
  </table>
  <p class="note">組み合わせも可能です（例: 画面の骨格は A案、点検画面だけ B案と C案を切り替え式、配色は E案の太線を一部採用 など）。</p>`;
}

function compareHtml() {
  return `<section class="concept"><h2>5案の比較</h2><p class="lead">各案のタブで実際の画面をタップして比べてください。</p></section><div class="compare">${compareTable()}</div>`;
}

function rerenderInspect() {
  const p = PROPOSALS.find(x => x.id === current);
  const el = document.getElementById('insp');
  if (p && el) el.innerHTML = p.r.inspect();
}

document.addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { current = tab.dataset.tab; renderTabs(); renderMain(); window.scrollTo({ top: 0 }); return; }
  const b = e.target.closest('button[data-p]');
  if (!b) return;
  const p = b.dataset.p;
  const act = b.dataset.act;
  if (act === 'done') { doneFlag[p] = true; }
  else if (act === 'reset') { state[p] = {}; doneFlag[p] = false; stepB.cur = 0; allOkD.on = false; }
  else if (act === 'prev') { stepB.cur = Math.max(0, stepB.cur - 1); }
  else if (act === 'next') { stepB.cur++; }
  else if (act === 'goto') { stepB.cur = Number(b.dataset.i); }
  else if (act === 'allok') { ITEMS.forEach(it => { state.D[it.id] = 'ok'; }); allOkD.on = true; }
  else if (act === 'allundo') { state.D = {}; allOkD.on = false; }
  else if (b.dataset.i) {
    const id = Number(b.dataset.i);
    const v = b.dataset.v;
    state[p][id] = state[p][id] === v && p !== 'B' ? undefined : v;
    if (p === 'B') stepB.cur++;
  }
  rerenderInspect();
});

renderTabs();
renderMain();
</script>
